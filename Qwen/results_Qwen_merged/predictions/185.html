<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minerals Technologies - Workforce</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }

   .top-bar {
      background-color: #333333;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

   .top-bar-links a {
      color: white;
      text-decoration: none;
      margin: 0 5px;
    }

   .search-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

   .main-nav {
      background-color: #f5f5f5;
      padding: 15px 20px;
      display: flex;
      align-items: center;
    }

   .logo {
      width: 80px;
      height: 80px;
      background-color: #0066cc;
      margin-right: 20px;
    }

   .main-nav a {
      color: #333;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

   .hero {
      text-align: center;
      padding: 50px 20px;
      background-color: #f9f9f9;
    }

   .hero h1 {
      font-size: 3.5rem;
      color: #333;
    }

   .breadcrumb {
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      font-size: 14px;
      color: #666;
    }

   .breadcrumb a {
      color: #333;
      text-decoration: none;
    }

   .breadcrumb a:hover {
      text-decoration: underline;
    }

   .breadcrumb span {
      margin: 0 5px;
    }

   .content {
      display: flex;
      margin: 20px;
      gap: 20px;
    }

   .main-content {
      flex: 1;
      background-color: white;
      padding: 20px;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

   .main-content h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

   .main-content p {
      margin-bottom: 20px;
    }

   .mission-link {
      color: #e74c3c;
      text-decoration: none;
      font-weight: bold;
    }

   .mission-link:hover {
      text-decoration: underline;
    }

   .sidebar {
      width: 250px;
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

   .sidebar h3 {
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

   .sidebar ul {
      list-style: none;
    }

   .sidebar li {
      margin-bottom: 10px;
    }

   .sidebar a {
      color: #333;
      text-decoration: none;
    }

   .sidebar a:hover {
      text-decoration: underline;
    }

   .footer {
      background-color: #222222;
      color: white;
      padding: 30px 20px;
    }

   .footer-columns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

   .footer h4 {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

   .footer ul {
      list-style: none;
    }

   .footer li {
      margin-bottom: 10px;
    }

   .footer a {
      color: white;
      text-decoration: none;
    }

   .footer a:hover {
      text-decoration: underline;
    }
