<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

   .top-bar {
      text-align: right;
      padding: 10px 0;
      margin: 0;
      width: 100%;
      max-width: 600px;
    }

   .password-button {
      background: white;
      border: 1px solid #ddd;
      padding: 5px 15px;
      border-radius: 4px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      display: inline-block;
    }

   .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 0;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0;
      margin-top: 10px;
      color: #666;
    }

    p {
      margin: 20px 0;
      font-size: 1rem;
      line-height: 1.5;
    }

   .email-container {
      display: flex;
      margin: 20px 0;
      gap: 10px;
    }

   .email-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px 0 0 4px;
      outline: none;
      font-size: 1rem;
      width: 100%;
    }

   .notify-button {
      background: #4a6fa5;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: background 0.2s;
    }

   .notify-button:hover {
      background: #3a5a8a;
    }

   .share-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

   .share-button {
      padding: 5px 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

   .share-button:hover {
      border-color: #4a6fa5;
      background: #f0f5ff;
    }

   .powered-by {
      text-align: center;
      font-size: 0.9rem;
      color: #666;
      margin-top: 20px;
      font-style: italic;
    }

   .powered-by a {
      color: #4a6fa5;
      text-decoration: none;
    }

   .powered-by a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="#" class="password-button">ENTER USING PASSWORD →</a>
  </div>
  <div class="container">
    <h1>FirstFishOnline</h1>
    <h2>COMING SOON</h2>
    <p>Gone Fishing, check back again.</p>
    <p>Be the first to know when we launch.</p>
    <div class="email-container">
      <input type="email" placeholder="Email address" class="email-input">
      <button class="notify-button">NOTIFY ME</button>
    </div>
    <p>Spread the word</p>
    <div class="share-buttons">
      <button class="share-button">SHARE</button>
      <button class="share-button">TWEET</button>
      <button class="share-button">PIN IT</button>
    </div>
    <p class="powered-by">This shop will be powered by <a href="#">Shopify</a></p>
  </div>
</body>
</html>
