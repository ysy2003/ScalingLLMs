<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
       .container {
            max-width: 350px;
            width: 100%;
            background: #222222;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
       .title {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
            color: white;
        }
       .subtitle {
            font-size: 20px;
            font-weight: bold;
            margin: 0;
            color: white;
            margin-top: 5px;
        }
       .button {
            background: #d48c4d;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }
       .blue-box {
            height: 200px;
            background: #0000ff;
            border-radius: 10px;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">TOGEL SGP</div>
        <div class="subtitle">ISTANA168</div>
        <button class="button">Login</button>
        <button class="button">Daftar</button>
        <div class="blue-box"></div>
    </div>
</body>
</html>
