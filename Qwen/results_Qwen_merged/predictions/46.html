<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor EnGenius</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }
    header {
      background-color: #29B6F6;
      color: white;
      padding: 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
    }
   .top-left {
      display: flex;
      align-items: center;
    }
   .logo {
      width: 20px;
      height: 20px;
      background-color: #0D47A1;
      margin-right: 10px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
   .search-bar {
      background-color: #4FC3F7;
      border-radius: 4px;
      padding: 10px 20px;
      width: 100%;
      max-width: 600px;
    }
   .search-bar input {
      background-color: transparent;
      border: none;
      width: 100%;
      padding: 5px;
      color: #000;
    }
   .top-right {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }
   .top-right a {
      color: white;
      text-decoration: none;
      margin-left: 10px;
    }
    main {
      padding: 20px;
    }
   .card {
      background-color: white;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
   .icon {
      width: 20px;
      height: 20px;
      background-color: #0D47A1;
      margin-bottom: 10px;
    }
   .card h2 {
      font-size: 16px;
      margin-bottom: 5px;
    }
   .card p {
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <div class="top-left">
      <div class="logo"></div>
    </div>
    <h1>Welcome to Doctor EnGenius</h1>
    <div class="search-bar">
      <input type="text" placeholder="Search for articles...">
    </div>
    <div class="top-right">
      <a href="#">Go to EnGenius Technologies</a>
      <a href="#">English</a>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="icon"></div>
      <h2>Frequently Asked Questions</h2>
      <p>75 articles</p>
    </div>
    <div class="card">
      <div class="icon"></div>
      <h2>Wireless Networking</h2>
      <p>322 articles</p>
    </div>
    <div class="card">
      <div class="icon"></div>
      <h2>Wired Networking</h2>
      <p>61 articles</p>
    </div>
    <div class="card">
      <div class="icon"></div>
      <h2>Telephony Systems</h2>
      <p>61 articles</p>
    </div>
    <div class="card">
      <div class="icon"></div>
      <h2>IP Surveillance Cameras</h2>
      <p>26 articles</p>
    </div>
  </main>
</body>
</html>
