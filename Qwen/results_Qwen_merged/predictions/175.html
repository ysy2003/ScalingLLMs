<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Protected</title>
  <style>
    body {
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
   .container {
      background-color: #333333;
      color: white;
      padding: 25px;
      border-radius: 4px;
      max-width: 400px;
      text-align: center;
      box-sizing: border-box;
    }
   .header {
      font-size: 1.2em;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 15px;
    }
   .prompt {
      font-size: 0.9em;
      color: #999999;
      margin-bottom: 15px;
    }
   .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
   .password-input {
      flex: 1;
      padding: 8px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      background-color: white;
      font-size: 1em;
      outline: none;
    }
   .login-btn {
      background-color: #e0e0e0;
      color: #333333;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="header">This area is password<br>protected</h2>
    <p class="prompt">Please enter the password below</p>
    <div class="input-group">
      <input type="password" class="password-input">
      <button class="login-btn">Login</button>
    </div>
  </div>
</body>
</html>
