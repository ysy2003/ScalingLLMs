<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diana Boanas Artist</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      padding: 20px 0;
    }
    h1 {
      font-size: 2.5em;
      margin: 0;
    }
    nav {
      margin: 10px 0;
      text-align: center;
    }
    nav a {
      text-decoration: none;
      color: #666;
      margin: 0 5px;
    }
    section {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      text-align: left;
    }
    h2 {
      text-align: center;
      margin-top: 0;
    }
    p {
      text-align: center;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      display: block;
      margin: 10px 0;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 0;
    }
    button {
      background-color: #f0f0f0;
      border: none;
      padding: 8px;
      margin: 10px 0;
      cursor: pointer;
      border-radius: 0;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Diana Boanas Artist</h1>
  </header>
  <nav>
    <a href="#">home</a> | <a href="#">galleries</a> | <a href="#">about</a> | <a href="#">news and current exhibitions</a>
  </nav>
  <section>
    <h2>Contact me</h2>
    <p>Use this form to contact us. Please remember to check your email details are correct!</p>
    <form>
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Your email</label>
      <input type="email" id="email" name="email" required>
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
  <footer>
    Powered by Clikpic
  </footer>
</body>
</html>
