<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Not Found</title>
  <style>
    body {
      background-color: #e0e0e0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
   .container {
      background-color: white;
      border-radius: 12px;
      padding: 20px;
      max-width: 800px;
      width: 100%;
      box-sizing: border-box;
    }
   .top-right-indicators {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
   .indicator {
      width: 10px;
      height: 10px;
      background-color: #0066cc;
      margin: 0 2px;
      display: inline-block;
      border-radius: 2px;
    }
    h1 {
      color: #0066cc;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    p {
      color: #333;
      line-height: 1.5;
      margin-bottom: 10px;
    }
   .blue-square {
      width: 100px;
      height: 100px;
      background-color: #0066cc;
      margin: 20px auto;
      display: block;
    }
   .footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-right-indicators">
      <div class="indicator"></div>
      <div class="indicator"></div>
      <div class="indicator"></div>
    </div>
    <h1>permafrost.today is not found</h1>
    <p>permafrost.today is not found in the configuration on this server. It might be because of a newly changed or wrong DNS pointer, or a reconfiguration of the server.</p>
    <p>Please contact customer support if the problem persists.</p>
    <div class="blue-square"></div>
    <div class="footer">Domenshop AS © 2023</div>
  </div>
</body>
</html>
