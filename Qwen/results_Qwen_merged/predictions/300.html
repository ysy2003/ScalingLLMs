<!DOCTYPE html>
<html>
<head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: #ffffff;
    line-height: 1.6;
    color: #666666;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

 .top-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 30px;
    width: 100%;
  }

 .top-bar button {
    background-color: #f5f5f5;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
    font-size: 14px;
  }

 .top-bar button:hover {
    background-color: #e0e0e0;
  }

 .container {
    max-width: 600px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: 36px;
    font-weight: 700;
    margin: 20px 0;
    color: #666666;
  }

  h2 {
    font-size: 18px;
    text-transform: uppercase;
    margin: 10px 0;
    color: #666666;
  }

  p {
    margin: 15px 0;
    color: #666666;
  }

 .email-form {
    display: flex;
    justify-content: center;
    margin: 25px 0;
    gap: 10px;
  }

 .email-form input {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px 0 0 4px;
    width: 250px;
    font-size: 14px;
    outline: none;
  }

 .email-form button {
    background-color: #4a6fa5;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 0 4px 4px 0;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
    font-size: 14px;
  }

 .email-form button:hover {
    background-color: #3a5c90;
  }

  h3 {
    font-size: 16px;
    margin: 20px 0 10px;
    color: #666666;
  }

 .share-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 15px 0;
  }

 .share-buttons button {
    background-color: white;
    border: 1px solid #ddd;
    padding: 8px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.2s;
    font-size: 14px;
  }

 .share-buttons button:hover {
    background-color: #f5f5f5;
  }

 .powered-by {
    text-align: center;
    color: #666666;
    font-size: 12px;
    margin-top: 20px;
  }

 .powered-by a {
    color: #4a6fa5;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <button>ENTER USING PASSWORD →</button>
  </div>
  <div class="container">
    <h1>The Old Rectory Clothing Co</h1>
    <h2>COMING SOON</h2>
    <p>Currently closed</p>
    <p>Be the first to know when we launch.</p>
    <div class="email-form">
      <input type="email" placeholder="Email address">
      <button>NOTIFY ME</button>
    </div>
    <h3>Spread the word</h3>
    <div class="share-buttons">
      <button>SHARE</button>
      <button>TWEET</button>
      <button>PIN IT</button>
    </div>
    <p class="powered-by">This shop will be powered by <a href="#">Shopify</a></p>
  </div>
</body>
</html>
