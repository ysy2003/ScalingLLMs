<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mailchimp Domain Connection</title>
  <style>
    body {
      background-color: #f9f0e8;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
   .top-blue-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 100px;
      height: 30px;
      background-color: #0056d0;
    }
   .main-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      max-width: 1200px;
      padding: 20px;
      gap: 20px;
    }
   .text-container {
      flex: 1;
      min-width: 250px;
      margin-right: 20px;
    }
   .blue-square {
      flex: 0 0 300px;
      width: 300px;
      height: 300px;
      background-color: #0056d0;
    }
    h1 {
      font-size: 24px;
      line-height: 1.5;
      margin: 0;
      color: #000;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      margin: 10px 0 0 0;
      color: #000;
    }
    button {
      background-color: #008080;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #006666;
    }
    @media (max-width: 768px) {
     .blue-square {
        width: 100%;
        height: 300px;
      }
     .text-container {
        margin-right: 0;
      }
     .main-content {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="top-blue-bar"></div>
  <div class="main-content">
    <div class="text-container">
      <h1>thelodgeonamherstisland.co<br>m is connected with<br>Mailchimp</h1>
      <p>Put your catchiest ideas online with your own domain.</p>
      <button>Find Your Domain</button>
    </div>
    <div class="blue-square"></div>
  </div>
</body>
</html>
