<!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Producer Application</title>
          <style>
            /* CSS here */
          </style>
        </head>
        <body>
          <div class="blue-header"></div>
          <div class="pink-header">Producer Application</div>
          <form>
            <p>Tell us a little about you and your experience. FAQ for more information.</p>

            <!-- First Name -->
            <div class="form-group">
              <label for="first-name" class="required">First Name <span class="asterisk">*</span></label>
              <input type="text" id="first-name" name="first-name" required>
            </div>

            <!-- Last Name -->
            <div class="form-group">
              <label for="last-name" class="required">Last Name <span class="asterisk">*</span></label>
              <input type="text" id="last-name" name="last-name" required>
            </div>

            <!-- Email Address -->
            <div class="form-group">
              <label for="email" class="required">Email Address <span class="asterisk">*</span></label>
              <input type="email" id="email" name="email" required>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
              <label for="phone" class="required">Phone Number <span class="asterisk">*</span></label>
              <input type="tel" id="phone" name="phone" required>
            </div>

            <!-- Where Do You Live? -->
            <div class="form-group">
              <label for="location" class="required">Where Do You Live? <span class="asterisk">*</span></label>
              <input type="text" id="location" name="location" required>
            </div>

            <!-- Age -->
            <div class="form-group">
              <label class="required">I am at Least 18 Years of Age <span class="asterisk">*</span></label>
              <div class="checkbox-group">
                <input type="checkbox" id="age" name="age" required>
                <label for="age">Yes</label>
              </div>
            </div>

            <!-- Production Company -->
            <div class="form-group">
              <label class="required">Do You Have a Production Company? <span class="asterisk">*</span></label>
              <div class="radio-group">
                <label><input type="radio" name="production-company" value="yes"> Yes</label>
                <label><input type="radio" name="production-company" value="no"> No</label>
              </div>
            </div>

            <!-- Tell Us More -->
            <div class="form-group">
              <label class="required">Tell Us More About You. <span class="asterisk">*</span></label>
              <textarea id="more-about" name="more-about" required></textarea>
            </div>

            <!-- Preferred Genre -->
            <div class="form-group">
              <label class="required">Preferred Genre <span class="asterisk">*</span></label>
              <select id="preferred-genre" name="preferred-genre" required>
                <option value="">Select a genre</option>
              </select>
            </div>

            <!-- Confidence -->
            <div class="form-group">
              <label class="required">Are You Confident You Can Create Full-Length Episodes (12-25 minutes) on a Low-Budget and Continue to Create Episodes if they are Renewed by Candivan Subscribers? <span class="asterisk">*</span></label>
              <div class="radio-group">
                <label><input type="radio" name="confidence" value="yes"> Yes</label>
                <label><input type="radio" name="confidence" value="no"> No</label>
              </div>
            </div>

            <!-- Production Timeline -->
            <div class="form-group">
              <label class="required">If Selected as a Winner, Would You be Able to Start Production by this May or June (2019)? <span class="asterisk">*</span></label>
              <div class="radio-group">
                <label><input type="radio" name="timeline" value="yes"> Yes</label>
                <label><input type="radio" name="timeline" value="no"> No</label>
              </div>
            </div>

            <!-- Collaborate -->
            <div class="form-group">
              <label>Names of Others Plan to Collaborate with (if Applicable)</label>
              <textarea id="collaborate" name="collaborate"></textarea>
            </div>

            <!-- PGA -->
            <div class="form-group">
              <label class="required">Are you a member of the PGA? <span class="asterisk">*</span></label>
              <div class="radio-group">
                <label><input type="radio" name="pga" value="yes"> Yes</label>
                <label><input type="radio" name="pga" value="no"> No</label>
              </div>
            </div>

            <!-- Social Networks (optional) -->
            <div class="form-group">
              <div class="optional-note">OPTIONAL: Those with large social networks are preferable. Feel free to list any large networks you are part of or your Twitter.</div>
              <textarea id="social-networks" name="social-networks"></textarea>
              <div class="char-counter">0/800 characters</div>
            </div>

            <!-- How did you find out? -->
            <div class="form-group">
              <label class="required">How did you find out about us? <span class="asterisk">*</span></label>
              <select id="how-found" name="how-found" required>
                <option value="">Select an option</option>
              </select>
            </div>

            <!-- Terms -->
            <div class="terms">
              <input type="checkbox" id="terms" name="terms" required>
              <label for="terms">I Have Read and I Accept the Terms and Conditions Below</label>
            </div>
            <a href="#" class="terms-link">Terms and Conditions</a>

            <div class="footer">
              <span>Report abuse</span>
              <span>Powered by <span class="logo"></span></span>
            </div>

            <button type="submit" class="submit-button">Submit</button>
          </form>
        </body>
        </html>
