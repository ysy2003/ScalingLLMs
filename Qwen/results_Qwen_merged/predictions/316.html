<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSSOLA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #ffffff;
      padding: 0;
      margin: 0;
    }

    header {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 0;
    }

   .header-container {
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

   .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 1.5rem;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

   .nav-links {
      display: flex;
      gap: 1.5rem;
    }

   .nav-links a {
      text-decoration: none;
      color: #000;
      font-weight: bold;
    }

   .search-btn {
      background: none;
      border: none;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      font-size: 1rem;
      cursor: pointer;
    }

    main {
      max-width: 800px;
      margin: 2rem auto;
      text-align: center;
    }

    main p {
      font-size: 1.2rem;
      margin: 2rem 0;
    }

    footer {
      max-width: 800px;
      margin: 2rem auto;
      text-align: center;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <h1>MUSSOLA</h1>
      <p class="subtitle">Recursos per a la cerca de feina</p>
      <nav>
        <div class="nav-links">
          <a href="#">Cerca de feina</a>
          <a href="#">Biblioteca</a>
          <a href="#">Contacte</a>
        </div>
        <a href="#" class="search-btn">CERCA</a>
      </nav>
    </div>
  </header>
  <main>
    <p>La pàgina que cercàveu en aquest blog no existeix.</p>
  </main>
  <footer>
    <p>Amb la tecnologia de Blogger</p>
  </footer>
</body>
</html>
