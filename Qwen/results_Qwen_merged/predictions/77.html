<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sleepisfamous</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #ffffff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #ffffff;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: normal;
    }
    nav {
      display: flex;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: #333;
      margin: 0 0.5rem;
    }
    nav span {
      color: #666;
    }
    main {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      padding: 2rem;
    }
   .product-info {
      flex: 1;
      min-width: 300px;
    }
   .product-info h3 {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 1rem;
    }
   .product-info h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
   .product-info p {
      margin-bottom: 1rem;
    }
   .price {
      font-weight: bold;
      margin-bottom: 1rem;
    }
   .quantity {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
   .quantity input {
      width: 40px;
      height: 30px;
      text-align: center;
      border: 1px solid #ccc;
      padding: 0;
    }
   .quantity button {
      background: #f0f0f0;
      border: 1px solid #ccc;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
   .social {
      margin-top: 1rem;
    }
   .social a {
      text-decoration: none;
      color: #333;
      margin: 0 0.25rem;
    }
   .product-image {
      flex: 1;
      min-width: 300px;
    }
   .blue-box {
      width: 100%;
      height: 400px;
      background-color: #0000ff;
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #333;
      color: #fff;
    }
    footer p {
      margin: 0;
    }
    @media (min-width: 768px) {
      main {
        flex-direction: row;
      }
     .product-info,.product-image {
        min-width: 300px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>sleepisfamous</h1>
    <nav>
      <a href="#">Shop</a>
      <a href="#">Pages</a>
      <span>0 Items: $0.00</span>
    </nav>
  </header>
  <main>
    <section class="product-info">
      <h3>All products</h3>
      <h2>Snapback</h2>
      <p>Black Sleep snapback with bitchin' white puff embroidery. One size fits most.</p>
      <p class="price">$30.00</p>
      <div class="quantity">
        <input type="number" min="1" value="1">
        <button>Add to Cart</button>
        <span class="price">$30.00</span>
      </div>
      <div class="social">
        <a href="#">Tweet</a> | <a href="#">Share</a> | <a href="#">Pin</a>
      </div>
    </section>
    <section class="product-image">
      <div class="blue-box"></div>
    </section>
  </main>
  <footer>
    <p>&copy; 2023 sleepisfamous</p>
    <p>Powered by Big Cartel</p>
  </footer>
</body>
</html>
