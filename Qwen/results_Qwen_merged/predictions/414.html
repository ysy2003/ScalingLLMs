<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cottage on Blackbird Lane</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f9f9f9;
    }

    header {
      text-align: center;
      padding: 20px 0;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2.5em;
      color: #6a5a3a;
      margin-bottom: 10px;
    }

   .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 10px;
    }

   .header-nav nav {
      display: flex;
      align-items: center;
    }

   .header-nav nav a {
      color: #6a5a3a;
      text-decoration: none;
      margin: 0 5px;
    }

   .header-nav.search {
      color: #6a5a3a;
      text-decoration: none;
    }

   .container {
      display: flex;
      flex-wrap: wrap;
      max-width: 1200px;
      margin: 0 auto;
    }

   .sidebar {
      flex: 0 0 20%;
      padding-right: 20px;
    }

   .sidebar h3 {
      color: #6a5a3a;
      margin-bottom: 10px;
    }

   .sidebar ul {
      list-style: none;
    }

   .sidebar li {
      margin-bottom: 5px;
    }

   .sidebar a {
      color: #e67e22;
      text-decoration: none;
    }

   .sidebar a:hover {
      text-decoration: underline;
    }

   .content {
      flex: 1;
      padding: 0 20px;
    }

   .post {
      margin-bottom: 30px;
    }

   .post-date {
      font-size: 0.9em;
      color: #777;
      margin-bottom: 10px;
    }

   .post h2 {
      font-size: 1.8em;
      color: #6a5a3a;
      margin-bottom: 15px;
    }

   .post p {
      margin-bottom: 15px;
    }

   .post-actions {
      margin-bottom: 15px;
    }

   .post-actions a {
      color: #a0a0a0;
      text-decoration: none;
      margin-right: 5px;
    }

   .post-actions a:hover {
      text-decoration: underline;
    }

   .post-labels {
      color: #a0a0a0;
      margin-bottom: 15px;
    }

   .comments-section {
      margin-bottom: 15px;
    }

   .comments-section h3 {
      color: #6a5a3a;
      margin-bottom: 5px;
    }

   .comments-section a {
      color: #e67e22;
      text-decoration: none;
    }

   .popular-posts {
      margin-top: 30px;
    }

   .popular-posts h3 {
      color: #6a5a3a;
      margin-bottom: 15px;
    }

   .post-item {
      margin-bottom: 25px;
    }

   .post-image {
      width: 100%;
      height: 200px;
      background-color: #0000ff;
      margin-bottom: 10px;
    }

   .post-meta {
      display: flex;
      flex-direction: column;
    }

   .post-meta.date {
      color: #777;
      font-size: 0.9em;
      margin-bottom: 5px;
    }

   .post-meta h3 {
      font-size: 1.2em;
      color: #6a5a3a;
      margin-bottom: 5px;
    }

   .post-meta.post-actions {
      display: flex;
      align-items: center;
    }

      color: #a0a0a0;
      text-decoration: none;
