```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enagic Client ID</title>
    <style>
        /* Basic Reset & Body Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #000000; /* Black background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Full viewport height */
            color: #ffffff; /* White text color */
            text-align: center;
        }

        /* Main container for the content */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px; /* Space between elements */
            max-width: 90%; /* Ensure it doesn't stretch too wide on large screens */
            padding: 20px;
        }

        /* Blue box styling */
        .blue-box {
            width: 250px; /* Fixed width */
            height: 150px; /* Fixed height */
            background-color: #0000FF; /* Blue color */
            margin-bottom: 20px; /* Space below the box */
        }

        /* Question text styling */
        .question-text {
            font-size: 1.2em; /* Slightly larger font for readability */
            line-height: 1.4;
            margin-bottom: 10px; /* Space below the text */
        }

        /* Button container styling */
        .button-group {
            display: flex;
            gap: 20px; /* Space between buttons */
            flex-wrap: wrap; /* Allow buttons to wrap on smaller screens */
            justify-content: center;
        }

        /* Button styling */
        .button {
            background-color: #FFA500; /* Orange color */
            color: #ffffff; /* White text */
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 8px; /* Slightly rounded corners */
            cursor: pointer;
            transition: background-color 0.3s ease;
            min-width: 100px; /* Minimum width for buttons */
        }

        .button:hover {
            background-color: #FF8C00; /* Darker orange on hover */
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .blue-box {
                width: 200px;
                height: 120px;
            }

            .question-text {
                font-size: 1em;
            }

            .button {
                padding: 10px 20px;
                font-size: 0.9em;
                min-width: 80px;
            }

            .button-group {
                gap: 15px;
            }

            .container {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="blue-box"></div>
        <p class="question-text">Do you have an Enagic Client ID Number?</p>
        <div class="button-group">
            <button class="button">YES</button>
            <button class="button">NO</button>
        </div>
    </div>
</body>
</html>
