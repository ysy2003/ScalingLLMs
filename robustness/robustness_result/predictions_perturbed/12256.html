```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura Fisher</title>
    <style>
        /* Basic Reset & Body Styling */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #1a1a1a; /* Dark gray/black background */
            color: white;
            min-height: 100vh; /* Ensure body takes full viewport height */
            display: flex;
            flex-direction: column; /* Arrange header, main, footer vertically */
        }

        /* Header Styling */
        header {
            position: relative; /* For absolute positioning of nav and h1 */
            width: 100%;
            min-height: 180px; /* Sufficient height to contain h1 and nav */
            box-sizing: border-box;
        }

        header nav {
            position: absolute;
            top: 30px; /* Distance from top of header */
            left: 30px; /* Distance from left of header */
            display: flex;
            gap: 20px; /* Space between navigation links */
            z-index: 10; /* Ensure nav is above h1 if they overlap */
        }

        header nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: opacity 0.2s ease;
        }

        header nav a:hover {
            opacity: 0.8;
        }

        header h1 {
            position: absolute;
            top: 60px; /* Distance from top of header */
            left: 50%;
            transform: translateX(-50%); /* Center horizontally */
            margin: 0;
            font-family: "Brush Script MT", cursive; /* Approximation for script font */
            font-size: 80px;
            line-height: 0.9; /* Adjust line height for "Laura Fisher" */
            text-align: center;
            white-space: nowrap; /* Prevent text wrapping */
            z-index: 5;
        }

        /* Main Content Styling (Grid) */
        main {
            flex-grow: 1; /* Allow main content to take available vertical space */
            display: flex;
            justify-content: center; /* Center grid horizontally */
            align-items: center; /* Center grid vertically */
            padding: 20px; /* Padding around the grid */
            box-sizing: border-box;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Two columns, equal width */
            gap: 20px; /* Gap between grid items */
            max-width: 1200px; /* Max width for the grid */
            width: 100%; /* Ensure grid takes full width up to max-width */
            margin-bottom: 50px; /* Space above the footer */
        }

        .grid-item {
            background-color: #0000FF; /* Blue color for the boxes */
            aspect-ratio: 16 / 9; /* Maintain a rectangular aspect ratio */
            position: relative; /* For positioning the circle inside */
        }

        /* Styling for the semi-transparent circle in the last item */
        .grid-item.last-item .circle {
            position: absolute;
            bottom: 20px; /* Distance from bottom of grid item */
            right: 20px; /* Distance from right of grid item */
            width: 40px; /* Size of the circle */
            height: 40px;
            background-color: rgba(100, 100, 255, 0.5); /* Semi-transparent blue */
            border-radius: 50%; /* Make it a circle */
        }

        /* Footer Styling */
        footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 14px;
            color: #aaaaaa; /* Slightly lighter gray for footer text */
            margin-top: auto; /* Push footer to the bottom if content is short */
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            header {
                min-height: 150px; /* Adjust header height for smaller screens */
            }
            header h1 {
                font-size: 60px; /* Smaller font for h1 */
                top: 50px; /* Adjust h1 position */
            }

            header nav {
                top: 20px; /* Adjust nav position */
                left: 20px;
                gap: 15px;
            }

            header nav a {
                font-size: 14px; /* Smaller nav links */
            }

            .grid-container {
                grid-template-columns: 1fr; /* Stack grid items in a single column */
                gap: 15px;
                margin-bottom: 30px;
            }

            .grid-item.last-item .circle {
                bottom: 15px;
                right: 15px;
                width: 30px;
                height: 30px;
            }

            footer {
                padding: 20px 15px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            header {
                min-height: 120px; /* Further adjust header height */
            }
            header h1 {
                font-size: 45px; /* Even smaller font for h1 */
                top: 40px;
            }
            header nav {
                top: 15px;
                left: 15px;
                gap: 10px;
            }
            header nav a {
                font-size: 12px;
            }
            .grid-container {
                gap: 10px;
            }
            .grid-item.last-item .circle {
                bottom: 10px;
                right: 10px;
                width: 25px;
                height: 25px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="#">Work</a>
            <a href="#">Info</a>
            <a href="#">Contact</a>
        </nav>
        <h1>Laura Fisher</h1>
    </header>

    <main>
        <div class="grid-container">
            <div class="grid-item"></div>
            <div class="grid-item"></div>
            <div class="grid-item"></div>
            <div class="grid-item last-item">
                <div class="circle"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>Powered by Adobe Portfolio</p>
    </footer>
</body>
</html>
