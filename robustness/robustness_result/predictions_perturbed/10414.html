```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Jobs</title>
    <style>
        /* Basic Reset & Body Styling */
        body {
            margin: 0;
            height: 100vh; /* Full viewport height */
            display: flex;
            justify-content: center; /* Center content horizontally */
            align-items: center; /* Center content vertically */
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif; /* Clean sans-serif font stack */
            background: linear-gradient(to right, #1a1a1a 50%, #5cb82e 50%); /* Split background: black on left, green on right */
            color: white; /* Default text color for the main title */
            text-align: center; /* Ensure text is centered within its container */
            overflow: hidden; /* Prevent scrollbars if content slightly overflows */
        }

        /* Content Wrapper for Text */
        .content-wrapper {
            display: flex;
            flex-direction: column; /* Stack text elements vertically */
            align-items: center; /* Center text lines horizontally within the wrapper */
            justify-content: center; /* Center the block of text vertically within available space */
            padding: 20px; /* Add some padding to prevent text from touching screen edges on very small screens */
            box-sizing: border-box; /* Include padding in the element's total width and height */
            width: 100%; /* Allow the wrapper to take full width for centering purposes */
        }

        /* Main Title Styling */
        .main-title {
            font-size: 8vw; /* Responsive font size based on viewport width */
            font-weight: 700; /* Bold font weight */
            margin-bottom: 2vh; /* Space between main title and subtitle */
            line-height: 1.1; /* Slightly adjust line height for better appearance */
            text-transform: uppercase; /* Ensure text is uppercase as in the image */
            margin-top: 0; /* Remove default h1 top margin */
        }

        /* Subtitle Styling */
        .subtitle {
            font-size: 2.5vw; /* Responsive font size */
            color: #cccccc; /* Light gray color */
            font-weight: 400; /* Normal font weight */
            line-height: 1.2; /* Slightly adjust line height */
            text-transform: uppercase; /* Ensure text is uppercase as in the image */
            margin-top: 0; /* Remove default p top margin */
            margin-bottom: 0; /* Remove default p bottom margin */
        }

        /* Responsive Adjustments for smaller screens */
        @media (max-width: 768px) {
            .main-title {
                font-size: 12vw; /* Larger font size on medium screens */
                margin-bottom: 1.5vh;
            }
            .subtitle {
                font-size: 4vw; /* Larger font size on medium screens */
            }
        }

        @media (max-width: 480px) {
            .main-title {
                font-size: 15vw; /* Even larger font size on very small screens */
                margin-bottom: 1vh;
            }
            .subtitle {
                font-size: 5vw; /* Even larger font size on very small screens */
            }
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <h1 class="main-title">GLOBAL JOBS</h1>
        <p class="subtitle">HELLO, WE WILL BE RIGHT BACK VERY SHORTLY.</p>
    </div>
</body>
</html>
