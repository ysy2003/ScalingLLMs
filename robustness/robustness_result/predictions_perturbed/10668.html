<!DOCTYPE html>
<html>
<head>
    <title>DeeKnow's Grotto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #333;
        }

        .container {
            max-width: 960px; /* Approximate width based on image */
            margin: 20px auto; /* Center the container */
        }

        .top-section {
            display: grid;
            grid-template-columns: 180px 1fr; /* Fixed sidebar width, fluid content */
            grid-template-rows: auto auto 1fr; /* h1, blue boxes, main content */
            gap: 10px 20px; /* Row gap, Column gap */
        }

        .top-section h1 {
            grid-column: 1 / -1; /* Span across both columns */
            margin: 0;
            padding-left: 10px;
            color: #555;
            font-size: 2.5em;
        }

        .blue-box-small {
            grid-column: 1 / 2; /* First column */
            grid-row: 2 / 3; /* Second row */
            width: 50px;
            height: 70px;
            background-color: blue;
            margin-left: 10px; /* Align with h1 padding */
        }

        .blue-box-large {
            grid-column: 2 / 3; /* Second column */
            grid-row: 2 / 3; /* Second row */
            height: 70px;
            background-color: blue;
        }

        .sidebar-container {
            grid-column: 1 / 2; /* First column */
            grid-row: 3 / 4; /* Third row */
            padding-left: 10px; /* Align with h1 and small blue box */
            /* Effective content width inside sidebar-container is 180px - 10px = 170px */
        }

        .nav-item {
            background-color: #FFFFCC; /* Light yellow */
            padding: 5px 10px; /* 10px left/right padding */
            margin-bottom: 2px;
            border-left: 5px solid #8B4513; /* Brownish border */
            /* Total horizontal space: 5px (border) + 10px (padding-left) + 10px (padding-right) = 25px */
            width: calc(170px - 25px); /* 170px is available width in sidebar-container */
            box-sizing: border-box; /* Ensure padding/border are included in width */
        }

        .nav-item a {
            text-decoration: none;
            color: #333;
            display: block;
        }

        .nav-item a:hover {
            text-decoration: underline;
        }
