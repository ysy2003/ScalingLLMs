<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy M&Ms Easter Individual Parfaits</title>
    <style>
        /* Basic Reset & Body Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #fff;
            color: #333;
            line-height: 1.6;
            font-size: 14px; /* Base font size */
        }

        .container {
            max-width: 800px; /* Constrain content width */
            margin: 0 auto;
            padding: 20px;
        }

        /* Top Controls */
        .top-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .button {
            padding: 8px 15px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            color: #333;
            text-decoration: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            display: inline-block;
            text-align: center;
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        .button:hover {
            background-color: #e0e0e0;
        }

        /* Checkbox styling */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: 15px; /* Spacing from buttons */
        }

        .checkbox-container input[type="checkbox"] {
            /* Hide default checkbox */
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid #999;
            border-radius: 2px;
            background-color: #fff;
            cursor: pointer;
            position: relative;
            top: 1px; /* Fine-tune vertical alignment */
            flex-shrink: 0; /* Prevent checkbox from shrinking */
        }

        .checkbox-container input[type="checkbox"]:checked {
            background-color: #333; /* Darker background when checked */
            border-color: #333;
        }

        .checkbox-container input[type="checkbox"]:checked::after {
            content: '✔'; /* Checkmark character */
            color: #fff;
            font-size: 12px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            line-height: 1;
        }

        .checkbox-container label {
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap; /* Prevent label from wrapping */
        }

        /* Servings control */
        .servings-control {
            display: flex;
            align-items: center;
            margin-left: 20px; /* Spacing from checkboxes */
            gap: 0; /* Remove gap between buttons and input */
        }

        .servings-control .button {
            padding: 8px 12px;
            border-radius: 0;
            border-right: none;
            height: 34px; /* Match input height + padding + border */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .servings-control .button:first-child {
            border-top-left-radius: 3px;
            border-bottom-left-radius: 3px;
        }
        .servings-control .button:last-of-type { /* This targets the + button */
            border-top-right-radius: 3px;
            border-bottom-right-radius: 3px;
            border-right: 1px solid #ccc; /* Add back border for the last button */
        }

        .servings-control input[type="number"] {
            width: 30px;
            padding: 8px 5px;
            border: 1px solid #ccc;
            text-align: center;
            -moz-appearance: textfield; /* Hide arrows in Firefox */
            appearance: textfield; /* Hide arrows in Chrome/Safari */
            border-radius: 0;
            font-size: 14px;
            height: 18px; /* Match button content height */
            box-sizing: border-box;
        }
        /* Hide arrows for number input in Webkit browsers */
        .servings-control input[type="number"]::-webkit-outer-spin-button,
        .servings-control input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .servings-control span {
            margin-left: 10px;
            margin-right: 10px;
            font-size: 14px;
            white-space: nowrap;
        }

        /* Size controls */
        .size-controls {
            display: flex;
            margin-left: 20px; /* Spacing from servings */
            gap: 0;
        }

        .size-controls .button {
            border-radius: 0;
            border-right: none;
        }
        .size-controls .button:first-child {
            border-top-left-radius: 3px;
            border-bottom-left-radius: 3px;
        }
        .size-controls .button:last-child {
            border-top-right-radius: 3px;
            border-bottom-right-radius: 3px;
            border-right: 1px solid #ccc; /* Add back border for the last button */
        }
        .size-controls .button.active {
            background-color: #ddd; /* Active state for 'Normal' */
        }

        /* Main Content Layout */
        .recipe-header {
            display: flex;
            flex-wrap: wrap; /* Allow wrapping on smaller screens */
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .recipe-title-description {
            flex: 1; /* Take up available space */
            min-width: 280px; /* Ensure it doesn't get too small */
            margin-right: 20px; /* Space from blue box */
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 5px;
            color: #333;
        }

        .recipe-description {
            font-size: 14px;
            margin-bottom: 20px;
            color: #555;
        }

        .blue-box-container {
            width: 120px; /* Approximate width from image */
            text-align: center;
            margin-top: 5px; /* Align with title */
            flex-shrink: 0; /* Prevent blue box from shrinking */
        }

        .blue-box {
            width: 120px;
            height: 120px; /* Approximate height from image */
            background-color: #0000FF; /* Blue color */
            margin-bottom: 5px;
        }

        .vote-text {
            font-size: 12px;
            color: #555;
        }

        /* Recipe Details (Course, Cuisine, etc.) */
        .recipe-details {
            display: grid;
            grid-template-columns: auto 1fr; /* Auto for label, 1fr for value */
            gap: 5px 15px; /* Row gap, column gap */
            margin-bottom: 30px;
            max-width: 400px; /* Constrain width for readability */
        }

        .recipe-details strong {
            font-weight: bold;
            color: #333;
        }

        .recipe-details span {
            color: #555;
        }

        /* Headings for sections */
        h2 {
            font-size: 20px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
            color: #333;
        }

        /* Ingredients & Instructions */
        .ingredients-list, .instructions-list {
            margin-bottom: 30px;
        }

        .ingredients-list h3 {
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #333;
        }

        .ingredients-list ul, .instructions-list ol {
            list-style-type: disc; /* Default for ul */
            padding-left: 20px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .instructions-list ol {
            list-style-type: decimal;
        }

        .ingredients-list li, .instructions-list li {
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }

        /* Nutrition */
        .nutrition-info {
            font-size: 14px;
            color: #555;
        }

        .nutrition-info strong {
            font-weight: bold;
            color: #333;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .top-controls {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .checkbox-container, .servings-control, .size-controls {
                margin-left: 0; /* Remove left margin on smaller screens */
            }
            .recipe-header {
                flex-direction: column;
                align-items: center;
            }
            .recipe-title-description {
                margin-right: 0;
                text-align: center;
            }
            .blue-box-container {
                margin-top: 20px;
            }
            .recipe-details {
                grid-template-columns: 1fr; /* Stack labels and values */
                max-width: 100%;
            }
            .recipe-details div {
                display: flex;
                justify-content: space-between;
            }
            .recipe-details strong {
                flex-shrink: 0;
                margin-right: 10px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 10px;
            }
            h1 {
                font-size: 24px;
            }
            h2 {
                font-size: 18px;
            }
            .button, .checkbox-container label, .servings-control input, .servings-control span, .size-controls .button, .ingredients-list li, .instructions-list li, .nutrition-info {
                font-size: 13px;
            }
            .blue-box, .blue-box-container {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
