```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        /* Basic reset and font */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Page layout */
        body {
            background-color: #4141C0; /* Main background blue */
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Full viewport height */
            justify-content: space-between; /* Pushes footer to bottom */
            align-items: center; /* Centers content horizontally */
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1; /* Allows container to grow and push footer down */
            padding: 20px; /* Padding for smaller screens */
            width: 100%; /* Takes full width */
            max-width: 350px; /* Limits width for larger screens */
            box-sizing: border-box; /* Includes padding in width */
        }

        /* Logo placeholder */
        .logo-placeholder {
            width: 100%; /* Takes full width of container */
            max-width: 250px; /* Approximate width from image */
            height: 150px; /* Approximate height from image */
            background-color: #0000FF; /* Bright blue */
            margin-bottom: 40px; /* Space below logo */
        }

        /* Login form styling */
        .login-form {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 15px; /* Space between form elements */
            margin-bottom: 20px; /* Space below form */
        }

        .login-form input {
            padding: 12px 15px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            outline: none; /* Removes outline on focus */
            box-sizing: border-box; /* Includes padding in width */
        }

        .login-form input::placeholder {
            color: #A0A0A0; /* Placeholder text color */
        }

        .login-form button {
            padding: 12px 15px;
            background-color: #4DD0A8; /* Teal/green button */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-sizing: border-box; /* Includes padding in width */
        }

        .login-form button:hover {
            background-color: #3CBF97; /* Slightly darker on hover */
        }

        /* Reset password link */
        .reset-password {
            color: #A0A0A0; /* Darker gray for link */
            text-decoration: none;
            font-size: 0.9em;
            margin-top: 10px; /* Space above link */
            transition: color 0.3s ease;
        }

        .reset-password:hover {
            color: #C0C0C0; /* Lighter on hover */
        }

        /* Footer styling */
        .footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            color: #A0A0A0; /* Darker gray for footer text */
            font-size: 0.9em;
            margin-top: auto; /* Pushes footer to the bottom */
            box-sizing: border-box; /* Includes padding in width */
        }

        /* Responsive adjustments */
        @media (max-width: 400px) {
            .container {
                max-width: 90%; /* Allows container to be wider on very small screens */
            }
            .logo-placeholder {
                height: 100px; /* Smaller logo on small screens */
                margin-bottom: 30px;
            }
            .login-form {
                gap: 10px;
            }
            .login-form input,
            .login-form button {
                padding: 10px 12px;
                font-size: 0.95em;
            }
            .reset-password,
            .footer p {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-placeholder"></div>
        <form class="login-form">
            <input type="email" placeholder="Email address" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <a href="#" class="reset-password">Reset password</a>
    </div>
    <div class="footer">
        <p>About Medallia Journey Analytics</p>
    </div>
</body>
</html>
