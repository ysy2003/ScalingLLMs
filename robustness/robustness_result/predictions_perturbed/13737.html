<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exilers Gaming Community</title>
    <style>
        /* General Body Styles */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #282c34; /* Dark background color */
            color: #f0f0f0; /* Light text color */

        }

        /* Header/Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #282c34; /* Same as body for seamless look */
            color: #f0f0f0;
        }

        .navbar-brand {
            font-size: 1.2em;
            font-weight: 600;
            color: #f0f0f0;
            text-decoration: none;
        }

        .navbar-nav {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            color: #a0a0a0; /* Slightly darker for inactive links */
            text-decoration: none;
            font-size: 1em;
            padding-bottom: 5px; /* Space for underline */
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #f0f0f0;
        }

        .nav-link.active {
            color: #f0f0f0;
            border-bottom: 2px solid #f0f0f0; /* Underline for active link */
        }

        /* Hero Section */
        .hero-section {
            text-align: center;
            padding: 100px 20px 50px; /* Top padding for spacing */
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-title {
            font-size: 3em; /* Large title */
            font-weight: 600;
            margin-bottom: 20px;
            color: #f0f0f0;
        }

        .hero-description {
            font-size: 1.1em;
            color: #d0d0d0; /* Slightly lighter than main text */
            max-width: 700px;
            margin: 0 auto 40px; /* Bottom margin for spacing */
        }

        .find-us-text {
            font-size: 1em;
            color: #f0f0f0;
            margin-bottom: 20px;
        }

        /* Social Buttons */
        .social-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Allow buttons to wrap on smaller screens */
            gap: 15px; /* Space between buttons */
            margin-top: 20px;
        }

        .social-button {
            display: flex;
            align-items: center;
            background-color: #ffffff; /* White background */
            color: #333333; /* Dark text */
            padding: 10px 20px;
            border-radius: 5px; /* Rounded corners */
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); /* Subtle shadow */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .social-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .icon-square {
            width: 18px;
            height: 18px;
            background-color: #0000ff; /* Bright blue square */
            margin-right: 10px;
            flex-shrink: 0; /* Prevent icon from shrinking */
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                padding: 15px 20px;
            }

            .navbar-nav {
                margin-top: 15px;
                gap: 20px;
            }

            .hero-title {
                font-size: 2.5em;
            }

            .hero-description {
                font-size: 1em;
            }

            .social-buttons {
                gap: 10px;
            }

            .social-button {
                padding: 8px 15px;
                font-size: 0.9em;
            }

            .icon-square {
                width: 16px;
                height: 16px;
                margin-right: 8px;
            }
        }

        @media (max-width: 480px) {
            .navbar-brand {
                font-size: 1em;
            }

            .navbar-nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-link {
                font-size: 0.9em;
            }

            .hero-title {
                font-size: 2em;
            }

            .hero-description {
                font-size: 0.9em;
            }

            .social-button {
                width: calc(50% - 20px); /* Two buttons per row */
                justify-content: center;
            }
        }
    </style>
</head>

            </a>
        </div>
    </main>
</body>
</html>
