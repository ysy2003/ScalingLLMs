```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producer Application</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8; /* Light gray background */
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px; /* Based on visual estimation */
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
        }

        /* Header Section */
        .header-blue-block {
            background-color: #0000FF; /* Bright blue */
            height: 200px; /* Visual estimation */
            width: 100%;
        }

        .producer-application-title {
            background-color: #E91E63; /* Pink */
            color: #fff;
            text-align: center;
            padding: 25px 20px;
            font-size: 2.2em; /* Visual estimation */
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Form Section */
        .form-section {
            padding: 30px 40px;
        }

        .intro-text {
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .intro-text a {
            color: #0000FF; /* Blue link */
            text-decoration: none;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95em;
            font-weight: normal;
        }

        .form-group label.radio-label,
        .form-group label.checkbox-label {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 0;
        }

        .form-group label.radio-label input[type="radio"],
        .form-group label.checkbox-label input[type="checkbox"] {
            margin-right: 5px;
            vertical-align: middle;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
            color: #333;
            -webkit-appearance: none; /* Remove default browser styling for select */
            -moz-appearance: none;
            appearance: none;
        }

        .form-group select {
            background-color: #fff;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23000000%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-6.5%200-12.3%203.2-16.1%208.1-3.8%204.9-4.6%2011-2.1%2016.9l139.3%20168.3c4.7%205.7%2011.7%208.7%2019%208.7s14.3-3%2019-8.7L289.5%2091.3c2.5-5.9%201.7-12-2.1-16.9z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 12px auto;
            padding-right: 30px; /* Make space for the arrow */
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group .char-count {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
            text-align: right;
        }

        .required-asterisk {
            color: #FF0000; /* Red */
            margin-left: 2px;
        }

        .name-fields {
            display: flex;
            gap: 20px;
        }

        .name-fields .form-group {
            flex: 1;
            margin-bottom: 0; /* Adjust margin for flex items */
        }

        .terms-link {
            color: #0000FF; /* Blue link */
            text-decoration: none;
            margin-left: 5px;
        }

        /* Footer Section */
        .footer-section {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            margin-top: 30px;
        }

        .footer-left a {
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
        }

        .footer-right {
            display: flex;
            align-items: center;
            font-size: 0.9em;
            color: #666;
        }

        .footer-right .powered-by-square {
            width: 15px;
            height: 15px;
            background-color: #0000FF; /* Blue */
            margin-left: 8px;
        }

        .submit-button-container {
            text-align: center;
            padding: 20px 40px 40px;
        }

        .submit-button {
            background-color: #E91E63; /* Pink */
            color: #fff;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-button:hover {
            background-color: #d81b60; /* Darker pink on hover */
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .form-section {
                padding: 20px 25px;
            }
            .producer-application-title {
                font-size: 1.8em;
                padding: 20px 15px;
            }
            .name-fields {
                flex-direction: column;
                gap: 0;
            }
            .name-fields .form-group {
                margin-bottom: 25px;
            }
            .footer-section {
                flex-direction: column;
                gap: 15px;
                padding: 20px 25px;
            }
            .footer-right {
                margin-top: 10px;
            }
            .submit-button-container {
                padding: 20px 25px 30px;
            }
        }

        @media (max-width: 480px) {
            .container {
                margin: 0;
                box-shadow: none;
            }
            .form-section {
                padding: 15px 20px;
            }
            .producer-application-title {
                font-size: 1.5em;
                padding: 15px 10px;
            }
            .header-blue-block {
                height: 150px;
            }
            .submit-button {
                width: 100%;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-blue-block"></div>
        <div class="producer-application-title">
            Producer Application
        </div>

        <div class="form-section">
            <p class="intro-text">Tell us a little about you and your experience. <a href="#">FAQ</a> for more information.</p>

            <div class="name-fields">
                <div class="form-group">
                    <label for="first-name">First Name <span class="required-asterisk">*</span></label>
                    <input type="text" id="first-name" name="first-name" required>
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name <span class="required-asterisk">*</span></label>
                    <input type="text" id="last-name" name="last-name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address <span class="required-asterisk">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number <span class="required-asterisk">*</span></label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="where-live">Where Do You Live? <span class="required-asterisk">*</span></label>
                <input type="text" id="where-live" name="where-live" required>
            </div>

            <div class="form-group">
                <label>I am at Least 18 Years of Age <span class="required-asterisk">*</span></label>
                <label class="radio-label"><input type="radio" name="age-18" value="yes" required> Yes</label>
                <label class="radio-label"><input type="radio" name="age-18" value="no"> No</label>
            </div>

            <div class="form-group">
                <label>Do You Have a Production Company? <span class="required-asterisk">*</span></label>
                <label class="radio-label"><input type="radio" name="production-company" value="yes" required> Yes</label>
                <label class="radio-label"><input type="radio" name="production-company" value="no"> No</label>
            </div>

            <div class="form-group">
                <label for="about-you">Tell Us More About You. <span class="required-asterisk">*</span></label>
                <textarea id="about-you" name="about-you" required></textarea>
            </div>

            <div class="form-group">
                <label for="preferred-genre">Preferred Genre <span class="required-asterisk">*</span></label>
                <select id="preferred-genre" name="preferred-genre" required>
                    <option value="">Select...</option>
                    <option value="drama">Drama</option>
                    <option value="comedy">Comedy</option>
                    <option value="documentary">Documentary</option>
                    <option value="sci-fi">Sci-Fi</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Are You Confident You Can Create Full-Length Episodes (12-25 minutes) on a Low-Budget and Continue to Create Episodes if they are Renewed by Candivan Subscribers? <span class="required-asterisk">*</span></label>
                <label class="radio-label"><input type="radio" name="confident-episodes" value="yes" required> Yes</label>
                <label class="radio-label"><input type="radio" name="confident-episodes" value="no"> No</label>
            </div>

            <div class="form-group">
                <label>If Selected as a Winner, Would You be Able to Start Production by this May or June (2019)? <span class="required-asterisk">*</span></label>
                <label class="radio-label"><input type="radio" name="start-production" value="yes" required> Yes</label>
                <label class="radio-label"><input type="radio" name="start-production" value="no"> No</label>
            </div>

            <div class="form-group">
                <label for="collaborate-names">Names of Others Plan to Collaborate with (if Applicable)</label>
                <textarea id="collaborate-names" name="collaborate-names"></textarea>
            </div>

            <div class="form-group">
                <label>Are you a member of the PGA? <span class="required-asterisk">*</span></label>
                <label class="radio-label"><input type="radio" name="pga-member" value="yes" required> Yes</label>
                <label class="radio-label"><input type="radio" name="pga-member" value="no"> No</label>
            </div>

            <div class="form-group">
                <label for="social-networks">OPTIONAL: Those with large social networks are preferable. Feel free to list any large networks you are part of or your Twitter.</label>
                <textarea id="social-networks" name="social-networks" maxlength="800"></textarea>
                <div class="char-count">0/800 characters</div>
            </div>

            <div class="form-group">
                <label for="how-found-us">How did you find out about us? <span class="required-asterisk">*</span></label>
                <select id="how-found-us" name="how-found-us" required>
                    <option value="">Select...</option>
                    <option value="social-media">Social Media</option>
                    <option value="friend">Friend/Colleague</option>
                    <option value="website">Website</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="terms-conditions" value="accepted" required>
                    I Have Read and I Accept the <a href="#" class="terms-link">Terms and Conditions</a> Below
                </label>
            </div>
        </div>

        <div class="footer-section">
            <div class="footer-left">
                <a href="#">Report abuse</a>
            </div>
            <div class="footer-right">
                Powered by <div class="powered-by-square"></div>
            </div>
        </div>

        <div class="submit-button-container">
            <button type="submit" class="submit-button">Submit</button>
        </div>
    </div>
</body>
</html>
