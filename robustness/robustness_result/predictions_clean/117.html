```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected Area</title>
    <style>
        /* Basic Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff; /* Default text color for the container */
        }

        .password-protection-container {
            background-color: #3a3a3a; /* Dark gray container background */
            padding: 30px;
            width: 100%;
            max-width: 400px; /* Max width for the container */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        }

        .title {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .separator {
            border-bottom: 1px solid #666; /* Lighter gray line */
            margin-bottom: 20px;
        }

        .instruction-text {
            font-size: 0.95em;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px; /* Space between input and button */
            align-items: center;
        }

        .password-input {
            flex-grow: 1; /* Input takes up available space */
            padding: 10px 12px;
            border: 1px solid #bbb; /* Light gray border for input */
            background-color: #fff; /* White background for input */
            color: #333; /* Text color inside input */
            font-size: 1em;
            outline: none; /* Remove default focus outline */
        }

        .password-input:focus {
            border-color: #888; /* Slightly darker border on focus */
        }

        .login-button {
            background-color: #888; /* Gray button background */
            color: #fff;
            padding: 10px 20px;
            border: 1px solid #888; /* Match button background */
            cursor: pointer;
            font-size: 1em;
            font-weight: normal;
            white-space: nowrap; /* Prevent text wrapping */
            transition: background-color 0.2s ease;
        }

        .login-button:hover {
            background-color: #777; /* Slightly darker on hover */
            border-color: #777;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .password-protection-container {
                margin: 20px; /* Add some margin on very small screens */
                padding: 20px;
            }

            .title {
                font-size: 1.2em;
                margin-bottom: 15px;
            }

            .instruction-text {
                font-size: 0.9em;
                margin-bottom: 10px;
            }

            .password-input,
            .login-button {
                padding: 8px 10px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="password-protection-container">
        <div class="title">This area is password protected</div>
        <div class="separator"></div>
        <div class="instruction-text">Please enter the password below</div>
        <div class="input-group">
            <input type="password" class="password-input" placeholder="">
            <button type="submit" class="login-button">Login</button>
        </div>
    </div>
</body>
</html>
