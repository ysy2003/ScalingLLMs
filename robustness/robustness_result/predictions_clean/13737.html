```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exilers Gaming Community</title>
    <style>
        /* Basic Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Body and overall layout */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #21252b; /* Dark background */
            color: #e0e0e0; /* Light text color */
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header/Navigation */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .site-title {
            font-size: 1.2em;
            font-weight: normal;
            color: #e0e0e0;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #888888; /* Inactive link color */
            text-decoration: none;
            font-size: 1em;
            padding-bottom: 5px; /* Space for underline */
            transition: color 0.3s ease;
        }

        .nav-links a.active {
            color: #ffffff; /* Active link color */
            border-bottom: 2px solid #ffffff; /* Underline for active link */
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .main-heading {
            font-size: 3em;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .description {
            font-size: 1.1em;
            color: #b0b0b0; /* Slightly darker gray for description */
            margin-bottom: 40px;
            max-width: 600px;
        }

        .find-us-text {
            font-size: 1em;
            color: #b0b0b0;
            margin-bottom: 20px;
        }

        .social-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .social-button {
            background-color: #ffffff;
            color: #21252b; /* Dark text for buttons */
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1em;
            white-space: nowrap; /* Prevent text wrapping */
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .social-button:hover {
            background-color: #f0f0f0;
        }

        .social-icon {
            width: 18px;
            height: 18px;
            background-color: #0000ff; /* Blue square icon */
            flex-shrink: 0; /* Prevent icon from shrinking */
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                padding: 15px 20px;
            }

            .site-title {
                margin-bottom: 15px;
            }

            .nav-links {
                gap: 20px;
            }

            .main-heading {
                font-size: 2.2em;
            }

            .description {
                font-size: 1em;
                margin-bottom: 30px;
            }

            .social-button {
                padding: 8px 15px;
                font-size: 0.9em;
            }

            .social-icon {
                width: 16px;
                height: 16px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 10px 15px;
            }

            .site-title {
                font-size: 1em;
            }

            .nav-links {
                gap: 15px;
                font-size: 0.9em;
            }

            .main-heading {
                font-size: 1.8em;
            }

            .description {
                font-size: 0.9em;
                margin-bottom: 25px;
            }

            .find-us-text {
                font-size: 0.9em;
            }

            .social-buttons {
                gap: 10px;
            }

            .social-button {
                padding: 7px 12px;
                font-size: 0.85em;
            }

            .social-icon {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="site-title">Exilers Gaming Community</div>
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Our History</a>
            <a href="#">Charter</a>
        </nav>
    </header>

    <main class="main-content">
        <h1 class="main-heading">Exilers Gaming Community</h1>
        <p class="description">
            We are a mature group of gamers from across the globe been playing together since 2003 enjoying a
            large range of games.
        </p>
        <p class="find-us-text">Find us on:</p>
        <div class="social-buttons">
            <a href="#" class="social-button">
                <span class="social-icon"></span>
                Steam
            </a>
            <a href="#" class="social-button">
                <span class="social-icon"></span>
                Facebook
            </a>
            <a href="#" class="social-button">
                <span class="social-icon"></span>
                Twitter
            </a>
            <a href="#" class="social-button">
                <span class="social-icon"></span>
                Discord
            </a>
            <a href="#" class="social-button">
                <span class="social-icon"></span>
                TeamSpeak
            </a>
        </div>
    </main>
</body>
</html>
