    <title>The Parker Family</title>

        /* Basic Reset */

            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333333; /* Default text color for main content */
            background-color: #f0f0f0; /* A very light gray for the overall page background */
        }

        /* Main Layout Container */
        .container {
            display: flex;
            min-height: 100vh; /* Ensure container takes full viewport height */
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background-color: #333333;
            color: #AAAAAA;
            padding: 20px 0; /* Top/bottom padding, no side padding for links to align to left edge */
            flex-shrink: 0; /* Prevent sidebar from shrinking */
        }

        .sidebar nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar nav ul li {
            margin-bottom: 5px; /* Spacing between links */
        }

        .sidebar nav ul li a {
            display: block;
            padding: 5px 20px; /* Padding for clickable area */
            color: #AAAAAA;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.05em;
        }

        .sidebar nav ul li a:hover {
            color: #FFFFFF; /* Lighter on hover */
        }

        .sidebar nav ul li.main-title-link a {
            font-size: 0.95em; /* Slightly larger */
            font-weight: bold; /* Appears slightly bolder in image */
            color: #FFFFFF; /* Appears white, not light gray */
        }

        .sidebar .secondary-nav {
            margin-top: 30px; /* Space between main and secondary nav groups */
        }
