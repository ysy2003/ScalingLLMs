<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allegion FAQ</title>
    <style>
        /* General Body and Container Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        /* Header Styling */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            background-color: #444444;
            color: #fff;
            min-height: 50px;
        }

        .header-logo {
            background-color: #e66a1a;
            padding: 15px 20px;
            font-weight: bold;
            font-size: 1.2em;
            display: flex;
            align-items: center;
        }

        .header-nav {
            display: flex;
            align-items: center;
            padding-right: 20px;
        }

        .header-nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .header-nav li {
            margin-left: 25px;
        }

        .header-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Search Section */
        .search-section {
            padding: 30px 40px;
            border-bottom: 1px solid #eee;
        }

        .search-section h1 {
            font-size: 1.4em;
            font-weight: normal;
            color: #333;
            margin: 0 0 5px 0;
        }

        .search-section p {
            font-size: 0.9em;
            color: #666;
            margin: 0;
        }

        .search-input-group {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-input-group input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 1em;
            box-sizing: border-box;
            min-width: 200px;
        }

        .search-input-group button {
            background-color: #e66a1a;
            color: #fff;
            padding: 10px 25px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 1em;
            white-space: nowrap;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }

        .tab-nav-item {
            padding: 12px 25px;
            cursor: pointer;
            font-size: 0.9em;
            color: #555;
            border-right: 1px solid #ddd;
            white-space: nowrap;
        }
        .tab-nav-item:last-child {
            border-right: none;
        }

        .tab-nav-item.active {
            background-color: #e66a1a;
            color: #fff;
            font-weight: bold;
        }

        /* Quoted Phrase */
        .quoted-phrase {
            padding: 30px 40px;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #e66a1a;
            margin: 0;
        }

        /* Related FAQs Section */
        .related-faqs {
            padding: 0 40px 30px;
        }

        .related-faqs h2 {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin: 0 0 20px 0;
        }

        .faq-table {
            border-collapse: collapse;
            width: 100%;
        }

        .faq-table-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: #f5f5f5;
            font-weight: bold;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            font-size: 0.9em;
        }

        .faq-table-header div {
            padding: 0 10px;
        }

        .faq-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid #eeeeee;
            padding: 15px 0;
            align-items: start;
        }

        .faq-row:last-child {
            border-bottom: none;
        }

        .faq-question {
            color: #e66a1a;
            font-size: 0.9em;
            line-height: 1.4;
            padding: 0 10px;
        }

        .faq-answer {
            color: #555;
            font-size: 0.9em;
            line-height: 1.4;
            padding: 0 10px;
        }

        /* Footer Styling */
        .footer {
            background-color: #f5f5f5;
            padding: 20px 40px;
            font-size: 0.8em;
            color: #777;
            border-top: 1px solid #eee;
            line-height: 1.6;
        }

        .footer p {
            margin: 0;
        }

        .footer a {
            color: #777;
            text-decoration: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                width: 95%;
                margin: 20px auto;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-logo {
                width: 100%;
                text-align: center;
                padding: 10px 0;
            }

            .header-nav {
                width: 100%;
                padding: 10px 0;
                justify-content: center;
            }

            .header-nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            .header-nav li {
                margin: 5px 10px;
            }

            .search-section,
            .tab-nav,
            .quoted-phrase,
            .related-faqs,
            .footer {
                padding-left: 20px;
                padding-right: 20px;
            }

            .search-input-group {
                flex-direction: column;
                gap: 10px;
            }

            .search-input-group input[type="text"],
            .search-input-group button {
                width: 100%;
                min-width: unset;
            }

            .tab-nav {
                flex-wrap: wrap;
                justify-content: center;
            }
            .tab-nav-item {
                border-right: none;
                border-bottom: 1px solid #ddd;
                width: 100%;
                text-align: center;
            }
            .tab-nav-item:last-child {
                border-bottom: none;
            }

            .quoted-phrase {
                font-size: 1.4em;
            }

            .faq-table-header,
            .faq-row {
                grid-template-columns: 1fr;
            }

            .faq-table-header div,
            .faq-question,
            .faq-answer {
                padding: 5px 10px;
            }

            .faq-question {
                margin-bottom: 5px;
            }
        }

        @media (max-width: 480px) {
            .header-nav li {
                margin: 5px 5px;
            }
            .header-nav a {
                font-size: 0.8em;
            }
            .search-section h1 {
                font-size: 1.2em;
            }
            .quoted-phrase {
                font-size: 1.2em;
            }
            .related-faqs h2 {
                font-size: 1em;
            }
            .faq-question, .faq-answer {
                font-size: 0.85em;
            }
            .footer {
                font-size: 0.75em;
            }
        }
    </style>
</head>
