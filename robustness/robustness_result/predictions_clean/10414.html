```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Jobs</title>
    <style>
        /* Basic reset and full viewport height */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif; /* A common sans-serif font */
            overflow: hidden; /* Prevent scrollbars */
        }

        /* Body as a flex container for the two halves */
        body {
            display: flex;
            position: relative; /* Needed for absolute positioning of the content overlay */
        }

        /* Styles for the left half of the background */
        .left-half {
            flex: 1; /* Takes 50% of the width */
            height: 100%;
            background-color: #000000; /* Black color */
        }

        /* Styles for the right half of the background */
        .right-half {
            flex: 1; /* Takes 50% of the width */
            height: 100%;
            background-color: #42982A; /* Green color from the image */
        }

        /* Container for the text content, positioned centrally */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Centers the element precisely */
            text-align: center;
            width: 100%; /* Ensures text-align: center works across the full width */
            box-sizing: border-box; /* Include padding in the element's total width and height */
            padding: 20px; /* Add some padding for smaller screens */
        }

        /* Styles for the main heading "GLOBAL JOBS" */
        h1 {
            color: #FFFFFF; /* White color */
            font-size: 5vw; /* Responsive font size based on viewport width */
            font-weight: 700; /* Bold font weight */
            margin: 0; /* Remove default margin */
            letter-spacing: 0.05em; /* Slight letter spacing for visual appeal */
            line-height: 1.2; /* Adjust line height */
        }

        /* Styles for the paragraph text */
        p {
            color: #888888; /* Dark gray color */
            font-size: 1.5vw; /* Responsive font size based on viewport width */
            margin-top: 20px; /* Space below the heading */
            font-weight: normal;
            line-height: 1.5;
        }

        /* Media queries for better responsiveness on smaller screens */
        @media (max-width: 768px) {
            h1 {
                font-size: 8vw; /* Increase font size for better readability on smaller devices */
            }
            p {
                font-size: 2.5vw; /* Increase font size for better readability on smaller devices */
            }
        }
    </style>
</head>
<body>
    <!-- The two background halves -->
    <div class="left-half"></div>
    <div class="right-half"></div>

    <!-- The overlaying content -->
    <div class="content">
        <h1>GLOBAL JOBS</h1>
        <p>HELLO, WE WILL BE RIGHT BACK VERY SHORTLY.</p>
    </div>
</body>
</html>
```
