    <title>Server Error 503</title>
    <style>
        /* Basic Reset & Body Styling */
        html, body {
            margin: 0;
            padding: 0;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

        }

        /* Main Container Layout */
        .container {
            display: flex;
            min-height: 100vh;

        .sidebar {
            flex-shrink: 0; /* Prevent shrinking */
            width: 300px; /* Fixed width for sidebar */
            background-color: #343a40; /* Dark gray */
        }

        /* Right Content Area */
        .content-area {
            flex-grow: 1; /* Takes up remaining space */
            background-color: #ffffff; /* White background */
            display: flex;
            justify-content: center; /* Center content horizontally */
            align-items: center; /* Center content vertically */
            padding: 20px; /* Padding around the content card */
            box-sizing: border-box; /* Include padding in element's total width and height */
        }

        /* Error Card Styling */
        .error-card {
            max-width: 600px; /* Max width for the content block */
            width: 100%; /* Ensure it takes full width up to max-width */
            text-align: left;
            padding: 20px; /* Inner padding for the card */
        }

        /* Text Styling */
        .error-card h1 {
            font-size: 1.5em;
            color: #343a40;
            margin-top: 0;
            margin-bottom: 0.5em;
            font-weight: normal;
        }

        .error-card .error-code {
            font-size: 4.5em; /* Large font size for 503 */

            font-weight: bold;
            margin-top: 0;
            margin-bottom: 0.2em;
            line-height: 1; /* Adjust line height to prevent extra space */
        }

        .error-card h2 {
            font-size: 2.5em;
            color: #343a40;
            margin-top: 0;
            margin-bottom: 1em;
            font-weight: normal;
        }

        .error-card .description {
            font-size: 1em;
            color: #6c757d; /* Lighter gray for description */
            margin-bottom: 2em;
        }

        .error-card .action-prompt {
            font-size: 1em;
            color: #343a40;
            margin-bottom: 1em;

        }

        .buttons {
            display: flex;
            flex-wrap: wrap; /* Allow buttons to wrap on smaller screens */
            gap: 10px; /* Space between buttons */
        }

        /* Button Styling */
        .button {
            display: inline-block;
            padding: 10px 15px;
            border: 1px solid #007bff; /* Light blue border */
            color: #007bff; /* Light blue text */
            text-decoration: none;
            border-radius: 4px;
            background-color: #ffffff;
            transition: background-color 0.3s ease, color 0.3s ease;
            font-size: 0.9em;
            white-space: nowrap; /* Prevent text from wrapping inside button */
        }

        .button:hover {
            background-color: #007bff;
            color: #ffffff;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .container {
                flex-direction: column; /* Stack sidebar and content vertically */
            }

            .sidebar {
                width: 100%; /* Sidebar takes full width */
                height: 100px; /* Give it a fixed height on mobile */

            }

            .content-area {
                padding: 20px; /* Adjust padding for smaller screens */
                align-items: flex-start; /* Align content to top on mobile */
            }

            .error-card {
                padding: 0; /* Remove inner padding if content-area has enough */
            }

            .error-card .error-code {
                font-size: 3.5em; /* Slightly smaller on mobile */
            }

            .error-card h2 {
                font-size: 2em; /* Slightly smaller on mobile */
            }

            .buttons {
                flex-direction: column; /* Stack buttons vertically on very small screens */

            }

            .button {
                width: 100%; /* Make buttons full width when stacked */
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                display: none; /* Hide sidebar completely on very small screens */

                padding: 15px;
            }
            .error-card h1 {
                font-size: 1.2em;
            }
            .error-card .error-code {
                font-size: 3em;
            }
            .error-card h2 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
