<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopewell Theatre</title>
    <style>
        /* General Reset & Body Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* A clean sans-serif font */
            background-color: #1a1a1a; /* Dark background */
            color: #fff; /* Default text color */
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header - Top Bar */
        .top-bar {
            background-color: #222222; /* Slightly lighter dark gray */
            color: #cccccc;
            padding: 10px 20px;
            text-align: center;
            font-size: 0.85em;
        }

        .top-bar a {
            color: #cccccc;
            text-decoration: underline;
        }

        /* Header - Main Navigation */
        .main-header {
            background-color: #1a1a1a;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; /* Allow wrapping on smaller screens */
            max-width: 1200px; /* Max width for content */
            margin: 0 auto;
        }

        .logo-placeholder {
            background-color: #000080; /* Dark blue as seen in image */
            width: 150px;
            height: 70px;
            flex-shrink: 0; /* Prevent shrinking */
            margin-right: 20px; /* Space between logo and nav */
        }

        .main-nav {
            display: flex;
            list-style: none;
            gap: 30px; /* Space between nav items */
            flex-grow: 1; /* Allow nav to take available space */
            justify-content: flex-end; /* Align links to the right */
        }

        .main-nav li a {
            color: #ffffff;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
            white-space: nowrap; /* Prevent links from breaking */
        }

        /* Hero Section - Get Involved Card */
        .hero-section {
            background-color: #4a4a4a; /* Medium gray background */
            padding: 100px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px; /* Ensure it has some height */
        }

        .get-involved-card {
            background-color: #ffffff;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); /* Subtle shadow */
        }

        .get-involved-card h2 {
            font-size: 2.5em;
            color: #333333;
            margin-bottom: 20px;
            font-weight: normal; /* Looks like normal weight in image */
        }

        .get-involved-card p {
            color: #666666;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .contact-button {
            background-color: #333333;
            color: #ffffff;
            padding: 15px 30px;
            border: none;
            cursor: pointer;
            font-size: 1em;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background-color 0.3s ease; /* Smooth hover effect */
        }

        .contact-button:hover {
            background-color: #555555;
        }

        /* Admission Section */
        .admission-section {
            padding: 80px 20px;
            max-width: 900px; /* Max width for admission content */
            margin: 0 auto;
        }

        .admission-title {
            font-size: 4em;
            color: #4a4a4a; /* Gray, same as hero background */
            text-align: center;
            margin-bottom: 60px;
            letter-spacing: 5px;
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap; /* Prevent "ADMISSION" from breaking */
            overflow: hidden; /* Hide overflow if it's too wide */
            text-overflow: ellipsis; /* Add ellipsis if it overflows */
        }

        .show-type h3 {
            font-size: 1.8em;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: normal; /* Looks like normal weight */
        }

        .admission-details {
            display: flex;
            justify-content: space-between;
            align-items: baseline; /* Align text baselines */
            margin-bottom: 40px;
            flex-wrap: wrap; /* Allow items to wrap */
            gap: 20px; /* Space between items when wrapped */
        }

        .admission-item {
            display: flex;
            align-items: baseline;
            color: #ffffff;
            font-size: 1.2em;
            flex: 1 1 auto; /* Allow items to grow and shrink */
            min-width: 250px; /* Minimum width before wrapping */
        }

        .admission-item span:first-child {
            margin-right: 10px;
        }

        .admission-item .price {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffffff;
        }

        .separator {
            border: none;
            border-top: 1px solid #4a4a4a; /* Gray line */
            margin: 60px 0;
        }

        .discount-note {
            font-size: 0.9em;
            color: #cccccc;
            text-align: center;
            margin-top: 40px;
        }

        /* Footer */
        .main-footer {
            background-color: #1a1a1a;
            padding: 40px 20px;
            border-top: 1px solid #333333; /* Separator line */
            color: #cccccc;
            font-size: 0.8em;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            max-width: 1200px; /* Max width for footer content */
            margin: 0 auto;
            flex-wrap: wrap; /* Allow wrapping */
            gap: 20px; /* Space between columns */
        }

        .footer-left {
            flex: 2; /* Take more space */
            min-width: 300px; /* Minimum width before wrapping */
        }

        .footer-left p {
            margin-bottom: 10px;
        }

        .footer-left a {
            color: #ffffff; /* White for links */
            text-decoration: underline;
        }

        .footer-right {
            flex: 1; /* Take less space */
            text-align: right;
            min-width: 200px; /* Minimum width before wrapping */
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .main-header {
                flex-direction: column;
                align-items: center;
            }

            .logo-placeholder {
                margin-bottom: 20px;
                margin-right: 0;
            }

            .main-nav {
                flex-direction: column;
                align-items: center;
                gap: 15px;
                margin-top: 10px;
            }

            .main-nav li a {
                font-size: 1em;
            }

            .hero-section {
                padding: 60px 20px;
            }

            .get-involved-card {
                padding: 30px;
            }

            .get-involved-card h2 {
                font-size: 2em;
            }

            .admission-title {
                font-size: 3em;
                letter-spacing: 3px;
                margin-bottom: 40px;
            }

            .show-type h3 {
                font-size: 1.5em;
            }

            .admission-details {
                flex-direction: column; /* Stack items vertically */
                align-items: flex-start; /* Align to the left */
                gap: 15px;
            }

            .admission-item {
                width: 100%; /* Take full width */
                justify-content: space-between; /* Keep text and price separated */
            }

            .separator {
                margin: 40px 0;
            }

            .footer-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .footer-left, .footer-right {
                min-width: unset; /* Remove min-width constraint */
                width: 100%;
                text-align: center;
            }

            .footer-left {
                margin-bottom: 20px;
            }
        }
