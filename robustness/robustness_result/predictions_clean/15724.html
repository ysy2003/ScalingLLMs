<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Recreation</title>
    <style>
        /* Basic Reset & Body Styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif; /* A common sans-serif font similar to the image */
            color: #333; /* Dark grey for text, matching the image */
            background-color: #fff;
            min-height: 100vh; /* Ensure body takes full viewport height */
            display: flex;
            flex-direction: column;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between; /* Pushes blue box to left, nav to right */
            align-items: flex-start; /* Aligns items to the top of the header */
            padding: 40px 80px; /* Top/bottom and left/right padding for the header */
            width: 100%;
            box-sizing: border-box; /* Include padding in element's total width/height */
        }

        .blue-box {
            width: 100px; /* Approximate width from image */
            height: 60px; /* Approximate height from image */
            background-color: blue;
        }

        .nav-container {
            display: flex;
            gap: 80px; /* Space between the two navigation columns */
        }

        .nav-column {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Space between individual navigation items */
            list-style: none; /* Remove default list bullet points */
            padding: 0;
            margin: 0;
        }

        .nav-column li {
            font-size: 16px; /* Standard text size for navigation */
            line-height: 1.2;
        }

        /* Main Content Section */
        .main-content {
            flex-grow: 1; /* Allows main content to take up remaining vertical space */
            display: flex;
            flex-direction: column;
            padding: 0 80px; /* Horizontal padding matching the header */
            box-sizing: border-box;
        }

        .z-economy {
            font-size: 24px; /* Larger font size for ZEconomy */
            font-weight: bold;
            text-decoration: underline;
            margin-top: 100px; /* Vertical spacing from header/top */
            align-self: flex-start; /* Aligns ZEconomy to the left within main-content */
        }

        .art-title {
            font-size: 72px; /* Large font size for Art */
            font-weight: normal;
            text-decoration: underline;
            align-self: center; /* Centers Art horizontally within main-content */
            margin-top: 100px; /* Vertical spacing from ZEconomy */
            margin-bottom: auto; /* Pushes Art towards the top if main-content is very tall */
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .header {
                flex-direction: column; /* Stack header items vertically */
                align-items: center; /* Center header items horizontally */
                padding: 20px; /* Reduce padding for smaller screens */
            }

            .nav-container {
                flex-direction: column; /* Stack navigation columns vertically */
                gap: 20px; /* Reduce gap between nav columns */
                margin-top: 20px; /* Add space between blue box and nav */
            }

            .nav-column {
                align-items: center; /* Center nav items within their column */
            }

            .main-content {
                padding: 0 20px; /* Reduce horizontal padding */
                align-items: center; /* Center ZEconomy and Art horizontally */
            }

            .z-economy {
                margin-top: 50px; /* Adjust vertical spacing */
                /* align-self: center is implicitly handled by main-content's align-items: center */
            }

            .art-title {
                font-size: 50px; /* Reduce font size for Art */
                margin-top: 50px; /* Adjust vertical spacing */
                /* align-self: center is implicitly handled by main-content's align-items: center */
            }
        }

        @media (max-width: 480px) {
            .blue-box {
                width: 80px;
                height: 40px;
            }

            .nav-column li {
                font-size: 14px;
            }

            .z-economy {
                font-size: 20px;
            }

            .art-title {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="blue-box"></div>
        <nav class="nav-container">
            <ul class="nav-column">
                <li>Z Painting</li>
                <li>Z Securities</li>
                <li>Art</li>
            </ul>
            <ul class="nav-column">
                <li>About</li>
                <li>Contact</li>
                <li>Boutique</li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="z-economy">ZEconomy</div>
        <div class="art-title">Art</div>
    </main>
</body>
</html>
