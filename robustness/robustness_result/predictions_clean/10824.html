<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGKF - Best Law Firm Rankings</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5; /* Light background for the whole page */
            color: #333;
            line-height: 1.6;
            font-size: 14px;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Header Top */
        .header-top {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            background-color: white; /* Assuming white background for the very top bar */
            border-bottom: 1px solid #eee;
        }

        .header-top-right {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 12px;
            color: #666;
        }

        .header-top-right a {
            color: #666;
        }

        .search-container {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .search-container input {
            border: none;
            outline: none;
            padding: 3px 5px;
            font-size: 12px;
            width: 120px;
        }

        .search-container img {
            height: 16px; /* Adjust as needed */
            width: auto;
            cursor: pointer;
        }

        /* Main Navigation */
        .main-nav {
            background-color: #263238; /* Dark blue-gray */
            color: white;
            padding: 15px 0;
            text-align: center;
        }

        .nav-list {
            display: flex;
            justify-content: center;
            max-width: 1200px; /* Limit width for desktop */
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-list li {
            margin: 0 20px;
        }

        .nav-list a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap; /* Prevent wrapping */
        }

        .nav-list a:hover {
            color: #007bff; /* Highlight on hover */
        }

        /* Hero Section */
        .hero-section {
            display: flex;
            height: 200px; /* Fixed height as per image */
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero-blue {
            flex: 1; /* Takes up available space */
            background-color: #0000FF; /* Bright blue */
        }

        .hero-teal {
            flex: 1; /* Takes up available space */
            background-color: #00796B; /* Dark teal */
        }

        /* Main Content Area */
        .content-wrapper {
            display: flex;
            justify-content: center;
            padding: 30px 20px;
            background-color: #455A64; /* Darker gray background for the section */
        }

        .main-content {
            display: flex;
            max-width: 1200px; /* Matches nav and hero width */
            background-color: white; /* White background for the content block */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .article-section {
            flex: 3; /* Takes more space */
            padding: 30px;
            border-right: 1px solid #eee; /* Separator */
        }

        .article-section h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
            line-height: 1.2;
        }

        .article-section .date {
            font-size: 13px;
            color: #777;
            margin-bottom: 20px;
        }

        .article-section p {
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
        }

        .article-section p strong {
            font-weight: bold;
        }

        .article-section .view-documents {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .article-section .view-documents h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }

        .article-section .view-documents ul {
            list-style: disc;
            margin-left: 20px;
        }

        .article-section .view-documents li {
            margin-bottom: 5px;
        }

        .article-section .view-documents a {
            color: #007bff;
            font-size: 13px;
        }

        /* Sidebar Section */
        .sidebar {
            flex: 1; /* Takes less space */
            padding: 30px;
            min-width: 250px; /* Ensure sidebar doesn't get too small */
        }

        .sidebar ul li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .sidebar ul li:last-child {
            border-bottom: none;
        }

        .sidebar ul li a {
            color: #333;
            font-size: 14px;
            display: block;
        }

        .sidebar ul li a:hover {
            color: #007bff;
            text-decoration: none;
        }

        .sidebar .print-pdf a::before {
            content: "\1F5A8"; /* Printer icon */
            margin-right: 8px;
            font-size: 16px;
            vertical-align: middle;
        }

        .press-contact-box {
            margin-top: 20px;
            background-color: #004080; /* Darker blue for the button */
            color: white;
            padding: 12px 15px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
            cursor: default;
        }

        .contact-details {
            margin-top: 15px;
            padding-left: 20px; /* Indent for bullet points */
        }

        .contact-details li {
            list-style: disc;
            margin-bottom: 5px;
            color: #555;
            font-size: 13px;
            border-bottom: none; /* Remove border from contact details list */
            padding: 0;
        }

        .contact-details li:last-child {
            margin-bottom: 0;
        }

        /* Footer */
        .footer {
            background-color: #263238; /* Dark blue-gray, same as nav */
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .footer-links {
            margin-bottom: 15px;
        }

        .footer-links a {
            color: white;
            margin: 0 8px;
            text-decoration: none;
        }

        .footer-links span {
            color: white;
        }

        .footer-squares {
            display: flex;
            gap: 5px;
        }

        .footer-square {
            width: 15px;
            height: 15px;
            background-color: #0000FF; /* Bright blue */
        }

        /* Responsive Adjustments */
        @media (max-width: 992px) {
            .nav-list {
                flex-wrap: wrap;
                justify-content: center;
            }
            .nav-list li {
                margin: 5px 10px;
            }
            .main-content {
                flex-direction: column;
                width: 100%; /* Allow content to take full width on smaller screens */
                max-width: 768px; /* Max width for tablet */
            }
            .article-section, .sidebar {
                border-right: none;
                border-bottom: 1px solid #eee; /* Add separator for stacked sections */
                padding: 20px;
            }
            .sidebar {
                min-width: unset; /* Remove min-width constraint */
                border-bottom: none; /* Last section doesn't need bottom border */
            }
            .hero-section {
                height: 150px; /* Slightly smaller hero on tablets */
            }
        }

        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                align-items: flex-end;
                padding: 10px;
            }
            .header-top-right {
                margin-top: 5px;
                gap: 10px;
            }
            .search-container input {
                width: 100px;
            }
            .nav-list {
                flex-direction: column;
                align-items: center;
            }
            .nav-list li {
                margin: 5px 0;
            }
            .hero-section {
                height: 100px; /* Even smaller hero on mobile */
            }
            .content-wrapper {
                padding: 20px 10px;
            }
            .article-section h1 {
                font-size: 22px;
            }
            .article-section, .sidebar {
                padding: 15px;
            }
        }
    </style>
</head>
