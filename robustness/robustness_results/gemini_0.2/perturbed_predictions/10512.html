<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #e0e0e0; /* Light gray background */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px; /* Padding around the card for smaller screens */
            box-sizing: border-box;
        }

        .card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px; /* Max width for the card */
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .card-title {
            color: #2196F3; /* Bright blue color */
            font-size: 1.8em;
            font-weight: bold;
            margin: 0;
            flex-grow: 1;
            padding-right: 15px; /* Space between title and controls */
        }

        .window-controls {
            display: flex;
            gap: 8px; /* Space between control boxes */
            margin-top: 5px; /* Align with the top of the title */
        }

        .control-box {
            width: 12px;
            height: 12px;
            background-color: #2196F3; /* Bright blue color */
            border-radius: 2px;
        }

        .card-content p {
            margin-bottom: 15px;
            font-size: 0.95em;
            color: #333;
        }

        .card-content p:last-of-type {
            margin-bottom: 0;
        }

        .blue-rectangle {
            width: 80px;
            height: 40px;
            background-color: #2196F3; /* Bright blue color */
            margin: 30px auto 0 auto; /* Center horizontally, space from content */
            border-radius: 2px; /* Slightly rounded corners for the rectangle */
        }

        .copyright {
            margin-top: 30px;
            font-size: 0.85em;
            color: #888; /* Lighter gray for copyright text */
            text-align: center;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }
            .card-title {
                font-size: 1.5em;
            }
            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .window-controls {
                margin-top: 10px;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 15px;
            }
            .card-title {
                font-size: 1.3em;
            }
            .card-content p {
                font-size: 0.9em;
            }
            .blue-rectangle {
                width: 60px;
                height: 30px;
                margin-top: 20px;
            }
            .copyright {
                font-size: 0.8em;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1 class="card-title">permafrost.today is not found</h1>
                <div class="window-controls">
                    <span class="control-box"></span>
                    <span class="control-box"></span>
                    <span class="control-box"></span>
                </div>
            </div>
            <div class="card-content">
                <p>permafrost.today is not found in the configuration on this server. It might be because of a newly changed or wrong DNS pointer, or a reconfiguration of the server.</p>
                <p>Please contact customer support if the problem persists.</p>
            </div>
            <div class="blue-rectangle"></div>
        </div>
        <div class="copyright">
            Domeneshop AS © 2023
        </div>
    </div>
</body>
</html>
