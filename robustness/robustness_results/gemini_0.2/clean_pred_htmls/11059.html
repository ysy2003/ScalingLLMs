<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enagic Client ID</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px; /* Spacing between elements */
            padding: 20px;
            max-width: 90%; /* Ensure container doesn't overflow on small screens */
        }

        .blue-box {
            width: 300px;
            height: 200px;
            background-color: blue;
            max-width: 90vw; /* Max width 90% of viewport width */
            max-height: 60vh; /* Max height 60% of viewport height */
        }

        .question-text {
            text-align: center;
            font-size: 1.1em;
            line-height: 1.4;
        }

        .button-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap; /* Allow buttons to wrap on smaller screens */
            justify-content: center; /* Center buttons if they wrap */
        }

        .button {
            background-color: #FFA500; /* Orange color */
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            min-width: 100px; /* Ensure buttons have a minimum width */
            text-align: center;
        }

        .button:hover {
            background-color: #E69500; /* Slightly darker orange on hover */
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .blue-box {
                width: 250px;
                height: 170px;
            }
            .question-text {
                font-size: 1em;
            }
            .button-group {
                flex-direction: column; /* Stack buttons vertically */
                gap: 15px;
            }
            .button {
                width: 100%; /* Full width when stacked */
                max-width: 200px; /* Limit max width even when stacked */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="blue-box"></div>
        <p class="question-text">Do you have an Enagic Client ID Number?</p>
        <div class="button-group">
            <button class="button">YES</button>
            <button class="button">NO</button>
        </div>
    </div>
</body>
</html>
