<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burke County Rehab</title>
    <style>
        /* General Resets and Body Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f8f8;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        a {
            color: #3f51b5;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Top Header */
        .top-header {
            background-color: #fff;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .top-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo-placeholder {
            width: 150px;
            height: 50px;
            background-color: #3f51b5;
            margin-right: 20px;
        }

        .header-contact {
            text-align: right;
            flex-grow: 1;
            min-width: 250px; /* Ensure it doesn't get too small */
        }

        .header-contact p {
            margin: 0;
            font-size: 0.9rem;
            color: #666;
        }

        .header-contact .phone-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #3f51b5;
            margin-top: 5px;
        }

        /* Main Navigation */
        .main-nav {
            background: linear-gradient(to right, #66bb6a, #a5d6a7);
            padding: 0;
        }

        .main-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .main-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
        }

        .main-nav ul li a {
            display: block;
            padding: 15px 10px;
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: background-color 0.3s ease;
        }

        .main-nav ul li a:hover {
            background-color: rgba(0, 0, 0, 0.1);
            text-decoration: none;
        }

        .search-button {
            background-color: #fff176;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
            margin-left: auto; /* Pushes button to the right */
            white-space: nowrap;
        }

        .search-button:hover {
            background-color: #fdd835;
        }

        /* Breadcrumbs */
        .breadcrumbs {
            background-color: #f5f5f5;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #666;
        }

        .breadcrumbs span {
            margin-right: 5px;
        }

        .breadcrumbs span:not(:last-child)::after {
            content: ">";
            margin-left: 5px;
            color: #999;
        }

        /* Main Content Area */
        .main-content-area {
            display: flex;
            gap: 30px;
            padding: 30px 0;
            align-items: flex-start;
            background-color: #fff;
        }

        .article-content {
            flex: 3;
            min-width: 0; /* Allows content to shrink */
        }

        .article-content h1 {
            font-size: 2.2rem;
            font-weight: bold;
            color: #333;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .article-content ol {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .article-content ol li {
            margin-bottom: 30px;
        }

        .article-content ol li h2 {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .article-content ol li p {
            margin: 0;
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
        }

        .article-content ul {
            list-style: none;
            padding-left: 20px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .article-content ul li {
            position: relative;
            padding-left: 15px;
            margin-bottom: 8px;
            color: #555;
        }

        .article-content ul li::before {
            content: "\2022"; /* Unicode bullet point */
            color: #3f51b5; /* Blue bullet */
            font-size: 1.2em;
            position: absolute;
            left: 0;
            top: 0;
        }

        /* Sidebar */
        .sidebar {
            flex: 1;
            min-width: 280px;
            background-color: #d4edda; /* Light green */
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            overflow: hidden; /* For border-radius on children */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .sidebar-box {
            background-color: #d4edda;
        }

        .sidebar-header {
            background-color: #e8f5e9; /* Lighter green */
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #c3e6cb;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 1.3rem;
            color: #333;
            font-weight: bold;
        }

        .sidebar-body {
            padding: 20px;
            text-align: center;
        }

        .sidebar-body p {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #555;
        }

        .call-button {
            background-color: #fff176; /* Yellow */
            color: #333;
            padding: 15px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
            width: 100%;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .call-button:hover {
            background-color: #fdd835;
        }

        .or-text {
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 20px;
            color: #333;
        }

        .sidebar-body form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-body input[type="text"],
        .sidebar-body input[type="tel"],
        .sidebar-body textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            color: #333;
        }

        .sidebar-body textarea {
            resize: vertical;
            min-height: 80px;
        }

        .confidential-text {
            font-size: 0.85rem;
            color: #666;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .send-button {
            background-color: #4CAF50; /* Green */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .send-button:hover {
            background-color: #45a049;
        }

        /* Cities Section */
        .cities-section, .categories-section {
            background-color: #fff;
            padding: 30px 20px;
            margin-top: 20px;
            border-top: 1px solid #eee;
        }

        .cities-section h2, .categories-section h2 {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .cities-section p, .categories-section p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 10px;
        }

        .city-link {
            font-size: 1.1rem;
            font-weight: bold;
            color: #3f51b5;
            display: inline-block;
            margin-top: 5px;
        }

        /* Categories Section */
        .category-links {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
        }

            font-size: 1.1rem;
            font-weight: bold;
