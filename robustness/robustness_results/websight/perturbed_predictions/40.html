<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f8f8f8;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background-color: #f8f8f8;
    padding: 20px;
    text-align: center;
}

.header h1 {
    font-size: 40px;
    color: #333;
}

.timeline {
    margin: 20px 0;
}

.timeline-item {
    margin: 20px 0;
    padding: 20px;
    background-color: #fff;
    border: 1px solid #ddd;
    border-radius: 5px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease-in-out;
}

.timeline-item:hover {
    background-color: #f8f8f8;
}

.timeline-item h2 {
    font-size: 30px;
    color: #333;
}

.timeline-item p {
    font-size: 20px;
    color: #777;
}

.timeline-item img {
    width: 100%;
    height: auto;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <h1>Ms. Healthy Face</h1>
            <div class="timeline">
                <div class="timeline-item">
                    <h2>2022</h2>
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                    <img src="healthy-face.jpg" alt="Healthy Face">
                </div>
                <!-- More timeline items -->
            </div>
        </div>
        <!-- More content -->
        <div class="footer">
            <!-- Footer content -->
        </div>
    </div>
</body>
</html>
