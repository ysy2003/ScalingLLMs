<html>
<style>
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 0 10%;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-image: linear-gradient(to bottom, white, purple);
    padding: 20px 0;
}

.logo {
    width: 100px;
    height: 100px;
    background-color: blue;
}

.search-bar {
    width: 50%;
    height: 50px;
    background-color: white;
}

.content {
    display: flex;
    justify-content: space-between;
    margin: 50px 0;
}

.left-column {
    width: 60%;
    background-color: lightgray;
}

.right-column {
    width: 30%;
    background-color: lightgray;
}

.footer {
    display: flex;
    justify-content: space-between;
    background-image: linear-gradient(to bottom, purple, white);
    padding: 20px 0;
}

.social-media a {
    margin: 0 10px;
    width: 50px;
    height: 50px;
    background-color: blue;
}

.contact-form {
    display: flex;
    flex-direction: column;
    margin: 0 10px;
}

.contact-form input, .contact-form textarea {
    margin: 10px 0;
    width: 100%;
    height: 30px;
    background-color: lightgray;
}

.contact-form button {
    margin: 10px 0;
    width: 100%;
    height: 30px;
    background-color: blue;
    color: white;
    border: none;
}

.footer {
    display: flex;
    justify-content: space-between;
    background-image: linear-gradient(to bottom, purple, white);
    padding: 20px 0;
}

.footer a {
    margin: 0 10px;
    color: white;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"></div>
            <div class="search-bar"></div>
        </div>
        <div class="content">
            <div class="left-column">
                <div class="menu"></div>
                <div class="featured-destinations"></div>
                <div class="guides"></div>
                <div class="blog"></div>
            </div>
            <div class="right-column">
                <div class="packages"></div>
                <div class="packages"></div>
                <div class="packages"></div>
            </div>
        </div>
        <div class="footer">
            <div class="social-media"></div>
            <div class="contact-form"></div>
        </div>
    </div>
</body>
</html>
