<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.logo {
    width: 100%;
    height: 100px;
    background-color: #00f;
    margin-bottom: 20px;
}

.menu {
    width: 100%;
    height: 50px;
    background-color: #f00;
    margin-bottom: 20px;
}

.content {
    width: 80%;
    height: calc(100vh - 150px);
    background-color: #fff;
    padding: 20px;
    box-sizing: border-box;
}
</style>
<body>
    <div class="logo"></div>
    <div class="menu"></div>
    <div class="content"></div>
</body>
</html>
