<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #333;
}

header {
    width: 100%;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background-color: #f8f9fa;
}

nav ul {
    list-style-type: none;
    display: flex;
    justify-content: space-around;
    width: 100%;
}

nav ul li a {
    text-decoration: none;
    color: #fff;
}

.product {
    width: 70%;
    margin: 20px 0;
    padding: 20px;
    background-color: #fff;
    border: 1px solid #ddd;
}

.product h2 {
    text-align: center;
    margin-bottom: 10px;
}

.product p {
    color: #6c757d;
}

.product::before {
    content: "";
    display: block;
    width: 100%;
    height: 20px;
    background-color: #6c757d;
    margin-bottom: 10px;
}

.product::before {
    content: "";
    display: block;
    width: 50px;
    height: 50px;
    background-color: #00f;
    margin-bottom: 10px;
}

.search-bar {
    width: 100%;
    padding: 20px;
    background-color: #f8f9fa;
    text-align: center;
    margin-bottom: 20px;
}

.search-bar::before {
    content: "";
    display: block;
    width: 100%;
    height: 50px;
    background-color: #6c757d;
    margin-bottom: 10px;
}

.search-bar input {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
}

.product-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.product-list .product {
    width: 70%;
    margin: 20px 0;
    padding: 20px;
    background-color: #fff;
    border: 1px solid #ddd;
}

.product-list .product::before {
    content: "";
    display: block;
    width: 100%;
    height: 20px;
    background-color: #6c757d;
    margin-bottom: 10px;
}

.product-list .product h2 {
    text-align: center;
    margin-bottom: 10px;
}

.product-list .product p {
    color: #6c757d;
}
</style>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Goals</a></li>
                <li><a href="#">Workout Plans</a></li>
                <li><a href="#">Community Forum</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>Welcome to Doctor Fitness</h1>
            <div class="search-bar">
                <input type="text" placeholder="Search for articles, questions, and resources">
            </div>
            <div class="product-list">
                <div class="product">
                    <h2>Fitness Goals</h2>
                    <p>Discover the best fitness goals for you and your fitness goals.</p>
                </div>
                <div class="product">
                    <h2>Workout Plans</h2>
                    <p>Find the perfect workout plan for you and your fitness goals.</p>
                </div>
                <div class="product">
                    <h2>Community Forum</h2>
                    <p>Join our community and share your fitness journey.</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
