<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f1f1f1;
}

.container {
    width: 80%;
    margin: auto;
    overflow: hidden;
}

.header {
    background-color: #333;
    color: #fff;
    padding: 10px;
    text-align: center;
}

.header img {
    width: 100px;
}

.header nav ul {
    list-style-type: none;
    padding: 0;
}

.header nav ul li {
    display: inline;
    margin: 0 10px;
}

.header nav ul li a {
    color: #fff;
    text-decoration: none;
}

.search-bar {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    background-color: #f1f1f1;
    text-align: center;
}

.search-bar input[type="text"] {
    width: 100%;
    padding: 10px;
    border: none;
    font-size: 17px;
}

.search-bar button {
    padding: 10px;
    background-color: #333;
    color: #fff;
    border: none;
    font-size: 17px;
}

.content {
    padding: 10px;
}

.content p {
    color: #333;
    line-height: 1.6em;
}

.footer {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 10px;
    position: fixed;
    width: 100%;
    bottom: 0;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <img src="https://via.placeholder.com/150" alt="Logo">
            <h1>Welcome to SEARCHWAYS</h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="#">Search</a></li>
                    <li><a href="#">Bookings</a></li>
                </ul>
            </nav>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search for properties...">
            <button>Search</button>
        </div>
        <div class="content">
            <h2>Welcome to SEARCHWAYS</h2>
            <p>At SEARCHWAYS, we are committed to providing you with the best real estate search experience. Browse our properties and book your next stay today.</p>
        </div>
        <div class="footer">
            <p>© 2022-SEARCHWAYS. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
