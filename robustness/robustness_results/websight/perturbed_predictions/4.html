<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f9f9f9;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background-color: #e60073;
    color: #fff;
    padding: 20px;
    text-align: center;
}

.header h1 {
    margin: 0;
    padding: 10px;
}

.header img {
    width: 100%;
    height: auto;
}

.content {
    margin-top: 20px;
}

.content p {
    line-height: 1.6;
    margin-bottom: 20px;
}

.content img {
    width: 100%;
    height: auto;
}

.footer {
    background-color: #f9f9f9;
    color: #333;
    padding: 20px;
    text-align: center;
}

.footer img {
    width: 100%;
    height: auto;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <h1>Production Application</h1>
            <img src="logo.png" alt="">
        </div>
        <div class="content">
            <p>Tell us a bit about yourself and your experience with FAQ for the more detailed information.</p>
            <img src="rectangle.png" alt="">
            <p>We are here to help you with your questions.</p>
            <img src="rectangle.png" alt="">
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email">
                <input type="tel" id="phone" name="phone">
                <label for="phone">Phone Number</label>
                <input type="text" id="location" name="location">
                <label for="location">Location</label>
                <input type="date" id="date" name="date">
                <label for="date">Date</label>
                <input type="number" id="age" name="age">
                <label for="age">Age</label>
                <input type="submit" value="Submit">
            </form>
        </div>
        <div class="footer">
            <img src="logo.png" alt="">
        </div>
    </div>
</body>
</html>
