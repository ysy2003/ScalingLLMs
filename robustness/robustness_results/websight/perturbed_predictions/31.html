<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    width: 80%;
    margin: auto;
    overflow: hidden;
}

h1 {
    font-size: 2.5em;
    text-align: center;
    padding: 20px 0;
    color: #fff;
    background-color: #333;
}

.product-image {
    width: 50px;
    height: 50px;
    background-color: #00f;
    margin: 20px 0;
}

.product-name {
    font-size: 1.2em;
    color: #fff;
    margin: 0;
}

.product-description {
    font-size: 1em;
    color: #333;
}

.product-reviews {
    font-size: 0.9em;
    color: #666;
}

.product-ratings {
    font-size: 0.8em;
    color: #00f;
}

.product-recommendations {
    font-size: 0.7em;
    color: #333;
}

.product-availability {
    font-size: 0.6em;
    color: #666;
}
</style>
<body>
    <div class="container">
        <h1>Sports Apparel Store</h1>
        <h2>Products</h2>
        <div class="product">
            <div class="product-image"></div>
            <h3 class="product-name">Sports Apparel</h3>
            <p class="product-description">Stylish and comfortable sports apparel for all your needs</p>
            <p class="product-reviews">"Great product, I love the quality and the design is really nice!" - Jane Doe</p>
            <p class="product-ratings">4.5/5</p>
            <p class="product-recommendations">Recommended for everyone</p>
            <p class="product-availability">In stock</p>
        </div>
        <!-- More products... -->
    </div>
</body>
</html>
