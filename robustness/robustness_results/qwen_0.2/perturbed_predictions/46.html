<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Categories</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #fff;
      padding: 0;
      margin: 0;
    }

    header {
      background-color: #007bff;
      padding: 10px 20px;
      text-align: center;
    }

   .search-bar {
      max-width: 800px;
      margin: 0 auto;
    }

   .search-bar input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: white;
      color: #6c757d;
      font-size: 16px;
      box-sizing: border-box;
    }

    main {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 10px;
    }

   .category {
      padding: 15px;
      border-bottom: 1px solid #eee;
      background-color: white;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
    }

   .icon {
      width: 24px;
      height: 24px;
      background-color: #007bff;
      margin-right: 10px;
      display: inline-block;
    }

   .category h3 {
      font-size: 18px;
      margin-bottom: 5px;
    }

   .category p {
      color: #6c757d;
      font-size: 14px;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      padding: 0 10px;
    }

   .footer-icon {
      width: 24px;
      height: 24px;
      background-color: #007bff;
      display: inline-block;
    }
  </style>
</head>
<body>
  <header>
    <div class="search-bar">
      <input type="text" placeholder="Search for articles...">
    </div>
  </header>
  <main>
    <div class="category">
      <div class="icon"></div>
      <h3>Frequently Asked Questions</h3>
      <p>75 articles</p>
    </div>
    <div class="category">
      <div class="icon"></div>
      <h3>Wireless Networking</h3>
      <p>322 articles</p>
    </div>
    <div class="category">
      <div class="icon"></div>
      <h3>Wired Networking</h3>
      <p>61 articles</p>
    </div>
    <div class="category">
      <div class="icon"></div>
      <h3>Telephony Systems</h3>
      <p>61 articles</p>
    </div>
    <div class="category">
      <div class="icon"></div>
      <h3>IP Surveillance Cameras</h3>
      <p>26 articles</p>
    </div>
  </main>
  <footer>
    <div class="footer-icon"></div>
  </footer>
</body>
</html>
