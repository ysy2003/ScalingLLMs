<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design to Code</title>
  <style>
    body {
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }
   .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
   .input-section {
      background-color: #f9f9f9;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 20px;
    }
   .input-field {
      border: 1px solid #ddd;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
      color: #000;
      font-size: 16px;
      line-height: 1.5;
    }
   .button-section {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }
    button {
      background-color: #0056b3;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      min-width: 180px;
    }
   .alternative-text {
      color: #666;
      margin-left: 10px;
      font-size: 14px;
      font-weight: 400;
    }
   .you-said-section {
      margin-top: 20px;
    }
   .you-said-label {
      font-weight: bold;
      color: #666;
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }
   .you-said-text {
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="input-section">
      <div class="input-field">
        All work and no play makes Jack a dull boy All work and no play makes Jack a dull boy All work and no play makes Jack a dull boy
      </div>
      <div class="button-section">
        <button>Find equilibrium</button>
        <span class="alternative-text">or crash someone else's party</span>
      </div>
    </div>
    <div class="you-said-section">
      <span class="you-said-label">YOU SAID:</span>
      <div class="you-said-text">
        All work and no play makes Jack a dull boy All work and no play makes Jack a dull boy All work and no play makes Jack a dull boy
      </div>
    </div>
  </div>
</body>
</html>
