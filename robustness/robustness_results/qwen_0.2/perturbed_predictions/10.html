<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEMP Quickstart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
       .container {
            max-width: 600px;
            text-align: center;
        }
        p {
            color: #666;
            font-size: 16px;
            margin: 20px 0;
        }
       .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
            transition: background-color 0.3s ease;
        }
       .btn:hover {
            background-color: #0069d9;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>See the LEMP 1-Click Quickstart guide for detailed assistance.</p>
        <button class="btn">Quickstart Guide</button>
        <p>Problem? Submit a question to our Q&A platform and get help from the community.</p>
        <button class="btn">Ask a Question</button>
    </div>
</body>
</html>
