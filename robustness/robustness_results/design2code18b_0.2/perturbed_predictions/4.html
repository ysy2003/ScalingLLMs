<html>
<body>
    <div class="header">
        <img src="logo.png" alt="Producer Application">
        <h1>Producer Application</h1>
        <p>Tell us a little about you and your experience. FAQ for more information.</p>
        <form action="#">
            <input type="text" placeholder="First Name *">
            <input type="text" placeholder="Last Name *">
            <input type="email" placeholder="Email Address *">
            <textarea placeholder="Phone Number"></textarea>
            <textarea placeholder="Where Do You Live? *"></textarea>
            <label for="age">I am at least 18 years of Age</label>
            <input type="radio" name="age" value="Yes">
            <input type="radio" name="age" value="No">
            <label for="education">Do You Have a Production Company?</label>
            <input type="radio" name="education" value="Yes">
            <input type="radio" name="education" value="No">
            <label for="experience">Tell Us More About You. *</label>
            <textarea placeholder="Preferred Genre *"></textarea>
            <label for="budget">Are You Confident You Can Create Full-Length Episodes (12-25 minutes) on a Low-Budget and Continue to Create Episodes if they are Renewed by Candivan Subscribers? *</label>
            <input type="radio" name="budget" value="Yes">
            <input type="radio" name="budget" value="No">
            <label for="collaborate">If Selected as a Winner, Would You be Able to Start Production by this May or June (2019)? *</label>
            <input type="radio" name="collaborate" value="Yes">
            <input type="radio" name="collaborate" value="No">
            <label for="other">Names of Others Plan to Collaborate with (if Applicable)</label>
            <textarea placeholder="Other Experience"></textarea>
            <label for="portfolio">Are you a member of the PGA? *</label>
            <input type="radio" name="portfolio" value="Yes">
            <input type="radio" name="portfolio" value="No">
            <label for="optional">OPTIONAL: These will large social networks are preferable. Feel free to list any large networks you are part of or your Twitter</label>
            <textarea placeholder="Optional Experience"></textarea>
            <label for="contact">How did you find out about us?</label>
            <input type="text" placeholder="Contact Information">
            <button type="submit">Submit Application</button>
        </form>
    </div>
    <footer>
        <p>&copy; 2023 Candivan Productions</p>
    </footer>
</body>
<style>
body {
    font-family: Arial, sans-serif;
}

.header {
    background-color: #f0f0f0;
    padding: 20px;
    text-align: center;
}

.header img {
    width: 100%;
    height: 100px;
    margin-bottom: 20px;
}

.header h1 {
    color: #fff;
    margin-top: 20px;
}

.header p {
    margin-bottom: 20px;
}

.form input[type="text"], .form input[type="radio"] {
    width: 100%;
    padding: 10px;
    border: none;
    margin-bottom: 20px;
}

.form label {
    display: block;
    margin-bottom: 10px;
}

.footer {
    background-color: #ddd;
    padding: 20px;
    text-align: center;
}

.footer p {
    margin-bottom: 20px;
}
</style>
</html>
