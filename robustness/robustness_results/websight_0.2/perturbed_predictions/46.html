<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    width: 80%;
    margin: auto;
    overflow: hidden;
}

.header {
    background: #1aac;
    color: white;
    padding: 10px 0;
    text-align: center;
}

.header h1 {
    margin: 0;
    padding: 20px 0;
}

.header p {
    margin: 0;
    padding: 10px 0;
}

.content {
    display: flex;
    justify-content: space-between;
    margin: 20px 0;
}

.left-column, .right-column {
    width: 48%;
    padding: 10px;
    background: #fff;
    border: 1px solid #ccc;
}

.footer {
    background: #1aac;
    color: white;
    text-align: center;
    padding: 10px 0;
}

.footer p {
    margin: 0;
    padding: 10px 0;
}

/* Fake Image Replacement */
.left-column img, .right-column img {
    width: 30px;
    height: 30px;
    background: #1aac;
    margin: 10px 0;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to our Fake Website</h1>
            <p>This is a simple and short website with a left column and a right column.</p>
        </div>
        <div class="content">
            <div class="left-column">
                <!-- Left column content goes here -->
            </div>
            <div class="right-column">
                <form>
                    <input type="text" placeholder="Search...">
                </form>
                <div class="faq">
                    <h2>Frequently Asked Questions</h2>
                    <!-- FAQ content goes here -->
                </div>
            </div>
        </div>
        <div class="footer">
            <p>Copyright © 2022</p>
        </div>
    </div>
</body>
</html>
