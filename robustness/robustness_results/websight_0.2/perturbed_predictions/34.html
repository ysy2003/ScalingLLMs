<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
}

.header {
    background-color: #f8f8f8;
    padding: 20px;
    text-align: center;
}

.header h1 {
    color: #333;
    font-size: 2.5em;
}

.header p {
    color: #999;
    font-size: 1.2em;
}

.content {
    display: flex;
    justify-content: space-between;
}

.left-column {
    width: 70%;
    padding: 20px;
}

.right-column {
    width: 30%;
    padding: 20px;
}

.footer {
    background-image: linear-gradient(to bottom, #f8f8f8, #333);
    color: #fff;
    padding: 20px;
    text-align: center;
}

.footer p {
    color: #999;
    font-size: 1.2em;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Our Restaurant</h1>
            <p>Experience the best of the best</p>
        </div>
        <div class="content">
            <div class="left-column">
                <!-- Left column content goes here -->
            </div>
            <div class="right-column">
                <!-- Right column content goes here -->
                <div class="guestbook">
                    <!-- Guestbook content goes here -->
                    <div class="guestbook-header">
                        <h2>Leave a Comment</h2>
                    </div>
                    <div class="guestbook-content">
                        <form>
                            <input type="text" placeholder="Name">
                            <input type="email" placeholder="Email">
                            <textarea placeholder="Comment"></textarea>
                            <input type="submit" value="Submit">
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="footer-content">
                <p>Copyright © 2022</p>
                <p>All rights reserved</p>
            </div>
        </div>
    </div>
</body>
</html>
