<html>

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: #333;
}

.hero {
    background-color: #d3d3d3;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.hero-text {
    font-size: 3em;
    text-align: center;
    margin-bottom: 20px;
}

.hero-image {

    margin-bottom: 20px;
}

.cta-button {

    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    font-size: 1.2em;
