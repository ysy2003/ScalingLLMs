<html>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
    font-size: 1.2em;
    color: #333;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 80%;
    height: 80%;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 10%;
}

.logo {
    width: 10%;
    height: 100%;
    background-color: #ff0000;
}

.menu {
    width: 80%;
    height: 10%;
    background-color: #00ff00;
}

.content {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    height: 80%;
}

.left-column {
    width: 50%;
    height: 100%;
    background-color: #ffff00;
}

.right-column {
    width: 50%;
    height: 100%;
    background-color: #0000ff;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 10%;
    background-color: #ff0000;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"></div>
            <div class="menu"></div>
        </div>
        <div class="content">
            <div class="left-column">
                <div class="services"></div>
                <div class="prices"></div>
            </div>
            <div class="right-column">
                <div class="issues"></div>
                <div class="questions"></div>
            </div>
        </div>
        <div class="footer">
            <div class="contact"></div>
            <div class="contact-info"></div>
        </div>
    </div>
</body>
</html>
