<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
}

.header {
    background-color: #f8f9fa;
    padding: 20px;
    text-align: center;
}

.content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
}

.product {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 80%;
    height: 100%;
}

.product-image {
    background-color: #6c757d;
    width: 100%;
    height: 200px;
    margin-bottom: 20px;
}

.product-description {
    color: #fff;
    text-align: center;
    font-size: 18px;
    margin-bottom: 20px;
}

.cta {
    background-color: #007bff;
    color: #fff;
    padding: 20px;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    cursor: pointer;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Our Technology Company</h1>
        </div>
        <div class="content">
            <div class="product">
                <div class="product-image"></div>
                <p class="product-description">See our latest product. It's a game-changer.</p>
                <button class="cta">Learn More</button>
            </div>
            <div class="product">
                <div class="product-image"></div>
                <p class="product-description">Our product is a must-have for everyone.</p>
                <button class="cta">Buy Now</button>
            </div>
            <!-- More products... -->
        </div>
    </div>
</body>
</html>
