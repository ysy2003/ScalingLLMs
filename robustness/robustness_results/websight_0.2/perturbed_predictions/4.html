<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #fff;
    color: #000;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #000;
    box-sizing: border-box;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.logo {
    width: 100px;
    height: 100px;
    background-color: #000;
    margin: 0 auto;
}

.content {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.left-column {
    width: 45%;
    background-color: #fff;
    padding: 20px;
    box-sizing: border-box;
}

.right-column {
    width: 45%;
    background-color: #fff;
    padding: 20px;
    box-sizing: border-box;
}

.footer {
    text-align: center;
    background-color: #000;
    color: #fff;
    padding: 10px;
    position: fixed;
    bottom: 0;
    width: 100%;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"></div>
        </div>
        <div class="content">
            <div class="left-column">
                <h1>Products</h1>
                <p>We offer a wide range of products for all your needs.</p>
            </div>
            <div class="right-column">
                <h1>Application</h1>
                <p>Our application is easy to use and very efficient.</p>
                <h2>Sign Up</h2>
                <form>
                    <!-- Form elements -->
                    <input type="text" placeholder="First Name">
                    <input type="text" placeholder="Last Name">
                    <input type="email" placeholder="Email">
                    <input type="submit" value="Sign Up">
                </form>
            </div>
        </div>
        <div class="footer">
            <p>Copyright © 2022</p>
        </div>
    </div>
</body>
</html>
