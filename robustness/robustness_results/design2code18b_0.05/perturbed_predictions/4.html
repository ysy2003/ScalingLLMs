<html>
<body>
    <div class="slider">
        <img src="#" alt="Producer Application">
    </div>
    <div class="content">
        <h1>Producer Application</h1>
        <p>Tell us a little about you and your experience. FAQ for more information.</p>
        <form>
            <input type="text" placeholder="First Name *">
            <input type="text" placeholder="Last Name *">
            <input type="email" placeholder="Email Address *">
            <textarea placeholder="Phone Number *"></textarea>
            <label for="age">Where Do You Live? *</label>
            <select id="age">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
            <label for="years_of_age">I am at Least 18 Years of Age *</label>
            <textarea placeholder="Do You Have a Production Company?" rows="5"></textarea>
            <label for="preferred_genre">Preferred Genre *</label>
            <select id="preferred_genre">
                <option value="Action">Action</option>
                <option value="Adventure">Adventure</option>
                <!-- Add more genres here -->
            </select>
            <label for="experience">Are You Confident You Can Create Full-Length Episodes (12-25 minutes) on a Low-Budget Continue to Create Episodes if they are Renewed by Candivan Studios? *</label>
            <textarea placeholder="If Selected as a Winner, Would You be Able to Start Production by this May or June?"></textarea>
            <label for="other_plans">Names of Others Plan to Collaborate with (if Applicable)</label>
            <textarea placeholder="Are you a member of the PGA?" rows="5"></textarea>
            <label for="optional_info">Optional: These with large social networks are preferable. Feel free to list any large networks you are part of or your Twitter.</label>
            <textarea placeholder="How did you find out about us?" rows="5"></textarea>
            <button>Submit</button>
            <a href="#">Report abuse</a>
            <a href="#">Powered by</a>
        </form>
    </div>
</body>
<style>
body {
    font-family: Arial, sans-serif;
}

.slider {
    height: 300px;
    background-color: #f00;
    margin-bottom: 20px;
}

.content {
    padding: 20px;
    text-align: center;
}

form {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

input[type="text"], input[type="email"], select, textarea {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
}

button {
    background-color: #ff69b4;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #ff7f0e;
}

a {
    color: white;
    text-decoration: none;
    margin-left: 10px;
}

a:hover {
    color: #ff7f0e;
}
</style>
</html>
