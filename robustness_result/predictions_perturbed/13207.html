            max-width: 1200px; /* Max width for header content */

        }

        .content-wrapper {
            max-width: 700px; /* Max width for the main content card */
            margin: 40px auto 0 auto; /* Center and add top margin */
            padding: 0 5%; /* Add horizontal padding for smaller screens */
        }

        .input-card {
            background-color: var(--card-background);
            border-radius: 8px;

            padding: 30px;
            margin-bottom: 40px; /* Space between card and "YOU SAID" */

        .input-textarea {
            width: 100%; /* Full width */

            padding: 10px;
            font-size: 1.1rem; /* Slightly larger font for input */
            color: var(--text-dark);
            resize: vertical; /* Allow vertical resizing */
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
            margin-bottom: 20px; /* Space between textarea and actions */
        }

        .input-textarea::placeholder {
            color: var(--text-light);

            align-items: center;

            cursor: pointer;

        }

        }

        .you-said-label {

            line-height: 1.3;

    </main>
</body>
</html>
