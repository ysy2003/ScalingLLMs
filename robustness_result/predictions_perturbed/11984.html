<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atha Yoga Nusasanam</title>
    <style>
        /* Basic Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: #fff; /* Default body background */
        }

        /* CSS Variables for Colors */
        :root {
            --blue-header: #0000A0; /* Darker blue */
            --light-green: #E0EEDD;
            --yellow-accent: #FFFF00;
            --main-bg: #F0F0E0; /* Light beige/cream */
            --nav-bg: #D0D0C0; /* Slightly darker beige for nav */
            --text-dark: #333;
            --text-medium: #666;
            --text-light: #999;
        }

        /* Container for content width */
        .container {
            max-width: 900px; /* Based on visual estimation */
            margin: 0 auto;
            padding: 0 20px; /* Padding for smaller screens */
        }

        /* Header Section */
        .blue-banner {
            background-color: var(--blue-header);
            height: 250px; /* Estimated height */
        }

        .green-banner {
            background-color: var(--light-green);
            padding: 20px 0;
            text-align: center;
        }

        .green-banner h1 {
            font-size: 3em; /* Large font size */
            font-weight: normal; /* Looks like normal weight */
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .green-banner h1 .yellow {
            color: var(--yellow-accent);
        }

        .green-banner p {
            font-size: 1.1em;
            color: var(--text-medium);
        }

        /* Navigation Section */
        nav {
            background-color: var(--nav-bg);
            padding: 10px 0;
            text-align: center;
            border-top: 1px solid #ccc; /* Subtle border */
            border-bottom: 1px solid #ccc;
        }

        nav a {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            padding: 0 10px;
            white-space: nowrap; /* Prevent wrapping of nav items */
        }

        nav a:hover {
            text-decoration: underline;
        }

        nav span.separator {
            color: var(--text-dark);
            padding: 0 5px;
        }

        /* Main Content Section */
        .main-content {
            background-color: var(--main-bg);
            padding: 40px 0;
        }
