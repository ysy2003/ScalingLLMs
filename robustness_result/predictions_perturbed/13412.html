```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graham Llewellyn Art</title>
    <style>
        /* Basic Reset */
        body, h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, figcaption, blockquote, dl, dd {
            margin: 0;
            padding: 0;
        }
        ul {
            list-style: none;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #fff; /* Main content background */
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ensure footer sticks to bottom */
        }

        /* Header Styling */
        .header {
            background-color: #444; /* Dark gray */
            color: #eee; /* Light gray text */
            padding: 15px 20px; /* Vertical and horizontal padding */
            display: flex;
            justify-content: space-between; /* Pushes title to left, nav to right */
            align-items: center; /* Vertically centers items */
            flex-wrap: wrap; /* Allow items to wrap on smaller screens */
        }

        .header-title {
            font-size: 1.8em; /* Larger font for title */
            font-weight: normal;
            margin-right: 20px; /* Space between title and nav if they wrap */
        }

        .nav-list {
            display: flex; /* Horizontal navigation */
            gap: 25px; /* Space between nav items */
        }

        .nav-list a {
            color: #eee; /* Light gray for links */
            font-size: 1em; /* Standard font size */
            white-space: nowrap; /* Prevent links from breaking */
        }

        /* Main Content Styling */
        .main-content {
            flex-grow: 1; /* Allows main content to take up available space */
            padding: 40px 20px; /* Padding around main content */
            text-align: center; /* Center "Welcome" text and blue box */
        }

        .welcome-heading {
            font-size: 2.5em; /* Large font for "Welcome" */
            color: #000; /* Black text */
            margin-bottom: 40px; /* Space below "Welcome" */
        }

        .blue-box {
            width: 600px; /* Fixed width as per image */
            height: 400px; /* Fixed height as per image */
            background-color: #0000ff; /* Blue color */
            margin: 0 auto; /* Center horizontally */
            max-width: 90%; /* Ensure it scales down on very small screens */
            box-sizing: border-box; /* Include padding/border in width/height */
        }

        /* Footer Styling */
        .footer {
            background-color: #444; /* Dark gray */
            color: #eee; /* Light gray text */
            padding: 15px 20px; /* Vertical and horizontal padding */
            font-size: 0.9em; /* Slightly smaller font for footer text */
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header {
                flex-direction: column; /* Stack title and nav vertically */
                align-items: flex-start; /* Align items to the start */
            }
            .header-title {
                margin-bottom: 10px; /* Space below title when stacked */
                margin-right: 0;
            }
            .nav-list {
                flex-direction: column; /* Stack nav links vertically */
                gap: 10px; /* Smaller gap when stacked */
                width: 100%; /* Take full width */
                align-items: flex-start; /* Align links to the start */
            }
            .nav-list a {
                padding: 5px 0; /* Add some padding for touch targets */
            }
            .welcome-heading {
                font-size: 2em; /* Adjust font size for smaller screens */
            }
            .blue-box {
                width: 90%; /* Make blue box more responsive */
                /* Maintain 3:2 aspect ratio (400/600 = 2/3) */
                height: calc(90vw * 2 / 3);
                min-height: 200px; /* Ensure it doesn't get too small */
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 10px 15px;
            }
            .header-title {
                font-size: 1.5em;
            }
            .nav-list a {
                font-size: 0.9em;
            }
            .main-content {
                padding: 20px 15px;
            }
            .welcome-heading {
                font-size: 1.8em;
                margin-bottom: 25px;
            }
            .blue-box {
                width: 95%;
                /* Maintain 3:2 aspect ratio */
                height: calc(95vw * 2 / 3);
                min-height: 150px;
            }
            .footer {
                padding: 10px 15px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title">Graham Llewellyn Art</h1>
        <nav>
            <ul class="nav-list">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">Links</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <h2 class="welcome-heading">Welcome</h2>
        <div class="blue-box"></div>
    </main>

    <footer class="footer">
        <p>Powered by Clikpic</p>
    </footer>
</body>
</html>
