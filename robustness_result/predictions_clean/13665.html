<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetings & Events</title>
    <style>
        /* Global Reset & Body Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #fff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* Header */
        .header {
            background-color: #000;
            color: #fff;
            padding: 10px 0;
            position: relative;
            z-index: 1000;
        }

        .header-top {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 20px;
            font-size: 0.85em;
            border-bottom: 1px solid #222; /* Subtle separator */
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        .header-top-nav a {
            margin-left: 20px;
            color: #ccc;
            transition: color 0.3s ease;
        }

        .header-top-nav a:hover {
            color: #fff;
        }

        .reservations-btn {
            background-color: #888;
            color: #000;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            font-size: 0.85em;
            margin-left: 20px;
            transition: background-color 0.3s ease;
        }

        .reservations-btn:hover {
            background-color: #a0a0a0;
        }

        .header-main {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 20px;
            font-size: 0.95em;
            text-transform: uppercase;
        }

        .logo-placeholder {
            position: absolute;
            top: 20px; /* Adjust based on header-top height */
            left: 20px;
            width: 150px;
            height: 40px;
            background-color: #0000FF; /* Blue color from image */
        }

        .header-main-nav a {
            margin-left: 30px;
            color: #fff;
            transition: color 0.3s ease;
        }

        .header-main-nav a:hover {
            color: #ccc;
        }

        /* Hero Section */
        .hero {
            background-color: #000; /* Dark background as per image */
            color: #fff;
            text-align: center;
            padding: 150px 20px 100px; /* Adjust padding to push content down */
            min-height: 400px; /* Ensure it takes up significant space */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Align content to the bottom */
            align-items: flex-start; /* Align content to the left */
            padding-left: 10%; /* Indent from left */
            padding-bottom: 80px; /* Space from bottom */
        }

        .hero h1 {
            font-family: Georgia, serif;
            font-size: 4em;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-align: left;
        }

        .hero p {
            font-size: 1.2em;
            letter-spacing: 1px;
            text-align: left;
        }

        /* Main Content Area */
        .main-content-wrapper {
            display: flex;
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
            gap: 40px; /* Space between sidebar and main content */
        }

        .sidebar {
            flex: 0 0 250px; /* Fixed width for sidebar */
            padding-right: 40px;
            border-right: 1px solid #eee; /* Subtle separator */
        }

        .sidebar-nav ul {
            margin-top: 20px;
        }

        .sidebar-nav li {
            margin-bottom: 15px;
        }

        .sidebar-nav a {
            font-size: 1.1em;
            color: #333;
            transition: color 0.3s ease;
        }

        .sidebar-nav a:hover {
            color: #000;
        }

        .contact-button {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin-top: 30px;
            background: linear-gradient(to bottom, #a0a0a0, #707070);
            color: #fff;
            text-align: center;
            text-transform: uppercase;
            font-size: 0.9em;
            border: 1px solid #707070;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .contact-button:hover {
            background: linear-gradient(to bottom, #b0b0b0, #808080);
        }

        .sidebar p {
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
        }

        .content-area {
            flex-grow: 1;
            padding-left: 40px;
        }

        .share-text {
            text-align: right;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
        }

        .content-area h2 {
            font-family: Georgia, serif;
            font-size: 2.5em;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .content-area h3 {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: normal;
        }

        .content-area p {
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .content-area h4 {
            font-size: 1.1em;
            margin-top: 30px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .content-area ul {
            list-style-type: disc;
            margin-left: 25px;
            margin-bottom: 20px;
        }

        .content-area ul li {
            margin-bottom: 8px;
        }

        /* Footer */
        .footer {
            background-color: #000;
            color: #ccc;
            padding: 40px 20px;
            font-size: 0.85em;
            text-align: center;
            margin-top: 50px;
        }

        .footer-links {
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .footer-links a {
            color: #ccc;
            margin: 0 10px;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #fff;
        }

        .footer-links span {
            margin: 0 5px;
            color: #555; /* Separator color */
        }

        .social-icons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .social-icon {
            width: 30px;
            height: 30px;
            margin: 0 5px;
            background-color: #555; /* Default color */
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .social-icon.facebook { background-color: #3b5998; }
        .social-icon.twitter { background-color: #00acee; }
        .social-icon.instagram { background-color: #C13584; } /* Using a common Instagram color */
        .social-icon.linkedin { background-color: #0e76a8; } /* Using a common LinkedIn color */


        /* Responsive Design */
        @media (max-width: 1024px) {
            .hero h1 {
                font-size: 3.5em;
            }
            .hero p {
                font-size: 1.1em;
            }
            .main-content-wrapper {
                flex-direction: column;
                gap: 20px;
            }
            .sidebar {
                flex: none;
                width: 100%;
                padding-right: 0;
                border-right: none;
                border-bottom: 1px solid #eee;
                padding-bottom: 20px;
            }
            .content-area {
                padding-left: 0;
            }
            .sidebar-nav ul {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                margin-top: 0;
            }
            .sidebar-nav li {
                margin: 0 15px 10px;
            }
            .contact-button {
                width: 80%;
                margin-left: auto;
                margin-right: auto;
            }
            .sidebar p {
                text-align: center;
            }
            .share-text {
                text-align: left;
            }
        }

        @media (max-width: 768px) {
            .header-top, .header-main {
                flex-direction: column;
                align-items: flex-end;
                padding: 10px 20px;
            }
            .header-top-nav a, .header-main-nav a {
                margin: 5px 0;
            }
            .reservations-btn {
                margin-top: 10px;
                margin-left: 0;
            }
            .header-main-nav {
                margin-top: 10px;
                text-align: right;
            }
            .logo-placeholder {
                top: 10px;
                left: 10px;
                width: 120px;
                height: 30px;
            }
            .hero {
                padding: 100px 20px 60px;
                padding-left: 5%;
            }
            .hero h1 {
                font-size: 2.5em;
            }
            .hero p {
                font-size: 1em;
            }
            .content-area h2 {
                font-size: 2em;
            }
            .footer-links a {
                display: block;
                margin: 5px 0;
            }
            .footer-links span {
                display: none; /* Hide separators on small screens */
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2em;
            }
            .hero p {
                font-size: 0.9em;
            }
            .sidebar-nav ul {
                flex-direction: column;
                align-items: center;
            }
            .sidebar-nav li {
                margin: 5px 0;
            }
            .contact-button {
                width: 95%;
            }
        }
    </style>
</head>
