<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCC Event Blog</title>
    <style>
        /* Basic Reset & Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            background-color: #f0f0f0; /* Light gray background */
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto; /* Top/bottom margin for the whole container */
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px); /* Adjust for body margin */
        }

        /* Header */
        header {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .logo-section {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .blue-box {
            width: 60px; /* Adjusted size based on visual */
            height: 60px; /* Adjusted size based on visual */
            background-color: #0000ff; /* Bright blue */
            margin-right: 15px;
            flex-shrink: 0; /* Prevent shrinking on smaller screens */
        }

        header h1 {
            font-size: 2.2em; /* Larger font for blog title */
            font-weight: bold;
            color: #333;
            white-space: nowrap; /* Prevent wrapping of title */
        }

        .main-nav {
            background-color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            flex-wrap: wrap; /* Allow items to wrap on smaller screens */
        }

        .main-nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .main-nav ul li {
            margin-right: 20px;
        }

        .main-nav ul li:last-child {
            margin-right: 0;
        }

        .main-nav ul li a {
            color: #fff;
            text-decoration: none;
            padding: 5px 0;
            display: block;
            font-weight: bold;
            transition: border-bottom 0.3s ease;
        }

        .main-nav ul li a:hover {
            border-bottom: 3px solid #ffa500; /* Orange hover effect */
        }

        .search-bar {
            display: flex;
            align-items: center;
            margin-left: auto; /* Push to the right */
        }

        .search-bar input[type="text"] {
            border: 1px solid #ccc;
            padding: 8px 10px;
            font-size: 0.9em;
            border-radius: 0; /* Remove default border-radius */
            outline: none;
            width: 180px; /* Fixed width for search input */
        }

        .search-bar button {
            background-color: #ffa500; /* Orange button */
            border: none;
            padding: 8px 15px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9em;
            height: 36px; /* Match input height */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
        }

        /* Main Content Area */
        .content-area {
            display: flex;
            flex: 1; /* Allow main content to grow */
            padding: 20px;
            gap: 30px; /* Space between columns */
        }

        .main-content {
            flex: 2; /* Takes 2/3 of the space */
            padding-right: 20px; /* Internal padding */
            border-right: 1px solid #eee; /* Separator line */
        }

        .sidebar {
            flex: 1; /* Takes 1/3 of the space */
            padding-left: 20px; /* Internal padding */
        }

        /* Main Content - Left Column */
        .section-title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .section-divider {
            border: none;
            border-top: 1px solid #ccc;
            margin-bottom: 30px;
        }

        .blog-post {
            margin-bottom: 40px;
            overflow: hidden; /* Clear float for read-more-btn */
        }

        .blog-post h3 {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .post-date {
            font-size: 0.9em;
            color: #777;
            margin-bottom: 15px;
        }

        .post-excerpt {
            margin-bottom: 20px;
            line-height: 1.8;
            color: #555;
        }
