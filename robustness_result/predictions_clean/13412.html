```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graham Llewellyn Art</title>
    <style>
        /* Basic Reset */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5; /* Light gray background for the main content area */
            color: #333;
            line-height: 1.6;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header Styling */
        header {
            background-color: #4a4a4a; /* Dark gray background */
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; /* Allow items to wrap on smaller screens */
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: normal; /* Appears normal weight in the image */
        }

        nav ul {
            display: flex;
            gap: 20px;
        }

        nav a {
            font-size: 16px;
            white-space: nowrap; /* Prevent links from breaking */
        }

        /* Main Content Styling */
        main {
            padding: 40px 20px;
            text-align: center;
            min-height: calc(100vh - 150px); /* Approximate height to push footer down if content is short */
            box-sizing: border-box;
        }

        h2 {
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 30px;
            color: #333; /* Darker text for heading */
        }

        .blue-box {
            width: 70%;
            max-width: 800px; /* Max width to prevent it from getting too large on wide screens */
            height: 400px; /* Fixed height for the box */
            background-color: #0000ff; /* Solid blue */
            margin: 0 auto; /* Center the box horizontally */
        }

        /* Footer Styling */
        footer {
            background-color: #4a4a4a; /* Dark gray background */
            color: white;
            padding: 15px 20px;
            text-align: left;
        }

        footer p {
            margin: 0;
            font-size: 14px;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                padding-bottom: 10px; /* Add some space below header title */
            }

            nav ul {
                margin-top: 15px;
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            header h1 {
                font-size: 22px;
            }

            h2 {
                font-size: 30px;
                margin-bottom: 25px;
            }

            .blue-box {
                width: 90%; /* Make blue box wider on smaller screens */
                height: 300px; /* Reduce height for smaller screens */
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 10px 15px;
            }

            header h1 {
                font-size: 20px;
            }

            nav a {
                font-size: 15px;
            }

            main {
                padding: 30px 15px;
            }

            h2 {
                font-size: 26px;
                margin-bottom: 20px;
            }

            .blue-box {
                height: 200px; /* Further reduce height for very small screens */
            }

            footer {
                padding: 10px 15px;
            }

            footer p {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Graham Llewellyn Art</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">Links</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Welcome</h2>
        <div class="blue-box"></div>
    </main>

    <footer>
        <p>Powered by Clikpic</p>
    </footer>
</body>
</html>
