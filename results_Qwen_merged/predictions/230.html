<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }
   .container {
      text-align: center;
    }
   .blue-rectangle {
      width: 300px;
      height: 150px;
      background-color: #0000ff;
      margin-bottom: 20px;
    }
   .text {
      color: white;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
   .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
   .btn {
      background-color: #ffa500;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="blue-rectangle"></div>
    <div class="text">Do you have an Enagic Client ID<br>Number?</div>
    <div class="buttons">
      <button class="btn">YES</button>
      <button class="btn">NO</button>
    </div>
  </div>
</body>
</html>
