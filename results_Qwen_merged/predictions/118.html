<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Softros LAN Messenger Online Help</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #fff;
    }

    header {
      background-color: #fff;
    }

   .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

   .logo {
      width: 100px;
      height: 30px;
      background-color: #0000FF;
    }

    nav ul {
      display: flex;
      list-style: none;
    }

    nav ul li {
      margin-left: 15px;
    }

    nav ul li a {
      text-decoration: none;
      color: #000;
      font-weight: 500;
    }

   .main-header {
      background-color: #2E3B4E;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

   .main-header h1 {
      color: #fff;
      font-size: 1.2em;
    }

   .search-box {
      display: flex;
      align-items: center;
    }

   .search-box input {
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 3px;
      margin-right: 5px;
      width: 250px;
    }

   .search-box button {
      background-color: #0000FF;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }

    main {
      padding: 20px;
      background-color: #fff;
    }

    h2 {
      color: #333;
      font-size: 1.5em;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 15px;
    }

    ol {
      counter-reset: step;
      list-style-type: none;
    }

    ol li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 15px;
    }

    ol li:before {
      content: counter(step);
      counter-increment: step;
      position: absolute;
      left: 0;
      color: #000;
      font-weight: bold;
      font-size: 1.2em;
    }

   .step-image {
      margin-top: 10px;
      text-align: center;
    }

      width: 100%;
      height: 200px;
