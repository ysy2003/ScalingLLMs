<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
   .header {
      background-color: #333333;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
   .site-title {
      font-size: 1.5em;
      font-weight: bold;
    }
   .nav-links {
      display: flex;
      gap: 15px;
      align-items: center;
    }
   .nav-links a {
      color: white;
      text-decoration: none;
    }
   .content {
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }
   .blue-box {
      width: 80%;
      height: 300px;
      background-color: #0000FF;
      margin: 0 auto;
      display: block;
    }
   .footer {
      background-color: #333333;
      color: white;
      padding: 10px;
      text-align: center;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="site-title">Graham Llewellyn Art</div>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Gallery</a>
      <a href="#">Links</a>
    </nav>
  </header>
  <main class="content">
    <h1>Welcome</h1>
    <div class="blue-box"></div>
  </main>
  <footer class="footer">
    <p>Powered by Clikpic</p>
  </footer>
</body>
</html>
