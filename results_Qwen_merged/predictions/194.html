<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swimwear & Lingerie</title>
  <style>
    body {
      background-color: #000;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
   .container {
      text-align: center;
      max-width: 800px;
      padding: 20px;
    }
   .headline {
      font-size: 2.5rem;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      line-height: 1.2;
      margin-bottom: 20px;
    }
   .subtext {
      font-size: 1rem;
      color: #fff;
      margin-bottom: 30px;
    }
   .button {
      background-color: #d4b69a;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="headline">
      DISCOVER A<br>FASCINATING<br>WORLD OF<br>MARC & ANDRÉ<br>SWIMWEAR<br>& LINGERIE!
    </div>
    <p class="subtext">take a deep breath and...</p>
    <button class="button">DIVE</button>
  </div>
</body>
</html>
