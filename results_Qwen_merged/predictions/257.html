<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican Inn Monterey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

       .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e6f0ff;
            padding: 10px 20px;
        }

       .logo-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

       .logo-square {
            width: 80px;
            height: 80px;
            background-color: #0000cc;
        }

       .logo-info h1 {
            color: #000;
        }

       .logo-info p {
            color: #666;
        }

       .reservation-form {
            background-color: #fff;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

       .reservation-form h2 {
            text-align: center;
            margin-bottom: 10px;
        }

       .form-group {
            margin-bottom: 5px;
        }

       .form-group label {
            display: block;
            margin-bottom: 3px;
        }

       .form-group input {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        nav {
            background-color: #2c3e50;
            padding: 10px 20px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav li a {
            color: white;
            text-decoration: none;
        }

       .hero {
            background-color: #00a0e9;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            text-align: center;
        }

       .amenities {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            padding: 20px;
        }

       .amenity-box {
            flex: 1;
            min-width: 300px;
            margin-bottom: 20px;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

       .amenity-box h3 {
            background-color: #ff9900;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            margin-bottom: 10px;
        }

       .amenity-box ul {
            list-style-type: disc;
            padding-left: 20px;
        }

       .blue-square {
            width: 100px;
            height: 100px;
            background-color: #0000cc;
            margin-top: 10px;
        }

       .location {
            padding: 20px;
        }

       .directions {
            margin-bottom: 20px;
        }

       .directions h3 {
            color: #ff9900;
            margin-bottom: 5px;
        }

       .directions p {
            line-height: 1.5;
        }

       .directions:last-child {
            display: flex;
            align-items: center;
            gap: 10px;
        }

       .directions:last-child input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

       .directions:last-child button {
            background-color: #ff9900;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
        }
