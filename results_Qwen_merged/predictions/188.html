<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
   .container {
      display: flex;
      min-height: 100vh;
    }
   .sidebar {
      width: 250px;
      background-color: #2d3748;
      height: 100vh;
    }
   .content {
      flex: 1;
      background-color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    h1 {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-bottom: 0.5em;
    }
    h2 {
      font-size: 48px;
      color: #ff6b6b;
      margin: 0 0 1em 0;
    }
    h3 {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 1em;
    }
    p {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 1.5em;
    }
    hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 1.5em 0;
    }
    h4 {
      font-size: 14px;
      color: #666;
      margin-bottom: 0.5em;
    }
   .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      padding: 8px 16px;
      border: 1px solid #3182ce;
      border-radius: 4px;
      background: transparent;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar"></div>
    <div class="content">
      <h1>Server Error</h1>
      <h2>503</h2>
      <h3>Service Temporarily Unavailable</h3>
      <p>The server is temporarily unable to service your request due to maintenance downtime or capacity problems. Please try again later.</p>
      <hr>
      <h4>That's what you can do</h4>
      <div class="buttons">
        <button>Reload Page</button>
        <button>Back to Previous Page</button>
        <button>Home Page</button>
      </div>
    </div>
  </div>
</body>
</html>
