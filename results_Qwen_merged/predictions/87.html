<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design to Code</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #ffffff;
    }

    nav {
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      border-top: 1px solid #000;
    }

    nav a {
      text-decoration: none;
      color: #000;
      margin: 0 10px;
      font-weight: bold;
    }

   .container {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
    }

   .blue-box {
      background-color: #0000ff;
    }

   .small {
      width: 200px;
      height: 100px;
    }

   .large {
      width: 80%;
      height: 300px;
    }

    footer {
      text-align: center;
      padding: 20px 0;
      font-size: 0.9em;
      color: #666;
    }

    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        padding: 10px;
      }
      nav a {
        margin: 5px 0;
      }
     .container {
        flex-direction: column;
        align-items: center;
      }
     .small {
        width: 100%;
        height: 100px;
      }
     .large {
        width: 100%;
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="#">HOME</a>
    <a href="#">CONTACT</a>
    <a href="#">WEDDINGS</a>
    <a href="#">PLACES</a>
  </nav>
  <div class="container">
    <div class="blue-box small"></div>
    <div class="blue-box large"></div>
  </div>
  <footer>
    Copyright © 2023 Rachel Branham – All Rights Reserved.
  </footer>
</body>
</html>
