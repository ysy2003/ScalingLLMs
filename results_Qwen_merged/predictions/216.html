<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #fff;
        }
       .banner {
            background-color: #1a2b5d;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
       .main-header {
            background-color: #2c3e8f;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #34495e;
        }
       .logo {
            background-color: #1a2b5d;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: inline-block;
            margin-right: 10px;
        }
       .main-header h1 {
            color: white;
            margin: 0;
            font-size: 1.4rem;
        }
       .search-bar {
            background-color: #2c3e8f;
            color: white;
            padding: 5px 15px;
            border-radius: 4px;
            display: inline-block;
            margin: 0 10px;
            font-size: 0.9rem;
        }
       .breadcrumb {
            color: white;
            font-size: 0.9rem;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
       .container {
            display: flex;
            margin: 20px;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }
       .sidebar {
            width: 200px;
            background-color: white;
            padding: 20px;
            margin-right: 20px;
            border-right: 1px solid #eee;
            border-left: 1px solid #eee;
        }
       .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
       .sidebar li {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
       .sidebar li a {
            color: #2c3e8f;
            text-decoration: none;
        }
       .sidebar li a:hover {
            text-decoration: underline;
        }
       .content {
            flex: 1;
            padding: 20px;
            background-color: white;
            border-left: 1px solid #eee;
        }
       .content h1 {
            margin-top: 0;
            color: #2c3e8f;
            font-size: 2rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
       .content h2 {
            color: #2c3e8f;
            font-size: 1.4rem;
            margin-top: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
       .content p {
