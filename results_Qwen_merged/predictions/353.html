<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design to Code Task</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffffff;
      color: #333333;
      line-height: 1.6;
    }
   .container {
      display: flex;
      min-height: 100vh;
    }
   .sidebar {
      width: 200px;
      background-color: #ffffff;
      padding: 20px 0;
      border-right: 1px solid #e0e0e0;
    }
   .logo {
      width: 100px;
      height: 100px;
      background-color: #0000ff;
      margin-bottom: 20px;
    }
   .sidebar ul {
      list-style: none;
    }
   .sidebar li {
      margin: 10px 0;
    }
   .sidebar a {
      text-decoration: none;
      color: #333333;
      font-weight: 500;
      display: block;
    }
   .sidebar a:hover {
      color: #000000;
    }
   .sidebar a.orange {
      color: #ff6b00;
    }
   .main-content {
      flex: 1;
      padding: 20px;
    }
   .blue-bar {
      height: 200px;
      background-color: #0000ff;
      margin: 20px 0;
    }
   .label-bar {
      display: flex;
      justify-content: space-around;
      background-color: #ffffff;
      padding: 10px 0;
      margin: 20px 0;
      border-top: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
    }
   .label {
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }
   .copyright {
      text-align: center;
      font-size: 12px;
      color: #666666;
      margin-top: 20px;
    }
    @media (max-width: 768px) {
     .container {
        flex-direction: column;
      }
     .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        padding: 20px 0;
      }
     .main-content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="logo"></div>
      <ul>
        <li><a href="#" class="orange">Monthly Newsletter</a></li>
        <li><a href="#">Ways to Support my Work</a></li>
        <li><a href="#">ALLTHINGSS</a></li>
        <li><a href="#">UPCOMING SHOWS</a></li>
        <li><a href="#">Dragonfly Press</a></li>
        <li><a href="#">Stickers</a></li>
        <li><a href="#" class="orange">Kraft Paper Muse</a></li>
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">CONTACT</a></li>
      </ul>
    </div>
    <div class="main-content">
      <div class="blue-bar"></div>
      <div class="label-bar">
        <div class="label">UPCOMING SHOWS</div>
        <div class="label">TWO CROWS</div>
        <div class="label">DRAGONFLY PRESS</div>
      </div>
      <div class="blue-bar"></div>
      <div class="label-bar">
        <div class="label">STICKERS</div>
        <div class="label">KENTUCKY BROWNCOATS</div>
        <div class="label">DECKS</div>
      </div>
      <div class="copyright">Copyright 1986-2022 Ana Maria Selvaggio | Renneleon</div>
    </div>
  </div>
</body>
</html>
