<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
    }
   .container {
      display: flex;
      flex-direction: row;
      align-items: center;
      min-height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
    }
   .menu-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-right: 40px;
    }
   .hamburger {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
   .hamburger-line {
      width: 24px;
      height: 2px;
      background-color: #c00;
      margin: 3px 0;
    }
   .menu-text {
      color: #c00;
      font-size: 12px;
      margin-top: 5px;
    }
   .main-content {
      text-align: center;
      margin-top: 20px;
    }
    h1 {
      font-size: 3rem;
      font-weight: bold;
      color: #c00;
      margin: 0;
      line-height: 1.2;
    }
    hr {
      border: 0;
      border-top: 1px solid #c00;
      margin: 20px 0;
    }
    p {
      font-size: 1rem;
      color: #333;
      margin: 20px 0;
    }
   .back-to-top {
      color: #c00;
      text-decoration: none;
      font-weight: bold;
      display: block;
      margin: 20px 0;
      text-align: center;
    }
    footer {
      background-color: #000;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
   .footer-content {
      display: flex;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
    }
   .location,
   .contact,
   .copyright {
      flex: 1;
      margin: 0 10px;
    }
    strong {
      display: block;
      margin-bottom: 5px;
    }
   .copyright a {
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="menu-icon">
      <div class="hamburger">
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
      </div>
      <div class="menu-text">MENU</div>
    </div>
    <div class="main-content">
      <h1>THIS PAGE DOES NOT EXIST</h1>
      <hr>
      <p>Please use the menu above to find what you were looking for.</p>
      <a href="#" class="back-to-top">BACK TO TOP</a>
    </div>
  </div>
  <footer>
    <div class="footer-content">
      <div class="location">
        <strong>LOCATION</strong
