<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlantic Flyway Canada Goose Recruitment Studies</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }
   .header {
      background-color: #0000FF;
      height: 100px;
      width: 100%;
    }
   .container {
      display: flex;
      flex-direction: row;
      margin: 20px;
    }
   .main-content {
      flex: 1;
      padding: 20px;
      background-color: #fff;
    }
   .sidebar {
      flex: 0 0 30%;
      background-color: #f5f5f5;
      padding: 20px;
    }
   .grant-details {
      border: 1px solid #ccc;
      padding: 15px;
      margin: 15px 0;
    }
   .detail-row {
      display: flex;
      margin-bottom: 10px;
    }
   .label {
      font-weight: bold;
      width: 150px;
    }
   .value {
      flex: 1;
    }
   .grant-details.detail-row:nth-child(1).value {
      color: #c00;
    }
   .grant-details.detail-row:nth-child(2).value {
      color: #0000ff;
    }
   .sidebar h2 {
      margin-top: 0;
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 10px;
    }
   .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
   .sidebar li {
      margin-bottom: 5px;
    }
   .sidebar a {
      text-decoration: none;
      color: #000;
    }
   .footer-links {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }
   .footer-links a {
      margin: 0 5px;
      text-decoration: none;
      color: #000;
    }
   .footer-links a:hover {
      text-decoration: underline;
    }
   .footer-links p {
      text-align: center;
      font-size: 0.9em;
      color: #666;
    }
    @media (max-width: 768px) {
     .container {
        flex-direction: column;
      }
     .main-content {
        width: 100%;
      }
