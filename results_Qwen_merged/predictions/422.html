<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Conferencing</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }
   .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
   .top-bar {
      height: 10px;
      background-color: #0056d6;
      width: 100%;
      margin-bottom: 20px;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }
   .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
   .button-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      background-color: #0056d6;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    span {
      color: #666;
      font-size: 14px;
    }
   .made-with {
      text-align: center;
      margin: 20px 0 10px 0;
    }
   .made-with a {
      color: #0056d6;
      text-decoration: underline;
    }
    footer {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    footer a {
      margin: 0 5px;
      color: #666;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar"></div>
    <h1>Video Conferencing</h1>
    <div class="button-group">
      <div class="button-item">
        <button>Join</button>
        <span>Connect to a meeting in progress</span>
      </div>
      <div class="button-item">
        <button>Host</button>
        <span>Start a meeting</span>
      </div>
      <div class="button-item">
        <button>Sign in</button>
        <span>Configure your account</span>
      </div>
    </div>
    <div class="made-with">Made with <a href="#">Zoom</a></div>
    <footer>
      <a href="#">Getting Started</a>
      <a href="#">Download Client</a>
      <a href="#">Zoom Support</a>
    </footer>
  </div>
</body>
</html>
