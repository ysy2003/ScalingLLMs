<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bineau Team Market Report</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f9f9f9;
    }
   .header {
      display: flex;
      align-items: center;
      padding: 20px;
      background-color: #fff;
      border-bottom: 2px solid #000;
    }
   .blue-square {
      width: 100px;
      height: 100px;
      background-color: #0000FF;
      margin-right: 20px;
    }
   .header-content h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }
   .header-content p {
      font-size: 14px;
      color: #666;
    }
   .divider {
      border: 0;
      border-top: 2px solid #000;
      width: 100%;
      margin: 20px 0;
    }
   .container {
      background-color: #f5f5f5;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
   .container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
   .form-group {
      margin-bottom: 15px;
    }
   .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
   .form-group input,
   .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
   .form-group select {
      height: auto;
    }
   .form-group input[type="checkbox"] {
      margin-right: 5px;
    }
   .submit-btn {
      background-color: #FF9900;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 20px auto;
      width: 200px;
    }
   .powered-by {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="blue-square"></div>
    <div class="header-content">
      <h1>The Bineau Team Market Report</h1>
      <p>Jim and Anita Bineau | [PHONE REDACTED] | bineauteamaspen.com</p>
    </div>
  </div>
  <hr class="divider">
  <div class="container">
    <h2>Stay Informed</h2>
    <form>
      <div class="form-group">
        <label for="firstName">First Name (required)</label>
        <input type="text" id="firstName" name="firstName" required>
      </div>
      <div class="form-group">
        <label for="lastName">Last Name (optional)</label>
        <input type="text" id="lastName" name="lastName">
      </div>
      <div class="form-group">
        <label for="email">E-Mail Address (required)</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" name="phone">
      </div>
      <div class="form-group">
        <label for="reports">Reports</label>
        <select id="reports" name="reports" multiple>
          <option value="aspen_all">ASPEN, CO, All ZIP Codes</option>
          <option value="aspen_81611">ASPEN, CO, 81611</option>
          <option value="basalt_81621">BASALT, CO, 81621</option>
          <option value="carbondale_all">CARBONDALE, CO, All ZIP Codes</option>
          <option value="craig_81625">CRAIG, CO, 81625</option>
          <option value="glenwood_81601">GLENWOOD SPRINGS, CO, 81601</option>
          <option value="newcastle_81647">NEW CASTLE, CO, 81647</option>
          <option value="rifle_81650">RIFLE, CO, 81650</option>
          <option value="silt_81652">SILT, CO, 81652</option>
        </select>
      </div>
      <div class="form-group">
        <input type="checkbox" id="sendNow" name="sendNow">
        <label for="sendNow">Send Report(s) Now?</label>
      </div>
      <button type="submit" class="submit-btn">Keep Me Informed</button>
      <p class="powered-by">Powered by Altos Research Inc.</p>
    </form>
  </div>
</body>
</html>
