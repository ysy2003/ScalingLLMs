<html>
<body>
    <div class="slider">
        <img src="#" alt="Producer Application">
    </div>
    <div class="content-wrapper">
        <h1>Producer Application</h1>
        <p>Tell us a little about you and your experience. FAQ for more information.</p>
        <form>
            <input type="text" placeholder="First Name *">
            <input type="text" placeholder="Last Name *">
            <input type="email" placeholder="Email Address *">
            <textarea placeholder="Phone Number"></textarea>
            <label>Where Do You Live? *</label>
            <select>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
            <label>I am at least 18 Years of Age *</label>
            <input type="radio" name="age" value="Yes" checked>Yes
            <input type="radio" name="age" value="No">No
            <label>Do You Have a Production Company? *</label>
            <input type="checkbox" name="production_company" value="Yes">Yes
            <input type="checkbox" name="production_company" value="No">No
            <label>Tell Us More About You.*</label>
            <textarea placeholder="Preferred Genre *"></textarea>
            <label>Are You Confident You Can Create Full-Length Episodes (12-25 minutes) on a Low-Budget and Continue to Create Episodes if they are Renewed by Candivan?*</label>
            <input type="radio" name="confidence" value="Yes" checked>Yes
            <input type="radio" name="confidence" value="No">No
            <label>If Selected as a Winner, Would You be Able to Start Production by this May or June (2019)?*</label>
            <input type="radio" name="start_time" value="June">June
            <input type="radio" name="start_time" value="May">May
            <label>Names of Others Plan to Collaborate with (if Applicable)</label>
            <textarea placeholder="Names of Others Plan to Collaborate with (if Applicable)"></textarea>
            <label>Are you a member of the PGA? *</label>
            <input type="radio" name="member" value="Yes" checked>Yes
            <input type="radio" name="member" value="No">No
            <label>OPTIONAL: Those with large social networks are preferable. Feel free to list any large networks you are part of or your Twitter.</label>
            <textarea placeholder="Large Networks"></textarea>
            <label>How did you find out about us?</label>
            <select>
                <option value="Referral">Referral</option>
                <option value="Social Media">Social Media</option>
                <option value="Website">Website</option>
                <option value="Word of Mouth">Word of Mouth</option>
                <option value="Advertisement">Advertisement</option>
            </select>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
<style>
body {
    font-family: Arial, sans-serif;
}

.slider {
    height: 400px;
    background-color: blue;
    margin-bottom: 30px;
}

.content-wrapper {
    padding: 30px;
}

form {
    display: flex;
    justify-content: space-between;
}

input[type="text"], input[type="radio"] {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
}

textarea {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
}

button {
    background-color: #ff6361;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #f74c4c;
}
</style>
</html>
