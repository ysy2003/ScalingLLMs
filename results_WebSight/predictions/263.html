<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background-color: #fff;
    padding: 20px 0;
    text-align: center;
    border-bottom: 1px solid #e0e0e0;
}

.header h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
}

.header p {
    font-size: 1.2em;
    margin-bottom: 20px;
}

.content {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.left-column {
    width: 30%;
    background-color: #fff;
    padding: 20px;
}

.right-column {
    width: 65%;
    background-color: #fff;
    padding: 20px;
}

.footer {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 20px 0;
}
</style>
<body>
    <div class="header">
        <h1>I'm a header</h1>
        <div class="content">
            <div class="left-column">
                <h2>Navigation</h2>
                <p>Navigation links go here</p>
            </div>
            <div class="right-column">
                <h2>Get in touch</h2>
                <p>Contact information goes here</p>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="footer-content">
            <h2>Footer</h2>
            <p>Footer links go here</p>
        </div>
    </div>
</body>
</html>
