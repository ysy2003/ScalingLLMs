<html>

body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.left-column {
    width: 70%;
    padding: 20px;
}

.right-column {
    width: 30%;
    padding: 20px;
}

h1 {
    font-size: 40px;
    color: #333;
}

p {
    font-size: 18px;
    color: #666;
}

.post {
    margin-bottom: 20px;
}

.post-title {
    font-size: 24px;
    color: #333;
}

.post-content {
    font-size: 16px;
    color: #666;
}

.post-author {
    font-size: 14px;
    color: #999;
}

.post-date {
    font-size: 12px;
    color: #666;
}

.post-links {
    font-size: 16px;
    color: #999;
}

.post-image {
    width: 100%;
    height: 200px;
    background-color: #ccc;
    margin-bottom: 20px;
}
</style>

            </p>

                        <img src="posts_icon.png" alt="Posts Icon">
                    </span>
                </h2>
                <h2>
                    COMMUNITY
                    <span>
                        <img src="community_icon.png" alt="Community Icon">
                    </span>
                </h2>
                <h2>
                    TRADE
                    <span>
                        <img src="trade_icon.png" alt="Trade Icon">
                    </span>
                </h2>
            </div>
            <!-- Posts content -->
            <div class="post">
                <h3 class="post-title">Awesome Post Title</h3>
                <p class="post-content">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed auctor, magna a hendrerit eleifend, arcu augue hendrerit massa.
                </p>
                <p class="post-author">
                    - Post Author

                <p class="post-date">
                    - 04/04/2023
                </p>
                <img class="post-image" src="post_image.png" alt="Post Image">
            </div>
            <!-- More posts... -->
            <!-- More posts... -->
            <!-- More posts... -->
            <!-- More posts... -->
        </div>
        <div class="right-column">
            <!-- More content... -->
        </div>

</html>
