<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.navbar {
    background-color: #fff;
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
    padding: 10px 0;
    text-align: center;
}

.navbar a {
    color: #333;
    text-decoration: none;
    margin: 0 10px;
    display: inline-block;
    font-size: 18px;
}

.navbar a.active {
    color: #ff6347;
}

.content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.diy-projects {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    margin-top: 50px;
}

.diy-projects div {
    width: calc(50% - 20px);
    height: 200px;
    background-color: #ccc;
    margin-bottom: 20px;
}

.footer {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 10px 0;
}

.footer a {
    color: #1ff;
    text-decoration: none;
    margin: 0 10px;
}

.logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 20px;
    font-weight: bold;
    color: #333;
}
</style>
<body>
    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">Projects</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>
    <div class="content">
        <div class="diy-projects">
            <!-- Diy Projects will be displayed here -->
        </div>
    </div>
    <div class="footer">
        <div class="logo">
            <!-- Logo will be displayed here -->
            <p>CONTACT INFO</p>
        </div>
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
    </div>
    <div class="footer-links">
        <p>Copyright 2022</p>
        <a href="#">Blog</a>
        <a href="#">Construction Policy</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
    </div>
</body>
</html>
