<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #333;
}

.header {
    font-size: 2.5em;
    margin: 1em 0;
}

.content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.card {
    width: 80%;
    margin: 1em 0;
    padding: 1em;
    background-color: #f7f7f7;
    border: 1px solid #333;
    border-radius: 5px;
    box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.1);
}

.card img {
    width: 100%;
    height: auto;
}

.card span {
    display: block;
    text-align: center;
    font-size: 1.2em;
    color: #333;
}
</style>
<body>
    <div class="header">
        <h1>Welcome to AutoMotive</h1>
    </div>
    <div class="content">
        <div class="card">
            <img src="https://placeimg.com/640/480/any" alt="">
            <span>This is a car</span>
        </div>
        <div class="card">
            <img src="https://placeimg.com/640/480/any" alt="">
            <span>2019-01-01: This is a car</span>
        </div>
        <div class="card">
            <img src="https://placeimg.com/640/480/any" alt="">
            <span>2019-03-15: This is a car</span>
        </div>
        <div class="card">
            <img src="https://placeimg.com/640/480/any" alt="">
            <span>2019-08-15: This is a car</span>
        </div>
        <div class="card">
            <img src="https://placeimg.com/640/480/any" alt="">
            <span>6019451: This is a car</span>
        </div>
    </div>
</body>
</html>
