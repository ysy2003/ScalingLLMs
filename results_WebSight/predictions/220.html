<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.header {
    background-color: #f8f9fa;
    padding: 20px;
    text-align: center;
}

.logo {
    font-size: 3em;
    color: #333;
}

.content {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    text-align: left;
}

.content h1 {
    font-size: 2em;
    color: #333;
}

.content p {
    font-size: 1.2em;
    color: #6c757d;
}

.cta {
    background-color: #007bff;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    font-size: 1em;
    cursor: pointer;
    margin-top: 20px;
}
</style>
<body>
    <div class="header">
        <div class="logo">My Logo</div>
    </div>
    <div class="content">
        <h1>Welcome to My Website</h1>
        <p>This is a simple and clean website with a logo and a call-to-action button.</p>
        <button class="cta">Get Started</button>
    </div>
</body>
</html>
