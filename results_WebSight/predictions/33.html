<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: cyan;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background-color: #fff;
}

.logo {
    width: 100px;
    height: 50px;
    background-color: blue;
}

.nav a {
    margin-right: 10px;
    color: cyan;
    text-decoration: none;
    font-size: 18px;
}

.content {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.left-column, .right-column {
    width: 48%;
    padding: 20px;
}

.product {
    width: 100%;
    height: 200px;
    background-color: blue;
    margin-bottom: 20px;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background-color: #fff;
}

.social-media a {
    margin-right: 10px;
    color: cyan;
    text-decoration: none;
    font-size: 18px;
}

.cart {
    width: 100px;
    height: 50px;
    background-color: blue;
    color: cyan;
    text-align: center;
    line-height: 50px;
    font-size: 18px;
}
</style>
<body>
    <div class="header">
        <div class="logo"></div>
        <div class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Who We Are</a>
            <a href="#">Contact</a>
        </div>
    </div>
    <div class="content">
        <div class="left-column">
            <div class="product"></div>
            <div class="product"></div>
            <div class="product"></div>
        </div>
        <div class="right-column">
            <div class="product"></div>
            <div class="product"></div>
            <div class="product"></div>
        </div>
        <div class="footer">
            <div class="social-media">
                <a href="#">Facebook</a>
                <a href="#">Twitter</a>
                <a href="#">Instagram</a>
            </div>
            <div class="cart">
                <a href="#">Add to Cart</a>
            </div>
        </div>
    </div>
</body>
</html>
