<html>
<style>
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.left-column {
    width: 20%;
    background-color: #fff;
    padding: 20px;
}

.right-column {
    width: 80%;
    background-color: #fff;
    padding: 20px;
}

.product-image {
    width: 100%;
    height: 200px;
    background-color: #ccc;
    margin-bottom: 20px;
}

.product-image:nth-child(odd) {
    background-color: #eee;
}

.product-image:nth-child(even) {
    background-color: #00f;
}
</style>
<body>
    <div class="container">
        <div class="left-column">
            <div class="logo"></div>
            <div class="tagline">
                <p>Your favorite brand for all your beauty needs.</p>
            </div>
            <div class="product-images">
                <div class="product-image"></div>
                <div class="product-image"></div>
                <div class="product-image"></div>
                <div class="product-image"></div>
            </div>
        </div>
        <div class="right-column">
            <div class="product-images">
                <div class="product-image"></div>
                <div class="product-image"></div>
                <div class="product-image"></div>
                <div class="product-image"></div>
            </div>
        </div>
        <div class="content">
            <h1>Welcome to the Beauty Company</h1>
            <p>We are a company dedicated to providing the best beauty products for all your needs.</p>
            <h2>Our Products</h2>
            <p>Check out our wide range of products and choose the one that suits you best.</p>
        </div>
        <div class="footer">
            <div class="logo"></div>
            <div class="tagline">
                <p>A brand for all your beauty needs.</p>
            </div>
            <div class="product-images">
                <div class="product-image"></div>
                <div class="product-image"></div>
                <div class="product-image"></div>
                <div class="product-image"></div>
            </div>
        </div>
    </div>
</body>
</html>
