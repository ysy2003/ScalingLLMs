<html>
<style>
body {

}

.header {

}

            <a href="#">Contact</a>
        </div>
    </div>
    <div class="content">

            <img src="article1.jpg" alt="Article 1">

            <i class="fa fa-twitter"></i>
            <i class="fa fa-instagram"></i>
        </div>
