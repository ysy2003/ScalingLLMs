<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
}

.container {
    width: 90%;
    margin: auto;
    overflow: hidden;
}

.header {
    background: #333;
    color: white;
    padding-top: 30px;
    padding-bottom: 10px;
    text-align: center;
}

.header a {
    color: white;
    text-decoration: none;
    font-size: 20px;
    margin-top: 10px;
}

.header .title {
    font-size: 30px;
    color: #333;
}

.header .search-bar {
    background: #f4f4f4;
    padding: 10px;
    margin-top: 10px;
}

.header .search-bar input[type="text"] {
    width: 70%;
    padding: 10px;
    border: none;
    border-radius: 5px;
}

.header .search-bar button {
    background: #333;
    color: white;
    padding: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.content {
    margin-top: 20px;
    padding: 20px;
}

.content .question {
    color: #333;
    font-size: 20px;
    margin-bottom: 10px;
}

.content .answer {
    background: #f4f4f4;
    padding: 10px;
    margin-bottom: 10px;
}

.content .image {
    background: #333;
    width: 100%;
    height: 200px;
    margin-bottom: 10px;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Welcome to our website</h1>
            <div class="search-bar">
                <input type="text" placeholder="Search...">
                <button>Search</button>
            </div>
        </div>
        <div class="content">
            <p class="question">Question 1</p>
            <div class="answer">
                <div class="image">Image</div>
                <p>An expert answer</p>
            </div>
            <p class="question">Question 2</p>
            <div class="answer">
                <div class="image">Image</div>
                <p>An expert answer</p>
            </div>
            <p class="question">Question 3</p>
            <div class="answer">
                <div class="image">Image</div>
                <p>An expert answer</p>
            </div>
        </div>
    </div>
</body>
</html>
