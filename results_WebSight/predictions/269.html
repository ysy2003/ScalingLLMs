<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background-color: #f8f8f8;
    padding: 20px;
    text-align: center;
}

.header .logo {
    font-size: 2em;
    color: #fff;
}

.header .nav {
    margin-top: 10px;
}

.header .nav a {
    margin: 0 10px;
    color: #333;
    text-decoration: none;
    font-size: 1.2em;
}

.hero {
    background-color: #f8f8f8;
    padding: 50px 0;
    text-align: center;
}

.hero .hero-image {
    width: 100%;
    height: 300px;
    background-color: #eee;
}

.hero .hero-text {
    margin-top: 20px;
    font-size: 1.2em;
    color: #999;
}

.content {
    padding: 50px 0;
}

.content .product {
    width: 100%;
    display: flex;
    margin-bottom: 20px;
}

.content .product .product-image {
    width: 30%;
    height: 200px;
    background-color: #ddd;
}

.content .product .product-info {
    width: 70%;
    padding: 20px;
}

.footer {
    background-color: #f8f8f8;
    padding: 20px;
    text-align: center;
}

.footer .footer-links a {
    margin: 0 10px;
    color: #333;
    text-decoration: none;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <h1>Navbar</h1>
            </div>
            <div class="nav">
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">Blog</a>
                <a href="#">Contact</a>
            </div>
        </div>
        <div class="hero">
            <div class="hero-image">
                <div class="hero-text">
                    <p>The latest 3D product charts and navigation</p>
                </div>
            </div>
        </div>
        <div class="content">
            <div class="product">
                <div class="product-image">
                    <div style="width:100%;height:100%;background-color:blue;"></div>
                </div>
                <div class="product-info">
                    <h2>Product 1</h2>
                    <p>Navigate the latest 3D product charts and navigation</p>
                </div>
            </div>
            <!-- More products... -->
        </div>
        <div class="footer">
            <div class="footer-links">
                <a href="#">Blog</a>
                <a href="#">Facebook</a>
                <a href="#">Twitter</a>
                <a href="#">Instagram</a>
            </div>
        </div>
    </div>
</body>
</html>
