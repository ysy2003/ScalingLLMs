<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.navbar {
    background-color: #336699;
    color: #fff;
    padding: 10px;
}

.navbar a {
    color: #fff;
    text-decoration: none;
    margin-right: 10px;
}

.content {
    margin: 20px;
}

.login {
    width: 300px;
    margin: 0 auto;
    padding: 20px;
}

.login input[type="text"], .login input[type="password"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    box-sizing: border-box;
}

.login input[type="submit"] {
    background-color: #336699;
    color: #fff;
    padding: 10px;
    border: none;
    cursor: pointer;
}

.login input[type="submit"]:hover {
    background-color: #666;
}

.login::before {
    content: "";
    display: block;
    width: 100%;
    height: 200px;
    background-color: #666;
    position: absolute;
    top: -200px;
    left: 0;
    z-index: -1;
}

.login {
    position: relative;
}
</style>
<body>
    <div class="navbar">
        <a href="#">Facebook</a>
    </div>
    <div class="content">
        <div class="login">
            <form>
                <input type="text" placeholder="Log In">
                <input type="password" placeholder="Password">
                <input type="submit" value="Login">
            </form>
        </div>
        <div class="login">
            <form>
                <input type="text" placeholder="Sign Up">
                <input type="password" placeholder="Password">
                <input type="submit" value="Create Account">
            </form>
        </div>
    </div>
</body>
</html>
