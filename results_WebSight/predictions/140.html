<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background-color: #f8f8f8;
    padding: 20px;
    text-align: center;
}

.header h1 {
    font-size: 2.5em;
    color: #333;
}

.header p {
    font-size: 1.2em;
    color: #666;
}

.content {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

.left-column {
    width: 60%;
    padding: 20px;
}

.right-column {
    width: 30%;
    padding: 20px;
}

.product {
    margin-bottom: 20px;
}

.product img {
    width: 100%;
    height: auto;
}

.product h2 {
    font-size: 1.2em;
    color: #333;
}

.product p {
    font-size: 1em;
    color: #666;
}

.blog-post {
    margin-bottom: 20px;
}

.blog-post h2 {
    font-size: 1.2em;
    color: #333;
}

.blog-post p {
    font-size: 1em;
    color: #666;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <h1>Beauty and Fashion</h1>
            <p>Welcome to our website, where beauty meets fashion.</p>
        </div>
        <div class="content">
            <div class="left-column">
                <div class="product">
                    <h2>Product 1</h2>
                    <img src="product1.jpg" alt="Product 1">
                    <p>From the fabrics of nature, we've crafted this product. It's a perfect blend of blue and white.</p>
                </div>
                <!-- More products... -->
            </div>
            <div class="right-column">
                <div class="blog-post">
                    <h2>Blog Post 1</h2>
                    <p>Discover how to make your skin glow with our exclusive beauty products.</p>
                </div>
                <!-- More blog posts... -->
            </div>
        </div>
        <div class="footer">
            <!-- Footer content... -->
        </div>
    </div>
</body>
</html>
