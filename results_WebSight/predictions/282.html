<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f0f2f5;
    color: #333;
}

.header {
    background-color: #333;
    color: #f0f2f5;
    padding: 20px;
    text-align: center;
}

.header input[type="text"] {
    width: 300px;
    padding: 10px;
    border: none;
    border-radius: 5px;
}

.content {
    margin: 20px;
}

.content .product {
    width: 60%;
    margin: 10px auto;
    padding: 10px;
    background-color: #f0f2f5;
    border: 1px solid #333;
    border-radius: 5px;
}

.content .product img {
    width: 100%;
    height: 200px;
    background-color: blue;
}

.footer {
    background-color: #333;
    color: #f0f2f5;
    padding: 10px;
    text-align: center;
}

.footer a {
    color: #f0f2f5;
    text-decoration: none;
    margin: 0 10px;
}

.footer a:hover {
    color: #f0f2f5;
}
</style>
<body>
    <div class="header">
        <input type="text" placeholder="Search...">
    </div>
    <div class="content">
        <!-- Product content goes here -->
        <div class="product">
            <!-- Product image -->
            <h2>Product Title</h2>
            <p>A brief description of the product.</p>
            <img src="product.jpg">
            <h3>Reviews:</h3>
            <p>"This product is amazing!" - User Name</p>
            <h3>Pricing:</h3>
            <p>$99.99</p>
        </div>
        <!-- More products... -->
    </div>
    <div class="footer">
        <!-- Footer content goes here -->
        <a href="#">Blog</a>
        <a href="#">Social Media</a>
        <a href="#">Home</a>
    </div>
</body>
</html>
