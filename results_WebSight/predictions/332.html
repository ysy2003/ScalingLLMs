<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 80%;
    margin: auto;
}

.left-column {
    width: 30%;
    height: 100%;
    text-align: center;
}

.right-column {
    width: 70%;
    height: 100%;
    padding: 20px;
}

.title {
    font-size: 2em;
    color: #333;
}

.description {
    font-size: 1.2em;
    color: #666;
}

.map {
    width: 100%;
    height: 300px;
    background-color: #e6e6e6;
    margin: 20px 0;
}

.cta {
    width: 100%;
    height: 50px;
    background-color: #008CBA;
    color: white;
    border: none;
    cursor: pointer;
}

.image-placeholder {
    width: 100%;
    height: 200px;
    background-color: #000;
    margin: 20px 0;
}
</style>
<body>
    <div class="container">
        <div class="left-column">
            <h1 class="title">Streamline Farm</h1>
            <p class="description">At Streamline Farm, we believe in the power of a simple and clean design. Our website is designed to provide a seamless user experience, with a focus on simplicity and clarity.</p>
            <button class="cta">Get in Touch</button>
        </div>
        <div class="right-column">
            <div class="location-info">
                <p>Downtown Dairy</p>
                <p>123 Main St</p>
                <p>Anytown, USA 12345</p>
            </div>
            <div class="map">
                <div class="image-placeholder"></div>
            </div>
            <div class="contact-info">
                <p>Phone: (123) 456-7890</p>
                <p>Email: info@streamlinefarm.com</p>
            </div>
        </div>
    </div>
</body>
</html>
