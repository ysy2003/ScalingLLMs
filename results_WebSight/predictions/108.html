<html>
<style>
body {
    font-size: 1.2em;
    color: #333;
    background-color: #fff;

    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.header {
    width: 100%;
    height: 10%;
    background-color: #f80;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav {
    width: 100%;
    height: 10%;
    background-color: #333;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav ul {
    list-style-type: none;
    display: flex;
    justify-content: space-around;
    width: 50%;
}

.nav ul li a {
    color: #fff;
    text-decoration: none;
}

.content {
    width: 100%;
    height: 80%;
    background-color: #fff;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
}

.footer {
    width: 100%;
    height: 10%;
    background-color: #f80;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.footer a {
    color: #fff;
    text-decoration: none;
}

.author {
    color: #333;
}

.story {
    color: #333;
}

.title {
    color: #333;
}

.date {
    color: #333;
}
</style>
<body>
    <div class="header">
        <h1>Breaking News</h1>
    </div>
    <div class="nav">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Stories</a></li>
            <li><a href="#">Tags</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </div>
    <div class="content">
        <div class="story">
            <p>I am always looking for the best stories, and I've found a lot of them. Check out my latest story, it's about something really interesting. Keep up with the latest news and updates.</p>
        </div>
        <!-- More stories here -->
    </div>
    <div class="footer">
        <ul>
            <li><a href="#">Facebook</a></li>
            <li><a href="#">Twitter</a></li>
            <li><a href="#">Instagram</a></li>
        </ul>
    </div>

</html>
