<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f0f0f0;
}

.header {
    width: 100%;
    height: 100px;
    background-color: #ff8080;
    display: flex;
    justify-content: center;
    align-items: center;
}

.nav {
    width: 100%;
    height: 50px;
    background-color: #808080;
    display: flex;
    justify-content: center;
    align-items: center;
}

.content {
    width: 100%;
    height: calc(100vh - 150px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.footer {
    width: 100%;
    height: 50px;
    background-color: #808080;
    display: flex;
    justify-content: center;
    align-items: center;
}

.image {
    width: 250px;
    height: 200px;
    background-color: #ff0000;
    margin: 20px;
}
</style>
<body>
    <div class="header"></div>
    <div class="nav"></div>
    <div class="content"></div>
    <div class="footer"></div>
</body>
</html>
