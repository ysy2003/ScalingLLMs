<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.left-column {
    width: 30%;
    padding: 10px;
    background-color: #fff;
    border-radius: 5px;
}

.right-column {
    width: 65%;
    padding: 10px;
    background-color: #fff;
    border-radius: 5px;
}

.logo {
    width: 150px;
    height: 100px;
    background-color: #f00;
    margin: 5px auto;
}

.product-image {
    width: 100%;
    height: 200px;
    background-color: #00f;
    margin: 20px 0;
}

.product-description {
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 20px;
}

.cta-form {
    display: flex;
    flex-direction: column;
    padding: 20px;
}

.cta-form label {
    font-size: 18px;
    margin-bottom: 10px;
}

.cta-form input, .cta-form textarea {
    margin-bottom: 20px;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 16px;
}

.cta-form button {
    padding: 10px;
    background-color: #00f;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}
</style>
<body>
    <div class="container">
        <div class="left-column">
            <div class="logo"></div>
            <p class="product-image"></p>
            <p class="product-description">
                With our help, the world of technology everywhere. 
                We are here to enhance your health and lives. 
                Come and join us in our journey to a better future.
            </p>
            <form class="cta-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>
                <button type="submit">Submit</button>
            </form>
        </div>
        <div class="right-column">
            <!-- Placeholder for right column content -->
            <p class="placeholder">
                Join our community today and make a difference. 
                We are here to help you.
            </p>
            <form class="cta-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
