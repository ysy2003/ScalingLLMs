<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f0f2f5;
    color: #333;
}

.header {
    background-color: #3f51b5;
    color: #fff;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header__logo {
    width: 100px;
    height: 50px;
    background-color: #fff;
}

.header__title {
    font-size: 2em;
}

.header__nav {
    display: flex;
    list-style: none;
}

.header__nav-item {
    margin-right: 10px;
}

.header__nav-item-link {
    color: #fff;
    text-decoration: none;
}

.main {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.main__content {
    width: 70%;
}

.main__content-item {
    display: flex;
    margin-bottom: 20px;
}

.main__content-item-image {
    width: 100px;
    height: 100px;
    background-color: #fff;
    margin-right: 20px;
}

.main__content-item-text {
    width: calc(100% - 120px);
}

.footer {
    background-color: #3f51b5;
    color: #fff;
    padding: 10px;
    text-align: center;
}

.footer__title {
    font-size: 1.2em;
}

.footer__content {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

.footer__content-item {
    width: 30%;
}

.footer__content-item-link {
    color: #fff;
    text-decoration: none;
}
</style>
<body>
    <header class="header">
        <div class="header__logo"></div>
        <h1 class="header__title">Company Name</h1>
        <nav class="header__nav">
            <a href="#" class="header__nav-item">About</a>
            <a href="#" class="header__nav-item">Services</a>
            <a href="#" class="header__nav-item">Contact</a>
        </nav>
    </header>
    <main class="main">
        <div class="main__content">
            <div class="main__content-item">
                <div class="main__content-item-image"></div>
                <p class="main__content-item-text">1</p>
            </div>
            <div class="main__content-item">
                <div class="main__content-item-image"></div>
                <p class="main__content-item-text">2</p>
            </div>
            <div class="main__content-item">
                <div class="main__content-item-image"></div>
                <p class="main__content-item-text">3</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <h2 class="footer__title">Related Activities</h2>
        <div class="footer__content">
            <div class="footer__content-item">
                <a href="#" class="footer__content-item-link">Alexa Skills</a>
            </div>
            <div class="footer__content-item">
                <a href="#" class="footer__content-item-link">Shortcuts</a>
            </div>
            <div class="footer__content-item">
                <a href="#" class="footer__content-item-link">App</a>
            </div>
        </div>
    </footer>
</body>
</html>
