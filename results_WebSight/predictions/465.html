<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background-color: #c00;
    color: #fff;
    padding: 10px 0;
    text-align: center;
}

.content {
    display: flex;
    justify-content: space-between;
}

.product-list {
    flex: 1;
    margin-right: 20px;
}

.product-list img {
    width: 100%;
    height: auto;
    display: block;
    margin-bottom: 10px;
}

.product-list p {
    font-size: 12px;
    line-height: 1.5;
}

.sidebar {
    width: 30%;
    background-color: #eee;
    padding: 10px;
}

.sidebar input[type="text"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
}

.sidebar h2 {
    font-size: 20px;
    margin-bottom: 10px;
}

.sidebar p {
    font-size: 12px;
    line-height: 1.5;
}

.footer {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 10px 0;
    position: fixed;
    width: 100%;
    bottom: 0;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <!-- Header content -->
            <div class="logo">
                <!-- Logo -->
            </div>
            <div class="menu">
                <!-- Menu items -->
            </div>
        </div>
        <div class="content">
            <div class="product-list">
                <!-- Product list -->
                <div class="product">
                    <!-- Product item -->
                    <img src="https://via.placeholder.com/350x150" alt="Product image">
                    <p>Product description</p>
                </div>
                <!-- More product items -->
            </div>
            <div class="sidebar">
                <!-- Sidebar content -->
                <input type="text" placeholder="Search">
                <h2>Filter by:</h2>
                <p>Filter options</p>
            </div>
            <div class="footer">
                <!-- Footer content -->
                <p>Footer content</p>
            </div>
        </div>
    </div>
</body>
</html>
