<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #fff;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 800px;
    height: 600px;
    background: #fff;
}

.logo {
    width: 100px;
    height: 100px;
    background: #f00;
}

.content {
    display: flex;
    justify-content: space-between;
    width: 100%;
    height: 100%;
}

.left-column {
    width: 50%;
    height: 100%;
    background: #f0f0f0;
}

.right-column {
    width: 50%;
    height: 100%;
    background: #fff;
}
</style>
<body>
    <div class="container">
        <div class="logo"></div>
        <div class="content">
            <div class="left-column"></div>
            <div class="right-column"></div>
        </div>
    </div>
</body>
</html>
