<html>
<style>
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.left-column {
    width: 20%;
    background-color: #f0f0f0;
    padding: 20px;
}

.right-column {
    width: 80%;
    background-color: #fff;
    padding: 20px;
}

.product-image {
    height: 200px;
    background-color: blue;
    margin-bottom: 20px;
}

.product-name {
    color: #333;
    font-size: 20px;
    margin-bottom: 10px;
}

.product-description {
    color: #666;
    font-size: 14px;
    margin-bottom: 20px;
}

.filter-options {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.filter-options label {
    color: #333;
    font-size: 14px;
}

.filter-options select {
    width: 100%;
    padding: 10px;
    margin-right: 10px;
}

.product-reviews {
    display: flex;
    flex-direction: column;
}

.review {
    background-color: #f0f0f0;
    padding: 20px;
    margin-bottom: 20px;
}

.review-text {
    color: #333;
    font-size: 16px;
}
</style>
<body>
    <div class="container">
        <div class="left-column">
            <div class="product-image"></div>
            <div class="product-name"></div>
            <div class="product-description"></div>
        </div>
        <div class="right-column">
            <div class="filter-options">
                <label>Filter by:</label>
                <select>
                    <option value="price">Price</option>
                    <option value="rating">Rating</option>
                    <option value="availability">Availability</option>
                </select>
            </div>
            <div class="product-reviews">
                <div class="review">
                    <div class="review-text"></div>
                </div>
                <div class="review">
                    <div class="review-text"></div>
                </div>
                <div class="review">
                    <div class="review-text"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="footer-links">
            <a href="#"></a>
            <a href="#"></a>
            <a href="#"></a>
        </div>
        <div class="footer-logo"></div>
        <div class="footer-contact">
            <p></p>
        </div>
    </div>
</body>
</html>
