<html>
<style>
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

header {
    height: 100vh;
    background-color: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.logo {
    font-size: 3em;
    margin-bottom: 1em;
}

nav ul {
    list-style: none;
    display: flex;
    justify-content: space-around;
    width: 100%;
}

nav ul li a {
    color: #333;
    text-decoration: none;
    font-size: 1.2em;
    padding: 1em;
    transition: all 0.3s ease;
}

nav ul li a:hover {
    color: #fff;
    background-color: #333;
}

section {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 5em;
    text-align: center;
    color: #333;
}

.product {
    width: 50%;
    height: 50%;
    background-color: #00f;
    margin: 1em;
    transition: all 0.3s ease;
}

.product:hover {
    transform: scale(1.1);
}

footer {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 2em;
}

.social-icons a {
    color: #fff;
    margin: 0 1em;
    font-size: 2em;
    transition: all 0.3s ease;
}

.social-icons a:hover {
    color: #00f;
}

.contact-form {
    display: flex;
    flex-direction: column;
    width: 50%;
    margin: 0 auto;
}

.contact-form input,
.contact-form textarea {
    margin-bottom: 1em;
    padding: 0.5em;
    font-size: 1em;
}

.contact-form button {
    padding: 0.5em;
    background-color: #00f;
    color: #fff;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
}

.contact-form button:hover {
    background-color: #333;
}
</style>
<body>
    <header>
        <div class="logo">Welcome to Our Website</div>
        <nav>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">RES</a></li>
                <li><a href="#">3D CHANG</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="intro">
            <h1>WATERMARK</h1>
            <p>Welcome to our website. We are a team of passionate 3D animators and designers.</p>
        </section>
        <section class="products">
            <h2>OUR PRODUCTS</h2>
            <div class="product"></div>
            <div class="product"></div>
            <div class="product"></div>
        </section>
        <section class="contact">
            <h2>CONTACT</h2>
            <p>Get in touch with us for any inquiries or questions.</p>
            <div class="contact-form">
                <input type="text" placeholder="Name">
                <input type="email" placeholder="Email">
                <textarea placeholder="Message"></textarea>
                <button>SEND</button>
            </div>
        </section>
    </main>
    <footer>
        <div class="social-icons">
            <a href="#">
                <i class="fab fa-facebook"></i>
            </a>
            <a href="#">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="#">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    <footer>
    <p>CONTACT INFO &copy; 2022 TECNOLOGY COMPANY</p>
</body>
</html>
