<html>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    color: #333;
}

header {
    background-color: #f5f5f5;
    padding: 20px;
    text-align: center;
}

nav {
    margin-top: 20px;
}

nav a {
    margin: 0 10px;
    color: #333;
    text-decoration: none;
}

main {
    margin: 20px auto;
    width: 80%;
}

h1, h2 {
    color: #333;
    text-align: center;
}

p {
    line-height: 1.6;
    margin-bottom: 20px;
}

.question {
    border: 1px solid #333;
    padding: 10px;
    margin-bottom: 20px;
}

.question h3 {
    color: #333;
    margin-bottom: 10px;
}

.question p {
    color: #666;
}

.product-reviews {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.product-reviews div {
    width: 30%;
    height: 200px;
    background-color: #666;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.faq {
    margin-bottom: 20px;
}

.faq h2 {
    color: #333;
    margin-bottom: 20px;
}

.faq p {
    color: #666;
}

footer {
    background-color: #f5f5f5;
    padding: 20px;
    text-align: center;
}

footer a {
    margin: 0 10px;
    color: #333;
    text-decoration: none;
}
</style>
<body>
    <header>
        <nav>
            <!-- Logo and navigation links -->
        </nav>
        <h1>Welcome to My Tech Website</h1>
        <p>Get the ultimate tech performance with our products</p>
    </header>
    <main>
        <section class="product-reviews">
            <!-- Product reviews -->
        </section>
        <section class="faq">
            <h2>Frequently Asked Questions (FAQ)</h2>
            <!-- FAQ content -->
        </section>
    </main>
    <footer>
        <!-- Footer content -->
    </footer>
</body>
</html>
