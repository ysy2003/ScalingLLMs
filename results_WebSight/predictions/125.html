<html>
<style>
body {
    margin: 0;
    padding: 0;
    background-color: #f7f7f7;
    font-size: 16px;
}

.header {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background-color: #333;
    color: #fff;
    font-size: 2em;
    text-transform: uppercase;
}

.header__logo {
    font-size: 1.5em;
    color: #fff;
}

.header__nav {
    display: flex;
    justify-content: space-around;
    width: 30%;
}

.header__nav-item {
    color: #fff;
    text-decoration: none;
    font-size: 1.2em;
}

.main {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 1.2em;
}

.main__section {
    width: 50%;
    margin: 1em 0;
    text-align: center;
}

.main__section-title {
    font-size: 1.5em;
    color: #333;
}

.main__section-content {
    width: 100%;
    height: 20em;
    background-color: #ccc;
    margin: 1em 0;
}

.footer {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background-color: #444;
    color: #fff;
    font-size: 1em;
}

.footer__logo {
    font-size: 1.2em;
}

.footer__nav {
    display: flex;
    justify-content: space-around;
    width: 30%;
}

.footer__nav-item {
    color: #fff;
    text-decoration: none;
}
</style>
<body>
    <header class="header">
        <div class="header__logo">Gaming Lobby</div>
        <nav class="header__nav">
            <a href="#" class="header__nav-item">Home</a>
            <a href="#" class="header__nav-item">Gallery</a>
            <a href="#" class="header__nav-item">About</a>
            <a href="#" class="header__nav-item">Contact</a>
        </nav>
    </header>
    <main class="main">
        <section class="main__section">
            <h2 class="main__section-title">Welcome to our gaming lobby</h2>
            <div class="main__section-content" style="background-color: #00f;"></div>
        </section>
        <!-- More sections here -->
    </main>
    <footer class="footer">
        <div class="footer__logo">Powered by Glicko</div>
        <nav class="footer__nav">
            <a href="#" class="footer__nav-item">Privacy</a>
            <a href="#" class="footer__nav-item">Terms</a>
            <a href="#" class="footer__nav-item">Contact</a>
        </nav>
    </footer>
</body>
</html>
