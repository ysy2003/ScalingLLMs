<html>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    color: #333;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: #e6f2f5;
    position: fixed;
    width: 100%;
    top: 0;
    left: 0;
}

header img {
    height: 50px;
}

nav ul {
    display: flex;
    list-style: none;
}

nav ul li {
    margin: 0 10px;
}

nav ul li a {
    text-decoration: none;
    color: #333;
}

.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: url('hero-image.jpg') no-repeat center center;
    background-size: cover;
}

.hero h1 {
    color: #fff;
    font-size: 3em;
}

.hero p {
    color: #fff;
    font-size: 1.5em;
}

.cta {
    background: #fff;
    color: #333;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    font-size: 1em;
    cursor: pointer;
}

.content {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    padding: 20px;
}

.content div {
    width: 100%;
    padding: 20px;
    margin: 10px;
    background: #f5f5f5;
    border: 1px solid #333;
    border-radius: 5px;
    text-align: center;
}

.content div h2 {
    color: #333;
    font-size: 1.5em;
}

.content div p {
    color: #333;
    font-size: 1em;
}
</style>
<body>
    <header>
        <img src="logo.png" alt="Company Logo">
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <form>
            <input type="text" placeholder="Search...">
        </form>
    </header>
    <section class="hero">
        <h1>Welcome to Northern Lands</h1>
        <p>Discover the beauty of the North Pole.</p>
        <button class="cta">Book Now</button>
    </section>
    <section class="content">
        <!-- Replace with actual content -->
    </section>
    <footer>
        <p>© 2022 Northern Lands. All rights reserved.</p>
    </footer>
</body>
</html>
