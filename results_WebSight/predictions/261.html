<html>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    color: #333;
    background-color: #f4f4f4;
}

.container {
    max-width: 1200px;
    margin: auto;
    overflow: auto;
    padding: 0 20px;
}

.header {
    background: #d3d3d3;
    padding: 20px;
    text-align: center;
}

.header img {
    width: 100%;
    height: auto;
}

.row {
    display: flex;
    flex-wrap: wrap;
}

.column {
    flex: 25%;
    max-width: 25%;
    padding: 0 4px;
}

.column img {
    margin-top: 8px;
    vertical-align: top;
    width: 100%;
}

.footer {
    background: #d3d3d3;
    text-align: center;
    padding: 10px;
}

.footer a {
    color: #333;
    text-decoration: none;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <img src="https://via.placeholder.com/150" alt="Logo">
            <h1>Welcome to our website</h1>
        </div>
        <div class="row">
            <div class="column">
                <img src="https://via.placeholder.com/150" alt="Image 1">
                <h2>Products</h2>
                <p>Our products are the best in the market. You can find everything you need.</p>
            </div>
            <div class="column">
                <img src="https://via.placeholder.com/150" alt="Image 2">
                <h2>Blog</h2>
                <p>Read our latest blog posts.</p>
            </div>
            <div class="column">
                <img src="https://via.placeholder.com/150" alt="Image 3">
                <h2>Contact Us</h2>
                <p>Get in touch with us today.</p>
            </div>
        </div>
        <div class="row">
            <div class="column">
                <img src="https://via.placeholder.com/150" alt="Image 4">
                <h2>Your Title</h2>
                <p>Type your title here</p>
            </div>
            <div class="column">
                <img src="https://via.placeholder.com/150" alt="Image 5">
                <h2>Your Content</h2>
                <p>Write your content here</p>
            </div>
        </div>
        <div class="footer">
            <p>© 2022-Your Website</p>
        </div>
    </div>
</body>
</html>
