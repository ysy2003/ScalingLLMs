<html>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    color: #333;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background-color: #fff;
}

.logo {
    width: 100px;
    height: 50px;
    background-color: #f00;
}

nav a {
    margin-right: 10px;
    color: #999;
    text-decoration: none;
    font-size: 18px;
}

main {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

footer {
    background-color: #fff;
    padding: 10px 20px;
    text-align: center;
}

footer a {
    margin-right: 10px;
    color: #999;
    text-decoration: none;
}

/* Center the content */
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

/* Make the website look good on all screen sizes */
@media screen and (max-width: 600px) {
    header, main, footer {
        flex-direction: column;
    }
}
</style>
<body>
    <header>
        <div class="logo"></div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Collections</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <div class="social-icons">
            <a href="#"><i class="fa fa-facebook"></i></a>
            <a href="#"><i class="fa fa-twitter"></i></a>
            <a href="#"><i class="fa fa-instagram"></i></a>
        </div>
    </header>
    <main>
        <section>
            <h1>Welcome to our Fashion Company</h1>
            <p>We are a fashion company that designs and sells high-quality clothing.</p>
        </section>
        <section>
            <h2>FAQ</h2>
            <p>Here are some frequently asked questions.</p>
        </section>
        <section>
            <h3>WHAT DO WE DO</h3>
            <p>We design, produce and sell high-quality clothing.</p>
        </section>
    </main>
    <footer>
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
    </footer>
</body>
</html>
