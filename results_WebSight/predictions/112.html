<html>
<style>
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.left-column {
    width: 30%;

}

.right-column {

}

}

}

.article-list {

}

.article-list li {

}

.article-list a {
    text-decoration: none;
    color: #000;
}

.article-list a:hover {

}

.social-media-icons {
    display: flex;
    justify-content: space-between;
}

.social-media-icons a {
    width: 30%;
    text-align: center;
}

.social-media-icons a img {
    width: 100%;
    height: auto;
}
</style>
