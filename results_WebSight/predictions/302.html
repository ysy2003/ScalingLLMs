<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.header {
    background-image: url('header-image.jpg');
    background-size: cover;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

.header h1 {
    font-size: 3em;
    margin-bottom: 1em;
}

.header h2 {
    font-size: 1.5em;
    margin-bottom: 2em;
}

.header p {
    font-size: 1.2em;
    margin-bottom: 2em;
}

.login-form {
    background-color: white;
    padding: 1em;
    border-radius: 1em;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.login-form h3 {
    font-size: 1.2em;
    margin-bottom: 1em;
}

.login-form input {
    width: 100%;
    padding: 0.5em;
    margin-bottom: 1em;
}

.login-form button {
    padding: 0.5em 1em;
    background-color: #77a2b8;
    color: white;
    border: none;
    border-radius: 0.2em;
    cursor: pointer;
}

.social-media {
    display: flex;
    justify-content: space-around;
    margin-top: 2em;
}

.social-media a {
    padding: 1em;
    border: 1px solid #333;
    border-radius: 0.2em;
    color: #333;
    text-decoration: none;
    font-size: 1.2em;
}

.footer {
    background-color: white;
    padding: 1em;
    text-align: center;
    color: #333;
}
</style>
<body>
    <div class="header">
        <h1>Welcome to FishyOnline</h1>
        <h2>COMING SOON</h2>
        <p>Experience the thrill of online gaming with us</p>
        <div class="login-form">
            <h3>ENTER YOUR PLAYER INFO</h3>
            <input type="text" placeholder="Enter your name">
            <input type="email" placeholder="Email">
            <button>Create Account</button>
        </div>
    </div>
    <div class="content">
        <div class="social-media">
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
            <a href="#">Instagram</a>
        </div>
        <div class="footer">
            <p>This website will be powered by Shopify</p>
        </div>
    </div>
</body>
</html>
