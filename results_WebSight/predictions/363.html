<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.header {
    background-color: #f8f8f8;
    padding: 20px;
    text-align: center;
}

.header h1 {
    font-size: 2.5em;
    color: #333;
}

.header p {
    font-size: 1.2em;
    color: #666;
}

.header input[type="text"] {
    width: 70%;
    padding: 10px;
    font-size: 1em;
    border: none;
    border-radius: 5px;
}

.header button {
    padding: 10px;
    font-size: 1em;
    border: none;
    background-color: #999;
    color: #fff;
    border-radius: 5px;
}

.content {
    margin: 20px;
    display: flex;
    justify-content: space-around;
}

.content div {
    width: 30%;
    padding: 20px;
    text-align: center;
    border: 1px solid #333;
    border-radius: 5px;
}

.content img {
    width: 100%;
    height: auto;
}
</style>
<body>
    <div class="header">
        <h1>Dating Website</h1>
        <input type="text" placeholder="Search for a date">
        <button>Find</button>
    </div>
    <div class="content">
        <div class="left-column">
            <h2>SDating Construction</h2>
            <p>SDating Construction is a leading construction company in the state of Florida. We specialize in residential and commercial construction.</p>
            <div class="image" style="background-color: #f00;">
                <p>Image</p>
            </div>
        </div>
        <div class="right-column">
            <h2>Our Projects</h2>
            <p>Check out some of our recent projects.</p>
            <div class="image" style="background-color: #0f0;">
                <p>Image</p>
            </div>
        </div>
    </div>
</body>
</html>
