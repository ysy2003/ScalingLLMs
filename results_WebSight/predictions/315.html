<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.header {
    background-image: linear-gradient(to bottom, #f00, #ff0);
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.header__logo {
    width: 100px;
    height: 100px;
    background-color: #f00;
}

.header__nav {
    display: flex;
    justify-content: space-around;
    width: 100%;
}

.header__nav-item {
    font-size: 20px;
    color: #000;
}

.main {
    display: flex;
    justify-content: space-around;
    margin: 50px 0;
}

.main__section {
    width: 30%;
    height: 300px;
    background-color: #f0f;
}

.footer {
    background-image: linear-gradient(to bottom, #f00, #ff0);
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.footer__logo {
    width: 100px;
    height: 100px;
    background-color: #f00;
}
</style>
<body>
    <header class="header">
        <div class="header__logo"></div>
        <nav class="header__nav">
            <div class="header__nav-item"></div>
            <div class="header__nav-item"></div>
            <div class="header__nav-item"></div>
        </nav>
    </header>
    <main class="main">
        <section class="main__section"></div>
        <section class="main__section"></div>
        <section class="main__section"></div>
    </main>
    <footer class="footer">
        <div class="footer__logo"></div>
        <nav class="footer__nav">
            <div class="footer__nav-item"></div>
            <div class="footer__nav-item"></div>
            <div class="footer__nav-item"></div>
        </nav>
    </footer>
</body>
</html>
