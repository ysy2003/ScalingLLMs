<html>
<style>
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 50px;
}

.left-column {
    width: 30%;
    background-color: #f0f0f0;
    padding: 20px;
}

.right-column {
    width: 60%;
    background-color: #fff;
    padding: 20px;
}

.category {
    font-size: 2em;
    color: #333;
    margin-bottom: 20px;
}

.product {
    font-size: 1.5em;
    color: #666;
    margin-bottom: 10px;
}

.product-image {
    width: 100%;
    height: 300px;
    background-color: #ccc;
    margin-bottom: 20px;
}

.product-description {
    font-size: 1em;
    color: #999;
}
</style>
<body>
    <div class="container">
        <div class="left-column">
            <div class="category">
                <!-- Category filters -->
                <div class="filter"></div>
                <div class="filter"></div>
                <div class="filter"></div>
            </div>
            <div class="product-list">
                <!-- Product listings -->
                <div class="product"></div>
                <div class="product"></div>
                <div class="product"></div>
            </div>
        </div>
        <div class="right-column">
            <div class="product-image"></div>
            <div class="product-description">
                <!-- Product descriptions -->
                <p>This is a beautiful and unique product that will make your home look like a work of art.</p>
                <p>This product is made with the finest materials and craftsmanship.</p>
                <p>This product is a must-buy for anyone who appreciates quality and beauty.</p>
            </div>
        </div>
    </div>
</body>
</html>
