<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
    color: #333;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background-color: #333;
    color: #fff;
}

.header__logo {
    width: 100px;
    height: 50px;
    background-color: #00f;
}

.header__nav a {
    margin-left: 20px;
    color: #fff;
    text-decoration: none;
}

.header__search {
    display: flex;
    align-items: center;
}

.header__search-input {
    margin-right: 10px;
}

.header__search-button {
    background-color: #fff;
    color: #333;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
}

.main__content {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.main__left-column {
    width: 50%;
}

.main__right-column {
    width: 50%;
}

.main__product-image {
    width: 100%;
    height: 200px;
    background-color: #00f;
    margin-bottom: 10px;
}

.main__product-description {
    color: #666;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background-color: #333;
    color: #fff;
}

.footer__logo {
    width: 100px;
    height: 50px;
    background-color: #00f;
}

.footer__nav a {
    margin-left: 20px;
    color: #fff;
    text-decoration: none;
}

.footer__search {
    display: flex;
    align-items: center;
}

.footer__search-input {
    margin-right: 10px;
}

.footer__search-button {
    background-color: #fff;
    color: #333;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
}
</style>
<body>
    <header class="header">
        <div class="header__logo"></div>
        <nav class="header__nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <form class="header__search">
            <input type="text" class="header__search-input" placeholder="Search">
            <button class="header__search-button">Search</button>
        </form>
    </header>
    <main class="main">
        <section class="main__content">
            <div class="main__left-column">
                <div class="main__product-image"></div>
                <p class="main__product-description">This is a paragraph about the product. It contains information about the product and its features.</p>
            </div>
            <div class="main__right-column">
                <div class="main__product-image"></div>
                <p class="main__product-description">This is a paragraph about the product. It contains information about the product and its features.</p>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="footer__logo"></div>
        <nav class="footer__nav">
            <a href="#">Links</a>
        </nav>
        <form class="footer__search">
            <input type="text" class="footer__search-input" placeholder="Search">
            <button class="footer__search-button">Search</button>
        </form>
    </footer>
    <div class="footer__social-media">
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
    </div>
</body>
</html>
