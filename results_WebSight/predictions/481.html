<html>
<style>
body {

    margin: 0;
    padding: 0;
    background-color: #f7f7f7;
    color: #333;
}

.header {
    background-color: #333;
    color: #f7f7f7;
    padding: 20px;
    text-align: center;
}

.header__logo {
    font-size: 2em;
}

.header__search {
    background-color: #f0f0f0;
    color: #333;
    padding: 10px;
    text-align: right;
}

.header__search-bar {
    width: 200px;
    padding: 10px;
}

.content {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.content__left, .content__right {
    width: 48%;
}

.content__left {
    background-color: #f0f0f0;
    color: #333;
}

.content__right {

    color: #333;
}

.footer {

    padding: 20px;
    text-align: center;
}

.footer__logo {
    font-size: 1.5em;
}

.footer__links {
    background-color: #f0f0f0;
    color: #333;
    padding: 10px;
}

.footer__links-item {
    margin: 10px 0;
}

.footer__links-item a {
    color: #333;
    text-decoration: none;
}

.footer__links-item a:hover {
    color: #f7f7f7;
}

.post {
    margin: 20px 0;
    padding: 20px;
    border: 1px solid #333;
}

.post__title {
    font-size: 1.5em;
}

.post__content {
    font-size: 1em;
}

.post__image {
    width: 100%;
    height: 200px;
    background-color: #333;
}
</style>

        </div>

    <footer class="footer">
        <div class="footer__logo">Powered by Sportsland</div>
        <div class="footer__links">
            <div class="footer__links-item">
                <a href="#">Popular Posts</a>
            </div>
            <div class="footer__links-item">
                <a href="#">Some Links</a>
            </div>
            <div class="footer__links-item">
                <a href="#">Social Media</a>
            </div>
        </div>

    <div class="post">
