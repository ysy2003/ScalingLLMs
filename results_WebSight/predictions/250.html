<html>
<style>
body {
    font-family: Arial, sans-serif;

    padding: 0;

    flex-direction: column;
    align-items: center;
    justify-content: center;

}

    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 1em;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.content button:hover {
    background-color: #ff0000;
}
