<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-container {
    background-color: #f8f8f8;
    padding: 20px;
    text-align: center;
    width: 300px;
    margin: auto;
    border-radius: 10px;
}

.login-container h1 {
    font-size: 2em;
    margin-bottom: 20px;
}

.login-container button {
    display: block;
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    background-color: #c07833;
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 1em;
}

.login-container button:hover {
    background-color: #b35916;
}

.login-container button:active {
    background-color: #8c4f00;
}

.login-container button:focus {
    background-color: #8c4f00;
}

.login-container button:target {
    background-color: #8c4f00;
}

.login-container::before {
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: #333;
    border-radius: 10px;
    z-index: -1;
}
</style>
<body>
    <div class="login-container">
        <h1>TechSolutions</h1>
        <button>Login</button>
        <button>Sign Up</button>
        <button>Forgot Password</button>
    </div>
</body>
</html>
