<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background: #fff;
    padding: 20px;
    text-align: center;
}

.header img {
    width: 100px;
    height: 100px;
    background: #008000;
    display: inline-block;
    vertical-align: middle;
    margin-right: 20px;
}

.header h1 {
    display: inline-block;
    font-size: 24px;
    color: #fff;
}

.header p {
    display: inline-block;
    font-size: 18px;
    color: #fff;
}

.header button {
    display: inline-block;
    background: #fff;
    color: #008000;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    font-size: 18px;
}

.content {
    margin-top: 20px;
    font-size: 18px;
}

.content img {
    width: 100%;
    height: 200px;
    background: #008000;
    margin-bottom: 20px;
}

.content p {
    font-size: 16px;
    line-height: 1.5;
}

.footer {
    background: #fff;
    padding: 20px;
    text-align: center;
}

.footer a {
    color: #008000;
    text-decoration: none;
    margin: 0 10px;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <img src="blue_rectangle.png" alt="">
            <h1>pythwebsite</h1>
            <p>Welcome to our website</p>
            <button>Download Now</button>
        </div>
        <div class="content">
            <img src="green_rectangle.png" alt="">
            <p>Our website is a simple and clean design with a centered logo and a call-to-action button. The button links to a download page where users can download our software.</p>
        </div>
        <div class="footer">
            <a href="#">Guest</a>
            <a href="#">Explore</a>
            <a href="#">Support</a>
            <a href="#">Blog</a>
            <a href="#">Contact</a>
        </div>
    </div>
</body>
</html>
