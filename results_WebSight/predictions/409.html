<html>
<style>
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.left-column {
    width: 50%;
    padding: 20px;
    background-color: #f0f0f0;
}

.right-column {
    width: 50%;
    padding: 20px;
    background-color: #f0f0f0;
}

.product-image {
    width: 100%;
    height: 200px;
    background-color: #ccc;
    margin-bottom: 20px;
}

.logo {
    width: 100%;
    height: 100px;
    background-color: #ccc;
    margin-bottom: 20px;
}

.product-description {
    font-size: 18px;
    line-height: 1.5;
    color: #333;
}
</style>
<body>
    <div class="container">
        <div class="left-column">
            <div class="product-image"></div>
            <div class="product-description"></div>
        </div>
        <div class="right-column">
            <div class="logo"></div>
            <div class="product-description"></div>
        </div>
    </div>
</body>
</html>
