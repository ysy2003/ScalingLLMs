<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

header {
    background-color: #f8f8f8;
    padding: 20px 0;
    text-align: center;
}

nav {
    margin-bottom: 20px;
}

nav a {
    margin: 0 10px;
    text-decoration: none;
    color: #333;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.product-item {
    background-color: #ddd;
    padding: 20px;
    border-radius: 5px;
}

.product-item img {
    width: 100%;
    height: 200px;
    background-color: #333;
}

.product-item p {
    margin-top: 10px;
}

footer {
    background-color: #f8f8f8;
    padding: 20px 0;
    text-align: center;
}
</style>
<body>
    <div class="container">
        <header>
            <nav>
                <!-- Navigation links go here -->
            </nav>
            <div class="product-grid">
                <!-- Product items go here -->
            </div>
        </header>
        <main>
            <!-- Main content goes here -->
        </main>
        <footer>
            <!-- Footer content goes here -->
        </footer>
    </div>
</body>
</html>
