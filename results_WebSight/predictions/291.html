<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background-color: #f8f8f8;
    border-bottom: 1px solid #ddd;
}

.logo {
    width: 150px;
    height: 50px;
    background-color: #00f;
}

.nav a {
    margin-left: 20px;
    text-decoration: none;
    color: #333;
}

.content {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    background-color: #f0f0f0;
    border-bottom: 1px solid #ddd;
}

.content p {
    text-align: center;
    margin-bottom: 20px;
}

.footer {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 20px;
    background-color: #333;
    color: #fff;
}

.footer a {
    color: #fff;
    text-decoration: none;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"></div>
            <div class="nav">
                <a href="#">Theater</a>
                <a href="#">Movie</a>
                <a href="#">Market</a>
                <a href="#">News</a>
            </div>
        </div>
        <div class="content">
            <p>Stay Informed</p>
            <form>
                <label for="email">Sign Up for Email Alerts:</label>
                <input type="email" id="email" name="email" required>
                <input type="submit" value="Sign Up">
            </form>
        </div>
        <div class="footer">
            <div class="social">
                <a href="#">Facebook</a>
                <a href="#">Twitter</a>
                <a href="#">Instagram</a>
            </div>
            <div class="newsletter">
                <form>
                    <label for="email">Subscribe to Newsletter:</label>
                    <input type="email" id="email" name="email" required>
                    <input type="submit" value="Subscribe">
                </form>
            </div>
            <div class="contact">
                <p>Contact Us:</p>
                <p>123 Main St</p>
                <p>Anytown, USA 12345</p>
                <p>+1 (123) 456-7890</p>
                <p>info@alumni.com</p>
            </div>
        </div>
    </div>
</body>
</html>
