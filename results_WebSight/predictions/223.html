<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

h1 {
    font-size: 2.5em;
    text-align: center;
    color: #1a1a1a;
}

.timeline {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.timeline-item {
    display: flex;
    flex-direction: row;
    width: 100%;
    margin-bottom: 20px;
}

.timeline-item:before {
    content: "";
    width: 10px;
    height: 10px;
    background-color: #1a1a1a;
    margin-right: 10px;
}

.timeline-item:nth-child(odd) {
    flex-direction: row-reverse;
}

.timeline-item:nth-child(odd):before {
    background-color: #1a1a1a;
}

.timeline-item:nth-child(odd):after {
    background-color: #1a1a1a;
}

.timeline-item p {
    flex: 1;
    padding: 10px;
    background-color: #fff;
    border-radius: 5px;
}

.timeline-item img {
    width: 100%;
    height: 200px;
    background-color: #f0f0f0;
    border-radius: 5px;
}
</style>
<body>
    <div class="container">
        <h1>Our Work</h1>
        <div class="timeline">
            <div class="timeline-item">
                <p>Project 1</p>
                <img src="https://lorempixel.com/200/200/1a1a1a/fff" alt="Project 1">
            </div>
            <div class="timeline-item">
                <p>Project 2</p>
                <img src="https://lorempixel.com/200/200/1a1a1a/fff" alt="Project 2">
            </div>
            <div class="timeline-item">
                <p>Project 3</p>
                <img src="https://lorempixel.com/200/200/1a1a1a/fff" alt="Project 3">
            </div>
            <!-- Add more timeline items as needed -->
        </div>
        <p>I'm a paragraph of text.</p>
    </div>
</body>
</html>
