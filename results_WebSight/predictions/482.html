<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.logo {
    font-size: 2.5em;
    text-align: center;
    margin-bottom: 1em;
}

.content {
    display: flex;
    justify-content: space-around;
    width: 80%;
}

.column {
    width: 45%;
    padding: 1em;
    box-sizing: border-box;
}

.left {
    text-align: left;
}

.right {
    text-align: right;
}

.category {
    margin-bottom: 1em;
}

.product {
    margin-bottom: 0.5em;
    padding: 0.5em;
    box-sizing: border-box;
}
</style>
<body>
    <div class="logo">
        <div style="background-color: blue; height: 100px; width: 100px;"></div>
        <h1>Beauty</h1>
    </div>
    <div class="content">
        <div class="column left">
            <h2>Categories</h2>
            <div class="category">Zo</div>
            <div class="category">Skincare</div>
            <div class="category">Makeup</div>
            <div class="category">Hair</div>
        </div>
        <div class="column right">
            <h2>Products</h2>
            <div class="product">Product 1</div>
            <div class="product">Product 2</div>
            <div class="product">Product 3</div>
            <div class="product">Product 4</div>
        </div>
    </div>
</body>
</html>
