<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
}

.header__image {
    width: 100%;
    height: 200px;
    background-color: #00f;
}

.header__logo {
    width: 100px;
    height: 100px;
    background-color: #00f;
}

.header__nav {
    width: 100%;
    background-color: #00f;
}

.header__search {
    width: 100%;
    background-color: #00f;
}

.main {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.main__content {
    width: 70%;
    background-color: #fff;
}

.main__sidebar {
    width: 30%;
    background-color: #fff;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
}

.footer__logo {
    width: 100px;
    height: 100px;
    background-color: #00f;
}

.footer__links {
    width: 50%;
    background-color: #00f;
}

.footer__contact {
    width: 50%;
    background-color: #00f;
}
</style>
<body>
    <header class="header">
        <div class="header__image"></div>
        <div class="header__logo"></div>
        <nav class="header__nav"></nav>
        <div class="header__search"></div>
    </header>
    <main class="main">
        <div class="main__content">
            <!-- Main content goes here -->
            <h1>Welcome to our website</h1>
            <p>This is a very simple website with a header, main content, and footer.</p>
        </div>
        <aside class="main__sidebar">
            <!-- Sidebar content goes here -->
            <h2>Related Links</h2>
            <ul>
                <li><a href="#">Link 1</a></li>
                <li><a href="#">Link 2</a></li>
                <li><a href="#">Link 3</a></li>
            </ul>
        </aside>
    </main>
    <footer class="footer">
        <div class="footer__logo"></div>
        <div class="footer__links">
            <h3>QUICK LINKS</h3>
            <p>Search</p>
            <p>Contact</p>
        </div>
        <div class="footer__contact">
            <h3>GET IN TOUCH</h3>
            <p>Email: [Your E-MAIL]</p>
            <p>Phone: [Your PHONE]</p>
        </div>
    </footer>
</body>
</html>
