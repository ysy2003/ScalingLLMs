<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
    background-color: #fff;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    width: 100px;
    height: 100px;
    background-color: #00b3ff;
}

.nav a {
    margin-left: 20px;
    color: #fff;
    text-transform: uppercase;
    text-decoration: none;
}

.content {
    display: flex;
    justify-content: space-between;
}

.col {
    width: 48%;
    height: 200px;
    background-color: #00b3ff;
}

.main-content {
    width: 100%;
    height: 400px;
    background-color: #fff;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #333;
    color: #fff;
    padding: 20px;
}

.footer a {
    color: #fff;
    text-transform: uppercase;
    text-decoration: none;
    margin-left: 20px;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"></div>
            <div class="nav">
                <a href="#">Contact</a>
                <a href="#">About</a>
                <a href="#">Pricing</a>
                <a href="#">Services</a>
            </div>
            <form>
                <input type="text" placeholder="Search">
                <button type="submit">Search</button>
            </form>
        </div>
        <div class="content">
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
            <div class="main-content"></div>
        </div>
        <div class="footer">
            <div class="col">
                <a href="#">Facebook</a>
                <a href="#">Twitter</a>
                <a href="#">Instagram</a>
            </div>
            <div class="col">
                <a href="#">Blog</a>
                <a href="#">Contact</a>
            </div>
            <div class="col">
                <a href="#">Pricing</a>
                <a href="#">Services</a>
            </div>
        </div>
    </div>
</body>
</html>
