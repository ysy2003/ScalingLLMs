<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #fff;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 80%;
    margin: auto;
}

.left-column {
    width: 50%;
    padding: 20px;
    background: #fff;
    color: #000;
}

.right-column {
    width: 50%;
    padding: 20px;
    background: #fff;
    color: #000;
}

.filter {
    margin-bottom: 20px;
}

.filter label {
    display: block;
    margin-bottom: 10px;
}

.filter input {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
}

.product {
    margin-bottom: 20px;
    color: #000;
}

.product img {
    width: 100%;
    height: 200px;
    background: #ccc;
    margin-bottom: 10px;
}

.product p {
    margin: 0;
}
</style>
<body>
    <div class="container">
        <div class="left-column">
            <div class="filter">
                <!-- Filter options -->
                <label>
                    PRODUCTS
                    <select>
                        <option value="">Filter by Category</option>
                        <option value="drinks">Drinks</option>
                        <option value="food">Food</option>
                        <option value="accessories">Accessories</option>
                    </select>
                </label>
                <label>
                    SEARCH
                    <input type="text" placeholder="Search...">
                </label>
            </div>
            <h2>Products</h2>
            <div class="product">
                <img src="https://via.placeholder.com/150" alt="Product Image">
                <p>Product 1</p>
                <p>$10</p>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/150" alt="Product Image">
                <p>Product 2</p>
                <p>$15</p>
            </div>
            <!-- More products... -->
        </div>
        <div class="right-column">
            <h2>Customer Reviews</h2>
            <div class="review">
                <p>"This is a great product. I love it!"</p>
                <p>- Customer 1</p>
            </div>
            <div class="review">
                <p>"I'm not a fan of this product. It's not as good as I hoped."</p>
                <p>- Customer 2</p>
            </div>
            <!-- More reviews... -->
        </div>
        <div class="right-column">
            <h2>Order Online</h2>
            <form>
                <!-- Order form -->
                <label>
                    Name
                    <input type="text" placeholder="Your Name">
                </label>
                <label>
                    Address
                    <input type="text" placeholder="Your Address">
                </label>
                <label>
                    Country
                    <input type="text" placeholder="Your Country">
                </label>
                <button type="submit">Order Now</button>
            </form>
        </div>
        <div class="right-column">
            <h2>Social Media</h2>
            <div class="social-media">
                <!-- Social media links -->
                <a href="#">Facebook</a>
                <a href="#">Twitter</a>
                <a href="#">Instagram</a>
            </div>
        </div>
    </div>
</body>
</html>
