<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #334;
}

header {
    background: #f8f8f8;
    padding: 20px;
    text-align: center;
}

.header-title {
    font-size: 2.5em;
    color: #334;
}

.header-subtitle {
    font-size: 1.2em;
    color: #99c;
}

main {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
}

.main-title {
    font-size: 2em;
    color: #334;
}

.main-paragraph {
    font-size: 1em;
    color: #666;
}

.product-info {
    margin-top: 20px;
    padding: 20px;
    background: #f8f8f8;
    color: #334;
}

.product-info-title {
    font-size: 1.5em;
    color: #334;
}

.product-info-paragraph {
    font-size: 1em;
    color: #666;
}

.product-info-form {
    margin-top: 20px;
    padding: 20px;
    background: #f8f8f8;
    color: #334;
}

.product-info-form-title {
    font-size: 1.5em;
    color: #334;
}

.product-info-form-paragraph {
    font-size: 1em;
    color: #666;
}

.product-info-form-label {
    display: block;
    margin-bottom: 10px;
}

.product-info-form-input {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
}

.product-info-form-textarea {
    width: 100%;
    height: 100px;
    padding: 10px;
    margin-bottom: 20px;
}

.product-info-form-button {
    padding: 10px 20px;
    background: #334;
    color: #f8f8f8;
    border: none;
    cursor: pointer;
}

footer {
    background: #334;
    color: #f8f8f8;
    text-align: center;
    padding: 20px;
    position: fixed;
    bottom: 0;
    width: 100%;
}
</style>
<body>
    <header>
        <h1 class="header-title">Welcome to Car Company</h1>
        <h2 class="header-subtitle">by Car Fanatics</h2>
    </header>
    <main>
        <section class="product-info">
            <h2 class="product-info-title">Our Products</h2>
            <p class="product-info-paragraph">We offer a wide range of products that are designed to meet your needs. From luxury sports cars to everyday commuter vehicles, we've got you covered.</p>
            <div class="product-info-form">
                <h3 class="product-info-form-title">Request a Quote</h3>
                <form>
                    <label for="name" class="product-info-form-label">Name:</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email" class="product-info-form-label">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="message" class="product-info-form-label">Message:</label>
                    <textarea id="message" name="message" required></textarea>
                    <button type="submit" class="product-info-form-button">Submit</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2022 Car Company. All rights reserved.</p>
    </footer>
</body>
</html>
