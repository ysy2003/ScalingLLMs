<html>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #fff;
}

.header {
    width: 100%;
    padding: 20px;
    background: #f8f8f8;
}

.header h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
}

.header p {
    font-size: 1.2em;
    margin-bottom: 20px;
}

.content {
    width: 100%;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.content h2 {
    font-size: 2em;
    margin-bottom: 10px;
}

.content p {
    font-size: 1.2em;
    margin-bottom: 20px;
}

.footer {
    width: 100%;
    padding: 20px;
    background: #f8f8f8;
    text-align: center;
}

.footer p {
    font-size: 1em;
    margin-bottom: 10px;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Our Store</h1>
            <p>We offer the best deals in town</p>
        </div>
        <div class="content">
            <h2>Our Products</h2>
            <p>Check out our wide range of products</p>
            <h2>Secure Payment</h2>
            <p>We ensure safe transactions</p>
            <h2>Shipping Information</h2>
            <p>We ship worldwide</p>
            <h2>Customer Reviews</h2>
            <p>Read what our customers have to say</p>
        </div>
        <div class="footer">
            <h3>Contact Us</h3>
            <p>Have questions? We're here to help</p>
        </div>
    </div>
</body>
</html>
