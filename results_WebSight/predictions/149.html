<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background-color: #000;
    color: #fff;
    padding: 10px 0;
    text-align: center;
}

.header img {
    width: 100px;
    height: 100px;
    background-color: #fff;
}

.header nav ul {
    list-style-type: none;
    padding: 0;
}

.header nav ul li {
    display: inline;
    margin: 0 10px;
}

.header nav ul li a {
    color: #fff;
    text-decoration: none;
}

.content {
    margin: 20px 0;
}

.content p {
    line-height: 1.6;
}

.footer {
    background-color: #000;
    color: #fff;
    text-align: center;
    padding: 10px 0;
    margin-top: 20px;
}

.footer img {
    width: 100px;
    height: 100px;
    background-color: #fff;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <img src="https://via.placeholder.com/200x50/0000FF/808080?text=Logo" alt="Logo">
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
        <div class="content">
            <p>Welcome to our website. We are a tech company dedicated to providing the best in class solutions for all your needs.</p>
        </div>
        <div class="footer">
            <p>Our company was founded in 2005 with the goal of providing innovative solutions for all your needs.</p>
            <img src="https://via.placeholder.com/100x100/0000FF/808080?text=Footer" alt="Footer">
        </div>
    </div>
</body>
</html>
