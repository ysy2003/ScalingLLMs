<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #333;
}

header, main, footer {
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
}

nav {
    display: flex;
    justify-content: space-around;
    width: 100%;
}

nav a {
    color: #fff;
    text-decoration: none;
    padding: 10px;
}

header, footer {
    background-color: #222;
    color: #fff;
}

.logo {
    width: 100px;
    height: 100px;
    background-color: #fff;
}

.search-bar {
    width: 100%;
    height: 50px;
    background-color: #fff;
}

.search-bar input {
    width: 100%;
    height: 100%;
    padding: 10px;
    border: none;
    background-color: #fff;
}

.property {
    width: 100%;
    height: 200px;
    background-color: #00f;
    margin: 10px 0;
}

.property-description {
    width: 100%;
    height: 100px;
    background-color: #00f;
    margin: 10px 0;
}

.property-description p {
    padding: 10px;
}
</style>
<body>
    <header>
        <div class="logo"></div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Properties</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Images</a>
            <a href="#">Contact</a>
        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Search properties...">
        </div>
    </header>
    <main>
        <section class="property-listings">
            <div class="listing">
                <div class="logo"></div>
                <h2>Property 1</h2>
                <p>This is a brief description of property 1.</p>
            </div>
            <div class="listing">
                <div class="logo"></div>
                <h2>Property 2</h2>
                <p>This is a brief description of property 2.</p>
            </div>
            <div class="listing">
                <div class="logo"></div>
                <h2>Property 3</h2>
                <p>This is a brief description of property 3.</p>
            </div>
        </section>
    </main>
    <footer>
        <div class="logo"></div>
    </footer>
</body>
</html>
