<html>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    color: #333;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background-color: #f8f9fa;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
}

nav ul {
    display: flex;
    list-style: none;
}

nav ul li {
    margin: 0 10px;
}

nav ul li a {
    text-decoration: none;
    color: #3f51b5;
}

.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 20px;
}

.hero h1 {
    font-size: 3.5em;
    margin-bottom: 20px;
    color: #333;
}

.hero p {
    font-size: 1.5em;
    margin-bottom: 20px;
}

.hero button {
    padding: 10px 30px;
    font-size: 1.2em;
    background-color: #3f51b5;
    color: #fff;
    border: none;
    cursor: pointer;
}

.hero button:hover {
    background-color: #2196f3;
}

.social-media {
    position: fixed;
    bottom: 0;
    right: 0;
    padding: 10px;
    background-color: #f8f9fa;
    box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
}

.social-media a {
    margin: 0 10px;
    color: #333;
    text-decoration: none;
}
</style>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    <header>
    <div class="hero">
        <h1>Welcome to Tecnology Solutions</h1>
        <p>We are a company dedicated to providing the best in technology solutions</p>
        <button>GET STARTED</button>
        <div class="social-media">
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
            <a href="#">LinkedIn</a>
        </div>
    </div>
    <div class="content">
        <!-- Your content goes here -->
        <!-- For simplicity, I'll just put a placeholder -->
        <p>This is some content about our products and services</p>
    </div>
</body>
</html>
