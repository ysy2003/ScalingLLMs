.header {

    padding: 20px;

.logo {

.cta button {
    padding: 10px 20px;
    font-size: 18px;
    background-color: #00f;
    color: #fff;
    border: none;
    cursor: pointer;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
