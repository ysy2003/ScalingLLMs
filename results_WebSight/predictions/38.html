<html>
<style>

    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;

    align-items: center;

    text-align: center;
    background-color: #f4f4f4;
}

.logo {
    width: 100%;
    height: 100px;

}

.navigation {
    width: 100%;
    height: 50px;
    background-color: #00f;
    margin-bottom: 20px;
}

.content {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.product {
    width: 100%;
    height: 200px;
    background-color: #00f;
    margin-bottom: 20px;
}

.footer {
    width: 100%;
    height: 50px;
    background-color: #00f;
}

<body>
    <div class="container">
        <div class="logo"></div>

            <div class="product"></div>
            <div class="product"></div>
        </div>

            <p>This is where you would put your footer information.</p>
        </div>
    </div>

</html>
