<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

.header {
    width: 100%;
    height: 100px;
    background-color: #f8f8f8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    color: #333;
}

.content {
    width: 80%;
    display: flex;
    flex-direction: row;
    margin: 20px 0;
}

.left-column {
    width: 30%;
    height: 100%;
    background-color: #f8f8f8;
    padding: 20px;
    box-sizing: border-box;
}

.right-column {
    width: 70%;
    height: 100%;
    background-color: #f8f8f8;
    padding: 20px;
    box-sizing: border-box;
}

.footer {
    width: 100%;
    height: 50px;
    background-color: #f8f8f8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2em;
    color: #333;
}
</style>
<body>
    <div class="header"></div>
    <div class="content">
        <div class="left-column"></div>
        <div class="right-column"></div>
    </div>
    <div class="footer"></div>
</body>
</html>
