<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #f0f2f5;
    color: #333;
}

.app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
}

.app-header {
    width: 100%;
    height: 100px;
    background-color: #333;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.app-header-logo {
    width: 100px;
    height: 100px;
    background-color: #fff;
}

.app-header-text {
    margin-left: 20px;
}

.app-content {
    width: 100%;
    height: calc(100vh - 100px);
    padding: 20px;
    box-sizing: border-box;
}

.app-footer {
    width: 100%;
    height: 100px;
    background-color: #333;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.app-footer-logo {
    width: 100px;
    height: 100px;
    background-color: #fff;
}

.app-footer-text {
    margin-left: 20px;
}
</style>
<body>
    <div class="app">
        <div class="app-header">
            <div class="app-header-logo"></div>
            <div class="app-header-text">
                <h1>Welcome to Our App</h1>
            </div>
        </div>
        <div class="app-content">
            <p>Our app is designed to provide you with the best of the best. It's easy to use, and it's designed to make your life easier. Download now and experience the difference.</p>
        </div>
        <div class="app-footer">
            <div class="app-footer-logo"></div>
            <div class="app-footer-text">
                <p>Copyright © 2022 Our App</p>
            </div>
        </div>
    </div>
</body>
</html>
