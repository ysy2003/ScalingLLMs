<html>
<style>
body {
    font-family: 'Alegreya', serif;
    margin: 0;
    padding: 0;
    color: #333;
}

header {
    background-color: #fbfbfb;
    padding: 20px;
    text-align: center;
}

nav {
    margin-top: 20px;
}

nav a {
    margin-right: 10px;
    text-transform: uppercase;
    text-decoration: none;
    color: #333;
}

main {
    margin: 0 auto;
    max-width: 800px;
    padding: 20px;
}

h1, h2 {
    color: #333;
    text-align: center;
}

p {
    color: #333;
    font-size: 1.2em;
    line-height: 1.6em;
}

a {
    color: #333;
    text-decoration: none;
}

.cta {
    background-color: #f44336;
    color: #fff;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
}

.cta:hover {
    background-color: #d32f2f;
}

.post {
    margin-bottom: 20px;
}

.post-image {
    width: 100%;
    height: 400px;
    background-color: #00f;
    margin-bottom: 10px;
}

.post-image:hover {
    background-color: #0080ff;
}

.social-media {
    margin-top: 20px;
}

.social-media a {
    margin-right: 10px;
}

footer {
    background-color: #fbfbfb;
    padding: 20px;
    text-align: center;
    position: fixed;
    bottom: 0;
    width: 100%;
}
</style>
<body>
    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <h1>Welcome to Coder's Paradise</h1>
        <a href="#" class="cta">Learn More</a>
    </header>
    <main>
        <section class="post">
            <h2>Post Title</h2>
            <p>This is a short sentence about the post. It contains a link to the full post.</p>
            <div class="post-image"></div>
            <a href="#">Read More</a>
        </section>
        <!-- More posts here -->
    </main>
    <footer>
        <div class="social-media">
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
            <a href="#">Instagram</a>
        </div>
        <p>Powered by Coder's Paradise</p>
    </footer>
</body>
</html>
