<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

header {
    background-image: linear-gradient(to bottom, #f5f5f5, #e5e5e5);
    padding: 20px 0;
    text-align: center;
}

.content {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

.column {
    width: 45%;
    padding: 20px;
    background-color: #f5f5f5;
    border-radius: 10px;
}

.left {
    margin-right: 10px;
}

.right {
    margin-left: 10px;
}

h1, h2 {
    color: #333;
}

p {
    color: #666;
}
</style>
<body>
    <div class="container">
        <header>
            <input type="text" placeholder="Search, filter, and browse courses">
        </header>
        <div class="content">
            <div class="column left">
                <h1>Course Information</h1>
                <h2>Course Title</h2>
                <p>Course Description</p>
                <h2>Course Information</h2>
                <h2>Course Information</h2>
                <h2>Course Information</h2>
            </div>
            <div class="column right">
                <h1>Student Reviews</h1>
                <h2>Student Review</h2>
                <p>Student Review</p>
                <h2>Student Reviews</h2>
                <h2>Student Reviews</h2>
                <h2>Student Reviews</h2>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="logo">
            <h1>Logo</h1>
        </div>
    </div>
</body>
</html>
