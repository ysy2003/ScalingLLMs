<html>
<style>
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 50px;
}

.left-column {
    width: 20%;
    background-color: #f0f0f0;
    padding: 20px;
}

.right-column {
    width: 75%;
    background-color: #fff;
    padding: 20px;
}

.title {
    font-size: 2em;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.product-description {
    font-size: 1.2em;
    line-height: 1.5em;
    margin-bottom: 20px;
}

.product-image {
    width: 100%;
    height: 200px;
    background-color: blue;
    margin-bottom: 20px;
}

.share-button {
    font-size: 1.2em;
    text-decoration: none;
    color: blue;
    background-color: #fff;
    padding: 10px;
    border-radius: 5px;
    display: inline-block;
    margin-bottom: 20px;
}
</style>
<body>
    <div class="container">
        <div class="left-column">
            <h1 class="title">Products</h1>
            <p class="product-description">Our products are made with the highest quality materials and craftsmanship. We strive for perfection in every product we produce.</p>
            <a href="#" class="share-button">Share</a>
        </div>
        <div class="right-column">
            <h1 class="title">Knowledge Base</h1>
            <p class="product-description">My knowledge is the best in the industry. Check out our blog for the latest trends and updates.</p>
            <a href="#" class="share-button">Share</a>
        </div>
    </div>
    <hr>
</body>
</html>
