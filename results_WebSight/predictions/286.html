<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

header {
    background-image: linear-gradient(to right, #f2f2f2, #333);
    padding: 50px 0;
    text-align: center;
}

header h1 {
    font-size: 3em;
    color: #333;
}

header p {
    font-size: 1.2em;
    color: #666;
}

.hero {
    background-image: linear-gradient(to right, #f2f2f2, #333);
    padding: 50px 0;
    text-align: center;
}

.hero h2 {
    font-size: 2em;
    color: #333;
}

.hero p {
    font-size: 1.2em;
    color: #666;
}

.cta {
    background-color: #008CBA;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
}

.cta:hover {
    background-color: #007B9A;
}

.cta-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 50px;
    background-color: #f2f2f2;
}

.cta-container button {
    margin: 0 10px;
}

.footer {
    background-image: linear-gradient(to right, #f2f2f2, #333);
    padding: 50px 0;
    text-align: center;
}

.footer h3 {
    font-size: 1.5em;
    color: #333;
}

.footer p {
    font-size: 1em;
    color: #666;
}
</style>
<body>
    <div class="container">
        <header>
            <div class="hero">
                <h1>Welcome to Our Bethany Lifestyle</h1>
                <p>Experience the beauty of our lifestyle with us. Join us today and let's connect.</p>
                <button class="cta">Get Started</button>
            </div>
        </header>
        <div class="cta-container">
            <button class="cta">Join Now</button>
            <button class="cta">Get Started</button>
        </div>
        <div class="footer">
            <h3>Follow Us</h3>
            <p>Stay connected with us on social media.</p>
            <div class="social-icons">
                <i class="fa fa-facebook"></i>
                <i class="fa fa-twitter"></i>
                <i class="fa fa-instagram"></i>
                <i class="fa fa-linkedin"></i>
            </div>
        </div>
    </div>
</body>
</html>
