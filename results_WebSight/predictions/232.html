<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background-color: #f8f8f8;
    padding: 20px;
    text-align: center;
}

.header h1 {
    font-size: 3em;
    color: #333;
}

.header p {
    font-size: 1.2em;
    color: #666;
}

.search-bar {
    margin: 20px 0;
}

.search-bar input[type="text"] {
    padding: 10px;
    width: 200px;
    border: 1px solid #333;
    border-radius: 5px;
}

.search-bar button {
    padding: 10px;
    background-color: #333;
    color: #fff;
    border: none;
    border-radius: 5px;
}

.product-categories {
    display: flex;
    justify-content: space-around;
    margin: 20px 0;
}

.product-categories div {
    width: 30%;
    height: 100px;
    background-color: #f8f8f8;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
}

.content {
    margin: 20px 0;
}

.content p {
    font-size: 1.2em;
    color: #666;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to our Home Decoration Website</h1>
            <p>Find the perfect home decor for your space.</p>
            <div class="search-bar">
                <input type="text" placeholder="Search our products">
                <button>Search</button>
            </div>
            <div class="product-categories">
                <div class="category">Luxury Products</div>
                <div class="category">Bathroom Products</div>
                <div class="category">Kitchen Products</div>
                <div class="category">Electronics</div>
            </div>
        </div>
        <div class="content">
            <!-- Product content goes here -->
            <div class="product">
                <div class="product-image"></div>
                <h2>Product Title</h2>
                <p>Product overview</p>
            </div>
            <!-- More products... -->
        </div>
        <div class="footer">
            <!-- Footer content goes here -->
        </div>
    </div>
</body>
</html>
