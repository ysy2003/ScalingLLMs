<html>
<style>
body {
    background-color: #f0f0f0;
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
}

.header {
    background-color: #333;
    color: #fff;
    padding: 10px;
    text-align: center;
    font-size: 30px;
}

.content {
    margin: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
}

.product {
    width: 45%;
    margin: 10px;
    height: 200px;
    background-color: #ccc;
    text-align: center;
    padding: 10px;
}

.product img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product p {
    margin-top: 10px;
    font-size: 16px;
}

.footer {
    background-color: #333;
    color: #fff;
    padding: 10px;
    text-align: center;
    position: fixed;
    bottom: 0;
    width: 100%;
}

.footer a {
    color: #fff;
    text-decoration: none;
    margin: 0 10px;
}
</style>
<body>
    <div class="header">
        <h1>Luxury Brand</h1>
    </div>
    <div class="content">
        <div class="product">
            <img src="product1.jpg" alt="Product 1">
            <p>Experience the finest quality and luxury with our product 1.</p>
        </div>
        <div class="product">
            <img src="product2.jpg" alt="Product 2">
            <p>Our product 2 is the perfect blend of luxury and functionality.</p>
        </div>
        <div class="product">
            <img src="product3.jpg" alt="Product 3">
            <p>Our product 3 is the ultimate in luxury and style.</p>
        </div>
    </div>
    <div class="footer">
        <p>Powered by Luxury Brand Portfolio</p>
    </div>
</body>
</html>
