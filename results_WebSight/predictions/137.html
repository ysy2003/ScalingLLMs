<html>
<style>
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;

}

.container {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}

.left-column {
    width: 30%;

}

.right-column {

    padding: 20px;
}

.header {
    background-color: #f0f0f0;
    padding: 20px;
    text-align: center;
}

.header img {
    width: 100px;
    height: 100px;
    background-color: #f0f0f0;
}

.header h1 {
    font-size: 2.5em;
    color: #333;
}

.header p {
    font-size: 1.2em;
    color: #666;
}

.left-column h2 {

    color: #333;
}

.left-column p {
    font-size: 1em;
    color: #666;
}

.right-column h2 {
    font-size: 1.5em;
    color: #333;
}

.right-column p {
    font-size: 1em;
    color: #666;
}

.footer {
    background-color: #f0f0f0;
    padding: 20px;
    text-align: center;
}

.footer img {
    width: 100px;
    height: 100px;
    background-color: #f0f0f0;
}

.footer p {
    font-size: 1em;
    color: #666;
}
</style>
<body>

            <div class="header">

                <p>PLACEHOLDER</p>
            </div>
            <!-- Left column content -->
            <h2>PLINKS</h2>

            <p>SERVICES</p>

        </div>
        <div class="right-column">
            <!-- Right column content -->
            <h2>ABOUT</h2>
            <p>ABOUT</p>
            <h2>CONTACT</h2>
            <p>CONTACT</p>
            <h2>NEWSLETTER</h2>
            <p>NEWSLETTER</p>
        </div>
    </div>
    <div class="footer">
        <!-- Footer content -->
        <h2>Contact Information</h2>
        <p>CONTACT INFO</p>
    </div>
</body>
</html>
