<html>
<style>
body {
    background-color: #f0f0f0;
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100%;
}

.column {
    width: 30%;
    height: 50%;
    background-color: #000;
    color: #fff;
    text-align: center;
    padding: 50px;
    margin: 20px;
}

.column.left {
    background-color: #f00;
}

.column.right {
    background-color: #0f0;
}

.column.center {
    background-color: #00f;
}

.column.left p, .column.right p, .column.center p {
    font-size: 18px;
    line-height: 1.5;
    margin: 0;
}
</style>
<body>
    <div class="container">
        <div class="column left">
            <!-- Left column content goes here -->
        </div>
        <div class="column center">
            <p>Your favorite content goes here</p>
        </div>
        <div class="column right">
            <!-- Right column content goes here -->
        </div>
    </div>
</body>
</html>
