<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #333;
}

header, main, footer {
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
}

nav {
    display: flex;
    justify-content: space-around;
    width: 100%;
}

nav a {
    color: #333;
    text-decoration: none;
}

.product {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 20px;
}

.product-image {
    width: 200px;
    height: 200px;
    background-color: blue;
    margin-bottom: 10px;
}

.product-title {
    font-size: 2em;
    margin-bottom: 10px;
}

.product-description {
    text-align: center;
}

.cta {
    background-color: #007BFF;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    font-size: 1.2em;
    cursor: pointer;
}
</style>
<body>
    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <form>
            <input type="text" placeholder="I'm looking for...">
            <select>
                <option value="">Music</option>
                <option value="">Electronics</option>
                <option value="">Fashion</option>
            </select>
            <button type="submit" value="Search">Search</button>
        </form>
    </header>
    <main>
        <div class="product">
            <div class="product-image"></div>
            <h2 class="product-title">Product Title</h2>
            <p class="product-description">Product info</p>
            <button class="cta">Add to Cart</button>
        </div>
        <div class="product">
            <div class="product-image"></div>
            <h2 class="product-title">Product Title</h2>
            <p class="product-description">Product info</p>
            <button class="cta">Add to Cart</button>
        </div>
        <div class="product">
            <div class="product-image"></div>
            <h2 class="product-title">Product Title</h2>
            <p class="product-description">Product info</p>
            <button class="cta">Add to Cart</button>
        </div>
    </main>
    <footer>
        <p>Copyright © 2022 - All rights reserved.</p>
        <nav>
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
            <a href="#">Instagram</a>
        </nav>
        <p>Shopping Link</p>
    </footer>
</body>
</html>
