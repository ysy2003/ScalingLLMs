<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background-color: #fff;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    width: 100px;
    height: 50px;
    background-color: #f00;
}

.menu {
    display: flex;
    gap: 20px;
}

.menu a {
    text-decoration: none;
    color: #000;
}

.content {
    margin-top: 20px;
}

.content p {
    line-height: 1.6;
}

.footer {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 10px;
    position: fixed;
    bottom: 0;
    width: 100%;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"></div>
            <div class="menu">
                <a href="#">Home</a>
                <a href="#">Sports</a>
                <a href="#">Technology</a>
                <a href="#">Politics</a>
                <a href="#">Entertainment</a>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search...">
            </div>
        </div>
        <div class="content">
            <h1>Welcome to Buffalo News - Your Business</h1>
            <p>We are a leading provider of business news and analysis. Stay informed with our latest updates.</p>
        </div>
        <div class="footer">
            <p>Copyright 2022 Buffalo News</p>
        </div>
    </div>
</body>
</html>
