<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.hero {
    background-image: url('hero-image.jpg');
    background-size: cover;
    background-position: center;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.hero h1 {
    font-size: 3.5em;
    color: #fff;
    margin: 0;
}

.hero h2 {
    font-size: 2em;
    color: #fff;
    margin: 1em 0;
}

.hero p {
    font-size: 1.2em;
    color: #fff;
    margin: 0;
}

.cta {
    display: inline-block;
    margin-top: 1em;
    padding: 0.5em 1em;
    background-color: #fff;
    color: #333;
    text-decoration: none;
    text-transform: uppercase;
    border: 1px solid #333;
    transition: background-color 0.3s ease;
}

.cta:hover {
    background-color: #333;
    color: #fff;
}
</style>
<body>
    <div class="hero">
        <h1>THINK BIG</h1>
        <h2>THINK BIG</h2>
        <p>THINK BIG</p>
        <a href="#menu" class="cta">Menu</a>
    </div>
</body>
</html>
