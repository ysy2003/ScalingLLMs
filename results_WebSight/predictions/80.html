<html>
<style>
body {
    font-family: 'Alegreya', serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.header, .footer {
    background-color: #f8f4e1;
    padding: 20px;
    text-align: center;
}

.header {
    font-size: 2em;
}

.footer {
    font-size: 1.2em;
}

.content {
    display: flex;
    justify-content: space-between;
    padding: 20px;
    background-color: #f0f0f0;
}

.left-column, .right-column {
    width: 45%;
    padding: 20px;
}

.left-column {
    background-color: #f8f4e1;
}

.right-column {
    background-color: #f0f0f0;
}

.product {
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
}

.product-image {
    width: 30%;
    height: 100px;
    background-color: #0080ff;
}

.product-description {
    width: 65%;
}

.search-bar {
    width: 100%;
    padding: 10px;
    font-size: 1.2em;
}

.social-media-links {
    display: flex;
    justify-content: space-between;
}

.social-media-links a {
    width: 30%;
    height: 50px;
    background-color: #0080ff;
}

.contact-form {
    display: flex;
    flex-direction: column;
}

.contact-form input, .contact-form textarea {
    margin-bottom: 20px;
}

.contact-form button {
    width: 100px;
    height: 30px;
    background-color: #0080ff;
    color: #fff;
    border: none;
}
</style>
<body>
    <div class="header">
        <!-- This is where the header content will go -->
        <div class="logo">
            <!-- This is where the logo will go -->
        </div>
        <div class="search-bar">
            <!-- This is where the search bar will go -->
            <input type="text" placeholder="Search...">
        </div>
    </div>
    <div class="content">
        <div class="left-column">
            <div class="category">
                <!-- This is where the categories will go -->
            </div>
            <div class="product">
                <!-- This is where the products will go -->
                <div class="product-image"></div>
                <div class="product-description">
                    <p>This is where the product description will go</p>
                </div>
            </div>
            <!-- More products... -->
        </div>
        <div class="right-column">
            <div class="blog">
                <!-- This is where the blog content will go -->
            </div>
            <div class="social-media-links">
                <!-- This is where the social media links will go -->
            </div>
            <div class="contact-form">
                <!-- This is where the contact form will go -->
                <input type="text" placeholder="Street Address">
                <input type="text" placeholder="City">
                <input type="text" placeholder="State">
                <input type="text" placeholder="Zip">
                <input type="text" placeholder="Phone Number">
                <input type="text" placeholder="Email">
                <textarea placeholder="Message"></textarea>
                <button>Submit</button>
            </div>
        </div>
    </div>
    <div class="footer">
        <!-- This is where the footer content will go -->
        <div class="footer-links">
            <!-- This is where the footer links will go -->
        </div>
        <div class="contact-info">
            <!-- This is where the contact information will go -->
        </div>
    </div>
</body>
</html>
