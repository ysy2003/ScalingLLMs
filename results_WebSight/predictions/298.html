<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.logo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100px;
    height: 100px;
    background-color: #f00;
}

.content {
    margin: 100px auto;
    width: 800px;
}

.articles {
    display: flex;
    justify-content: space-between;
}

.article {
    width: 30%;
    padding: 20px;
    background-color: #ccc;
}

.article img {
    width: 100%;
    height: 200px;
    background-color: #00f;
}

.article p {
    margin: 10px 0;
}
</style>
<body>
    <div class="logo"></div>
    <div class="content">
        <div class="articles">
            <div class="article">
                <img src="article1.jpg" alt="Article 1">
                <h2>Article 1</h2>
                <p>This is the first article in the series.</p>
            </div>
            <div class="article">
                <img src="article2.jpg" alt="Article 2">
                <h2>Article 2</h2>
                <p>This is the second article in the series.</p>
            </div>
            <div class="article">
                <img src="article3.jpg" alt="Article 3">
                <h2>Article 3</h2>
                <p>This is the third and final article in the series.</p>
            </div>
        </div>
    </div>
</body>
</html>
