<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.header {
    background-color: #f8f9fa;
    padding: 20px;
    text-align: center;
}

.header img {
    width: 100px;
    height: 100px;
    background-color: #6c757d;
}

.header h1 {
    font-size: 2em;
    color: #212529;
}

.header p {
    font-size: 1.2em;
    color: #212529;
}

.header button {
    background-color: #6c757d;
    color: #fff;
    border: none;
    padding: 15px 32px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
    margin: 4px 2px;
    cursor: pointer;
}

.content {
    padding: 20px;
}

.content div {
    margin-bottom: 20px;
}

.content img {
    width: 100%;
    height: auto;
    background-color: #6c757d;
}

.content h2 {
    font-size: 1.5em;
    color: #212529;
}

.content p {
    font-size: 1em;
    color: #212529;
}

.content button {
    background-color: #6c757d;
    color: #fff;
    border: none;
    padding: 15px 32px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
    margin: 4px 2px;
    cursor: pointer;
}
</style>
<body>
    <div class="header">
        <img src="logo.png" alt="Logo">
        <h1>Welcome to the Tech Hub</h1>
        <p>Find the best tech products and services</p>
        <button>Shop for Products</button>
        <button>Find Services</button>
        <button>Login</button>
    </div>
    <div class="content">
        <div class="product-section">
            <h2>Our Products</h2>
            <img src="product1.png" alt="Product 1">
            <p>Experience the future of tech with our latest product</p>
        </div>
        <div class="service-section">
            <h2>Our Services</h2>
            <img src="service1.png" alt="Service 1">
            <p>We offer the best service in the industry</p>
        </div>
        <div class="login-section">
            <h2>Login</h2>
            <img src="login.png" alt="Login">
            <p>Securely access your account</p>
        </div>
        <div class="contact-section">
            <h2>Contact Us</h2>
            <img src="contact.png" alt="Contact">
            <p>Get in touch with us</p>
        </div>
        <div class="blog-section">
            <h2>Blog</h2>
            <img src="blog1.png" alt="Blog 1">
            <p>Read our latest insights</p>
        </div>
    </div>
</body>
</html>
