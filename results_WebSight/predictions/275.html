<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    background-color: #d3e4f1;
    padding: 20px;
    text-align: center;
}

.header .logo {
    width: 100px;
    height: 100px;
    background-color: #d3e4f1;
    margin: 0 auto;
    display: block;
    line-height: 100px;
    text-align: center;
    color: #333;
}

.header .tagline {
    font-size: 24px;
    margin-top: 10px;
    color: #333;
}

.nav {
    background-color: #d3e4f1;
    padding: 10px;
}

.nav a {
    margin-right: 10px;
    color: #333;
    text-decoration: none;
}

.content {
    padding: 20px;
}

.footer {
    background-color: #d3e4f1;
    padding: 10px;
    text-align: center;
    color: #333;
}

.product {
    width: 30%;
    float: left;
    margin: 1.66%;
    padding: 10px;
    background-color: #d3e4f1;
}

.product img {
    width: 100%;
    height: 200px;
    background-color: blue;
}

.product p {
    margin-top: 10px;
}

.cta {
    background-color: #f18742;
    color: #333;
    padding: 10px;
    text-align: center;
    display: block;
    width: 100%;
    margin-top: 20px;
}
</style>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <p>Company Name</p>
            </div>
            <div class="tagline">
                <p>Visionary Quotes</p>
            </div>
            <div class="nav">
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
        </div>
        <div class="content">
            <div class="product">
                <h2>Product 1</h2>
                <img src="product1.jpg" alt="Product 1">
                <p>A brief description of product 1.</p>
                <p>$19.99</p>
            </div>
            <div class="product">
                <h2>Product 2</h2>
                <img src="product2.jpg" alt="Product 2">
                <p>A brief description of product 2.</p>
                <p>$29.99</p>
            </div>
            <div class="product">
                <h2>Product 3</h2>
                <img src="product3.jpg" alt="Product 3">
                <p>A brief description of product 3.</p>
                <p>$39.99</p>
            </div>
        </div>
        <div class="footer">
            <p>© 2022 Home Improvement Store. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
