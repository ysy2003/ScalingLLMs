<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.header {
    background-color: #f5f5f5;
    padding: 20px;
    text-align: center;
}

.header h1 {
    font-size: 2em;
}

.header input[type="text"] {
    width: 200px;
    padding: 10px;
    border: 1px solid #333;
}

.header button {
    background-color: #f5f5f5;
    padding: 10px;
    border: none;
    cursor: pointer;
}

.content {
    margin: 0 auto;
    width: 80%;
    padding: 20px;
}

.content h2 {
    font-size: 1.5em;
    text-align: center;
}

.content p {
    font-size: 1em;
    line-height: 1.5em;
}

.content img {
    width: 100%;
    height: auto;
}
</style>
<body>
    <div class="header">
        <h1>Deals of the Day</h1>
        <input type="text" placeholder="Search...">
        <button>Book Now</button>
    </div>
    <div class="content">
        <h2>Welcome to Deals of the Day</h2>
        <p>Get the best deals on the market with our exclusive deals of the day. Check out our latest deals and save big.</p>
        <img src="https://via.placeholder.com/150" alt="Deals of the Day">
    </div>
    <div class="footer">
        <h2>Footer</h2>
        <p>Stay informed with our latest updates and news. Check out our social media pages for the latest updates.</p>
        <img src="https://via.placeholder.com/150" alt="Footer">
    </div>
</body>
</html>
