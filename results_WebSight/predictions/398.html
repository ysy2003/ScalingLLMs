<html>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

header {
    background-color: #f5f5f5;
    padding: 20px 0;
}

nav ul {
    list-style-type: none;
    padding: 0;
}

nav ul li {
    display: inline;
    margin: 0 10px;
}

nav ul li a {
    text-decoration: none;
    color: #333;
    font-size: 18px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-gap: 20px;
    margin: 20px 0;
}

.product-item {
    background-color: #f5f5f5;
    padding: 20px;
    border-radius: 5px;
}

.product-item h2 {
    margin-bottom: 10px;
}

.product-item p {
    color: #666;
}

.social-media-links {
    display: flex;
    justify-content: space-between;
}

.social-media-links a {
    text-decoration: none;
    color: #333;
    padding: 10px;
    border: 1px solid #333;
    border-radius: 5px;
}

footer {
    background-color: #f5f5f5;
    padding: 20px;
    text-align: center;
}

footer a {
    color: #333;
    text-decoration: none;
}
</style>
<body>
    <div class="container">
        <header>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">World</a></li>
                    <li><a href="#">Categories</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <div class="product-grid">
                <!-- Product items -->
                <div class="product-item">
                    <h2>Product 1</h2>
                    <p>The first product is a high-quality product with a unique design.</p>
                    <div class="social-media-links">
                        <a href="#">Facebook</a>
                        <a href="#">Twitter</a>
                        <a href="#">Instagram</a>
                    </div>
                </div>
                <!-- More product items -->
            </div>
            <div class="product-item">
                <h2>Product 2</h2>
                <p>The second product is a high-quality product with a unique design.</p>
                <div class="social-media-links">
                    <a href="#">Facebook</a>
                    <a href="#">Twitter</a>
                    <a href="#">Instagram</a>
                </div>
            </div>
            <!-- More product items -->
        </main>
        <footer>
            <!-- Footer content -->
        </footer>
    </div>
</body>
</html>
