<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design to Code</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
    }
   .logo {
      width: 80px;
      height: 80px;
      background-color: #0000ff;
    }
    nav {
      display: flex;
      justify-content: space-between;
      width: 60%;
      flex-wrap: wrap;
    }
   .nav-left,.nav-right {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 45%;
    }
   .nav-item {
      margin: 0.5rem 0;
      text-decoration: none;
      color: #000000;
      font-size: 1rem;
    }
    main {
      display: flex;
      justify-content: space-between;
      padding: 3rem 2rem;
      width: 100%;
    }
   .main-item {
      text-decoration: underline;
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
    }
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
     .logo {
        margin-bottom: 1rem;
      }
      nav {
        width: 100%;
        flex-direction: column;
      }
     .nav-left,.nav-right {
        width: 100%;
      }
      main {
        flex-direction: column;
        align-items: center;
      }
     .main-item {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <nav>
      <div class="nav-left">
        <a href="#" class="nav-item">Z Painting</a>
        <a href="#" class="nav-item">Z Securities</a>
        <a href="#" class="nav-item">Art</a>
      </div>
      <div class="nav-right">
        <a href="#" class="nav-item">About</a>
        <a href="#" class="nav-item">Contact</a>
        <a href="#" class="nav-item">Boutique</a>
      </div>
    </nav>
  </header>
  <main>
    <div class="main-item">ZEconomy</div>
    <div class="main-item">Art</div>
  </main>
</body>
</html>
