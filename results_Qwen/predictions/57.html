<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #4ecdc4;
      font-family: Arial, sans-serif;
    }
   .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
   .circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #0000ff;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 0;
    }
    p {
      font-size: 1rem;
      color: #555;
      margin: 0 0 20px 0;
    }
   .button {
      background-color: #ffcc00;
      padding: 15px 20px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
   .mission {
      font-size: 1.2rem;
      color: #333;
      margin-top: 20px;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="circle"></div>
    <h1>Gabe Charbonneau</h1>
    <p>Physician entrepreneur disrupting the healthcare status quo</p>
    <div class="button">Join Medicine Forward! →</div>
    <div class="button">Burnout Warriors</div>
    <div class="button">Check burnout risk (2-min)</div>
    <div class="button">Download SwiftWire EHR macro app (free & open source)</div>
    <div class="mission">On a mission to ↑ compassion & flourishing for everyone ♥</div>
  </div>
</body>
</html>
