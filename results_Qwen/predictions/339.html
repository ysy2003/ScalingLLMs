<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Jobs</title>
  <style>
   .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
   .text-container {
      display: flex;
      width: 100%;
      justify-content: space-between;
    }
   .black-section {
      width: 50%;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
   .green-section {
      width: 50%;
      background-color: #4CAF50;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      color: white;
      font-size: 4rem;
      font-weight: bold;
      text-transform: uppercase;
    }
   .message {
      color: white;
      font-size: 1.2rem;
      text-align: center;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-container">
      <div class="black-section">
        <h1>GLOBAL</h1>
      </div>
      <div class="green-section">
        <h1>JOBS</h1>
      </div>
    </div>
    <div class="message">
      HELLO, WE WILL BE RIGHT BACK VERY SHORTLY.
    </div>
  </div>
</body>
</html>
