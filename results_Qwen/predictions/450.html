<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    header {
      background-color: #1877f2;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
    }
   .content {
      max-width: 400px;
      margin: 20px auto;
      text-align: left;
      padding: 20px;
      background-color: white;
      border-radius: 4px;
    }
   .content p {
      margin-top: 0;
      font-size: 14px;
      color: #555;
    }
   .form-group {
      margin-bottom: 15px;
    }
   .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
   .form-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
   .btn {
      background-color: #1877f2;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: block;
      width: 100%;
      margin-top: 5px;
    }
   .btn:hover {
      background-color: #1266d3;
    }
   .forgot {
      display: block;
      text-align: center;
      margin: 10px 0;
      color: #555;
      font-size: 12px;
    }
   .create-account {
      background-color: #42b983;
      margin-top: 10px;
    }
   .create-account:hover {
      background-color: #38a169;
    }
  </style>
</head>
<body>
  <header>
    <h1>Facebook</h1>
  </header>
  <div class="content">
    <p>Log into your Facebook account to share.</p>
    <form>
      <div class="form-group">
        <label for="email">Email or phone:</label>
        <input type="text" id="email" name="email">
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
      </div>
      <button type="submit" class="btn">Log In</button>
      <a href="#" class="forgot">Forgot account?</a>
      <button type="button" class="btn create-account">Create new account</button>
    </form>
  </div>
</body>
</html>
