<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body {
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
   .blue-square {
      width: 100px;
      height: 100px;
      background-color: #0000ff;
      margin: 20px auto;
      border-radius: 4px;
      display: block;
    }
   .login-container {
      width: 400px;
      max-width: 90%;
      margin: 20px auto;
      border: 1px solid #ccc;
      padding: 20px;
      background: white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      border-radius: 4px;
    }
   .login-container h2 {
      text-align: center;
      margin-top: 0;
      font-size: 1.2em;
      color: #333;
    }
   .login-container form {
      display: block;
      margin: 0;
      padding: 0;
    }
   .login-container label {
      display: block;
      margin: 8px 0;
      font-weight: bold;
    }
   .login-container input[type="text"],
   .login-container input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin: 5px 0;
    }
   .login-container label input[type="checkbox"] {
      display: inline;
      margin: 0 5px;
    }
   .login-container button {
      background: #333;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px 0;
      display: block;
      margin: 0 auto;
    }
   .login-container a {
      color: #0066cc;
      text-decoration: none;
      display: block;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="blue-square"></div>
  <div class="login-container">
    <h2>Please Log In</h2>
    <form>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password">
      <label>
        <input type="checkbox" id="remember" name="remember"> Remember me for 2 weeks
      </label>
      <button type="submit">Log In</button>
      <a href="#">I forgot my password</a>
    </form>
  </div>
</body>
</html>
