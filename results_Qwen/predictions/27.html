<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEGWAY Guided TOURS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f5f5f5;
    }

   .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    header {
      background: white;
      padding: 1rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav ul {
      display: flex;
      gap: 1rem;
    }

    nav a {
      text-decoration: none;
      color: #333;
    }

   .search {
      margin: 1rem 0;
    }

   .search-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

   .search-bar input {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 4px;
      background: #f5f5f5;
    }

   .search-bar button {
      background: #009688;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }

   .breadcrumbs {
      margin: 1rem 0;
    }

   .breadcrumbs ul {
      display: flex;
      gap: 0.5rem;
      list-style: none;
    }

   .breadcrumbs li a {
      text-decoration: none;
      color: #666;
      padding: 0.2rem;
      border-bottom: 1px solid #eee;
    }

    main {
      margin: 1rem 0;
    }

    main h2 {
      font-size: 1.8rem;
      margin: 1rem 0;
    }

   .list-date {
      font-size: 0.9rem;
      color: #666;
      margin: 0.5rem 0;
    }

   .tour-section {
      background: #0000ff;
      padding: 1rem;
      margin: 1rem 0;
      position: relative;
    }

   .tour-label {
      position: absolute;
      top: 0;
      left: 0;
      background: #009688;
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: bold;
    }

   .tour-image-placeholder {
      width: 100%;
      height: 300px;
      background: #0000ff;
    }

   .tour-list {
      margin: 1rem 0;
    }

   .tour-list p {
      margin: 0.5rem 0;
    }

   .tour-list a {
      text-decoration: none;
      color: #009688;
    }

   .tour-count {
      font-size: 0.9rem;
      color: #666;
      margin: 1rem 0;
    }

   .additional-section {
      margin: 1rem 0;
    }

   .additional-section h3 {
      font-size: 1.5rem;
      margin: 1rem 0;
    }

   .additional-section p {
      margin: 0.5rem 0;
    }

   .stats {
      background: #eee;
      padding: 1rem 0;
      text-align: center;
    }

   .stats.container {
      display: flex;
      justify-content: space-around;
      gap: 2rem;
    }

   .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

   .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
    }

   .stat-label {
      font-size: 0.9rem;
      color: #666;
    }

   .cta {
      background: #009688;
      color: white;
      padding: 2rem 0;
      text-align: center;
    }

   .cta h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

   .cta-btn {
      background: white;
      color: #009688;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    footer {
      background: #333;
      color: white;
      padding: 1rem 0;
      text-align: center;
    }

   .footer-links {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 1rem 0;
    }

   .footer-links ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

   .footer-links a {
      text-decoration: none;
      color: white;
    }

    footer p {
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>SEGWAY Guided TOURS</h1>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Find Segway Tours</a></li>
          <li><a href="#">Browse Tours</a></li>
          <li><a href="#">For Tour Operators</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="search">
    <div class="container">
      <div class="search-bar">
        <input type="text" placeholder="Tour Location...">
        <button class="find-btn">FIND</button>
      </div>
    </div>
  </section>

  <section class="breadcrumbs">
    <div class="container">
      <nav>
        <ul>
          <li><a href="#">USA</a></li>
