<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidy Cleaning Solutions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #ffffff;
    }

    header {
      background-color: #ffffff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #e2e8f0;
    }

   .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

   .menu-icon {
      font-size: 1.5rem;
      cursor: pointer;
      color: #2D3748;
    }

   .logo {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2D3748;
      text-decoration: none;
    }

   .nav-buttons {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

   .btn {
      text-decoration: none;
      color: #2D3748;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
      transition: color 0.2s;
    }

   .btn:hover {
      color: #1a202c;
    }

   .get-quote {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

   .call-now {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

   .hero {
      text-align: center;
      padding: 4rem 2rem;
      margin: 0 auto;
      max-width: 800px;
    }

    h1 {
      font-size: 3rem;
      color: #2D3748;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      font-size: 1.2rem;
      color: #6C757D;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

   .cta-button {
      background-color: #4A5568;
      color: white;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

   .cta-button:hover {
      background-color: #3A4A5D;
    }

   .blue-section {
      background-color: #0066FF;
      height: 300px;
      width: 100%;
      margin: 2rem 0;
    }

   .cookie-bar {
      background-color: #f8f9fa;
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 999;
      border-top: 1px solid #e2e8f0;
    }

   .close-cookie {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #6C757D;
      transition: color 0.2s;
    }

   .close-cookie:hover {
      color: #4A5568;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }

      p {
        font-size: 1rem;
      }

     .cta-button {
        padding: 0.6rem 1.5rem;
        font-size: 1rem;
      }

     .blue-section {
        height: 250px;
      }

     .header-container {
        flex-direction: column;
        align-items: flex-start;
      }

     .nav-buttons {
        margin-top: 1rem;
        gap: 0.5rem;
      }

     .logo {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="menu-icon">☰</div>
      <a href="#" class="logo">Tidy Cleaning Solutions</a>
      <div class="nav-buttons">
        <a href="#" class="btn get-quote"><i>📄</i> Get Quote</a>
        <a href="#" class="btn call-now"><i>📞</i> Call Now</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Tidy Cleaning Solutions</h1>
      <p>Commercial Cleaning Service<br>Open 24 hours</p>
      <button class="cta-button">GET QUOTE</button>
    </section>
    <section class="blue-section"></section>
  </main>

  <footer class="cookie-bar">
    <p>This site uses cookies from Google. <a href="#">Learn more</a></p>
    <button class="close-cookie">X</button>
  </footer>
</body>
</html>
