<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Care Options in Shellman, GA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f5f5f5;
    }

   .top-nav {
      background-color: #0066cc;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

   .top-nav-left,.top-nav-right {
      display: flex;
      gap: 15px;
    }

   .top-nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

   .breadcrumb {
      background-color: #f5f5f5;
      padding: 10px 20px;
      font-size: 14px;
      color: #666;
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }

   .breadcrumb a {
      color: #666;
      text-decoration: none;
    }

   .main-content {
      display: flex;
      margin: 20px;
      gap: 20px;
    }

   .left-column {
      flex: 1;
    }

   .right-column {
      flex: 0 0 300px;
      background-color: #f5f5f5;
      padding: 20px;
      border-radius: 5px;
    }

    h1 {
      text-align: center;
      margin: 20px 0;
      font-size: 24px;
    }

    p {
      text-align: center;
      margin: 10px 0;
      font-size: 16px;
      color: #666;
    }

   .care-types {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

   .care-type {
      background-color: #0066cc;
      color: white;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: background-color 0.3s;
    }

   .care-type:hover {
      background-color: #0055a0;
    }

   .care-types > :nth-child(11) {
      grid-column: span 2;
    }

   .popular-searches,.popular-areas,.all-care-types {
      margin: 20px 0;
      padding: 0 20px;
    }

   .popular-searches h2,.popular-areas h2,.all-care-types h2 {
      margin-bottom: 10px;
      font-size: 18px;
    }

   .searches,.areas,.care-types-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

   .searches a,.areas a,.care-types-list a {
      text-decoration: none;
      color: #333;
      padding: 8px;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

   .searches a:hover,.areas a:hover,.care-types-list a:hover {
      background-color: #f0f0f0;
    }

   .disclaimer {
      background-color: #fff;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-style: italic;
      font-size: 14px;
    }

    footer {
      background-color: #003366;
      color: white;
      padding: 20px;
      text-align: center;
    }

    footer nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 10px;
    }

    footer a {
      color: white;
      text-decoration: none;
    }

    footer p {
      margin-top: 10px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
     .main-content {
        flex-direction: column;
      }
     .right-column {
        width: 100%;
      }
     .care-types {
        grid-template-columns: 1fr;
      }
     .care-types > :nth-child(11) {
        grid-column: span 1;
      }
     .searches,.areas,.care-types-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <div class="top-nav-left">
      <a href="#">Request Demo</a>
      <a href="#">Contact Us</a>
    </div>
    <div class="top-nav-right">
      <a href="#">Log In</a>
      <a href="#">Sign Up</a>
    </div>
  </div>

  <div class="breadcrumb">
    Provider Directory / Georgia / Shellman
  </div>

  <div class="main-content">
    <div class="left-column">
      <h1>Find and Compare Senior Care and Housing Options in Shellman, GA</h1>
      <p>Shellman Assisted Living, Senior Care Services, Homes and More for the Elderly</p>

      <div class="care-types">
        <button class="care-type">Assisted Living<br>Shellman</button>
        <button class="care-type">Senior Living<br>Shellman</button>
        <button class="care-type">Nursing Homes<br>Shellman</button>
        <button class="care-type">Retirement Homes<br>Shellman</button
