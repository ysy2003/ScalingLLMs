<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Password Protection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
   .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    
    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #333;
      font-weight: 600;
    }
    
    p {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    
   .input-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
      font-size: 0.95rem;
    }
    
    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
      background-color: #fff;
      transition: border-color 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #008060;
      box-shadow: 0 0 0 2px rgba(0, 128, 96, 0.2);
    }
    
    button {
      background-color: #008060;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      display: inline-block;
      width: 100%;
      margin-top: 10px;
    }
    
    button:hover {
      background-color: #006b50;
    }
    
   .owner-link {
      font-size: 0.95rem;
      color: #008060;
      text-decoration: none;
      margin-top: 15px;
      display: inline-block;
    }
    
   .owner-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dr Detail for Less</h1>
    <p>This store is password protected. Use the password to enter the store.</p>
    <div class="input-group">
      <label for="password">Enter store password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit">Enter</button>
    <p>Are you the store owner? <a href="#" class="owner-link">Log in here</a></p>
  </div>
</body>
</html>
